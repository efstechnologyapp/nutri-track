<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<meta name="theme-color" content="#1c4d3e" />
<meta name="description" content="Acompanhe suas metas diárias de calorias e nutrientes com o NutriTrack." />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="NutriTrack" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" href="./icon-192.png" type="image/png" />
<link rel="apple-touch-icon" href="./icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet" />
<script src="https://accounts.google.com/gsi/client" async defer></script>
<title>NutriTrack — seu dia, no seu ritmo</title>
<style>
:root{
  --radius: 0.75rem;
  --bg: #f8f7f2;
  --fg: #18352d;
  --card: #ffffff;
  --primary: #1c4d3e;
  --primary-dark: #28634f;
  --primary-foreground: #ffffff;
  --muted: #71857e;
  --border: #e2e9df;
  --accent: #d3e9b9;
}
*{ box-sizing: border-box; }
html{ min-width: 320px; background: var(--bg); }
body{
  margin: 0; min-width: 320px; background: var(--bg); color: var(--fg);
  font-family: 'DM Sans', 'Segoe UI', Arial, sans-serif; -webkit-font-smoothing: antialiased;
  line-height: 1.45;
}
button, input, textarea{ font: inherit; color: inherit; }
button{ cursor: pointer; border: none; background: none; padding: 0; }
input, textarea{ border-radius: var(--radius); }
.font-display{ font-family: 'Fraunces', Georgia, serif; }
a{ color: inherit; }
svg{ display: block; }
.icon{ width: 1em; height: 1em; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
.spin{ animation: spin 0.9s linear infinite; }
@keyframes spin{ to{ transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce){ *,*::before,*::after{ animation-duration: 1ms !important; transition-duration: 1ms !important; } }

/* ---------- telas de autenticação (login / cadastro / confirmar) ---------- */
.auth-page{ display:flex; min-height:100vh; align-items:center; justify-content:center; background:var(--bg); padding:40px 20px; color:var(--fg); }
.auth-box{ width:100%; max-width:400px; }
.brand-row{ margin-bottom:32px; display:flex; align-items:center; justify-content:center; gap:12px; }
.brand-icon{ display:flex; height:44px; width:44px; align-items:center; justify-content:center; border-radius:16px; background:var(--primary); color:#e7f5c7; box-shadow:0 8px 24px rgba(28,77,62,0.18); font-size:21px; }
.brand-title{ font-size:20px; font-weight:600; letter-spacing:-0.03em; }
.brand-title span{ color:#78a55b; }
.brand-sub{ font-size:11px; font-weight:500; text-transform:uppercase; letter-spacing:0.16em; color:#779087; }
.auth-card{ border-radius:28px; border:1px solid var(--border); background:var(--card); padding:28px; box-shadow:0 10px 28px rgba(43,73,53,0.06); }
.auth-card h1{ margin:0; font-size:24px; font-weight:600; color:#1b3f34; }
.auth-card .sub{ margin:4px 0 0; font-size:14px; color:var(--muted); }
.form-stack{ margin-top:24px; display:flex; flex-direction:column; gap:12px; }
.field-label{ display:block; margin-bottom:6px; font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:0.1em; color:#9aa9a1; }
.field-input{ width:100%; border-radius:12px; border:1px solid #dce5db; background:#f7f9f5; padding:12px 14px; font-size:14px; color:#18352d; outline:none; }
.medida-nota-textarea{ resize:none; line-height:1.5; font-family:inherit; }
.field-input::placeholder{ color:#9aa9a1; }
.field-input:focus{ border-color:#8fbf78; }
.btn-primary{ margin-top:8px; display:flex; width:100%; align-items:center; justify-content:center; gap:8px; border-radius:12px; background:var(--primary); padding:12px 16px; font-size:14px; font-weight:600; color:#fff; box-shadow:0 8px 20px rgba(28,77,62,0.15); transition:transform .15s, opacity .15s; }
.btn-primary:hover:not(:disabled){ transform:translateY(-2px); }
.btn-primary:disabled{ opacity:0.6; cursor:default; }
.auth-footer{ margin-top:20px; text-align:center; font-size:14px; color:var(--muted); }
.link-btn{ font-weight:600; color:#3d6355; text-decoration:underline; text-underline-offset:2px; }
.link-btn:hover{ color:var(--primary); }
.link-btn-block{ display:block; width:100%; margin-top:12px; text-align:center; font-size:14px; font-weight:500; color:#557268; text-decoration:underline; text-underline-offset:2px; }
.link-btn-block:hover{ color:var(--primary); }
.link-btn-block:disabled{ opacity:0.6; }
.otp-row{ margin-top:24px; display:flex; justify-content:center; gap:8px; }
.otp-box{ height:48px; width:42px; border-radius:12px; border:1px solid #dce5db; background:#f7f9f5; text-align:center; font-size:18px; font-weight:600; color:#18352d; outline:none; }
.otp-box:focus{ border-color:#8fbf78; box-shadow:0 0 0 3px #c5dfa9; }

/* ---------- sidebar ---------- */
.app-shell{ display:flex; min-height:100vh; flex-direction:column; background:var(--bg); color:var(--fg); }
.hamburger-btn{ position:fixed; top:16px; left:16px; z-index:250; display:flex; height:40px; width:40px; align-items:center; justify-content:center; border-radius:999px; border:1px solid var(--border); background:#fff; box-shadow:0 8px 20px rgba(43,73,53,0.1); cursor:pointer; }
.hamburger-btn span{ display:block; width:18px; height:2px; background:#31564a; position:relative; }
.hamburger-btn span::before, .hamburger-btn span::after{ content:''; position:absolute; left:0; width:18px; height:2px; background:#31564a; }
.hamburger-btn span::before{ top:-6px; }
.hamburger-btn span::after{ top:6px; }

.sidebar-overlay{ position:fixed; inset:0; background:rgba(15,32,26,.45); z-index:300; display:none; }
.sidebar-overlay.open{ display:block; }
.sidebar-panel{ position:fixed; top:0; left:0; bottom:0; width:84%; max-width:320px; background:#fff; box-shadow:6px 0 24px rgba(0,0,0,.18); padding:26px 22px; transform:translateX(-100%); transition:transform .22s ease-out; display:flex; flex-direction:column; gap:20px; overflow-y:auto; }
.sidebar-overlay.open .sidebar-panel{ transform:translateX(0); }
.sidebar-panel .brand-row{ margin-bottom:0; justify-content:flex-start; }
.sidebar-close{ align-self:flex-end; background:none; border:none; font-size:0; color:var(--muted); cursor:pointer; padding:4px; margin:-4px -4px 0 0; }
.sidebar-close .icon{ width:20px; height:20px; }

.avatar-wrap{ display:flex; flex-direction:column; align-items:center; margin-top:4px; }
.avatar-circle{ width:84px; height:84px; border-radius:50%; background:#eef6e4; border:2px dashed var(--primary); display:flex; align-items:center; justify-content:center; color:var(--primary); font-size:28px; font-weight:700; overflow:hidden; cursor:pointer; position:relative; flex-shrink:0; }
.avatar-circle img{ width:100%; height:100%; object-fit:cover; }
.sidebar-greeting{ margin-top:12px; text-align:center; }
.sidebar-greeting-ola{ margin:0; font-family:'Fraunces',serif; font-size:17px; font-weight:600; color:#1b3f34; }
.sidebar-greeting-idade{ margin:4px 0 0; font-size:12px; color:#7c8c86; }
.avatar-cam-badge{ position:absolute; bottom:0; right:0; background:var(--primary); color:#fff; width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; border:2px solid #fff; }
.avatar-cam-badge .icon{ width:13px; height:13px; }
.side-card{ border-radius:16px; background:#f7f9f5; padding:16px; }
.side-card-border{ border-radius:16px; border:1px solid #dce8dc; padding:16px; }
.side-label{ font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:0.14em; color:#9aa9a1; }
.side-name{ margin-top:4px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:14px; font-weight:600; color:#31564a; }
.side-email{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:12px; color:#7c8c86; }
.side-text{ margin-top:8px; font-size:12px; color:#7c8c86; }
.btn-outline{ margin-top:12px; display:flex; width:100%; align-items:center; justify-content:center; gap:8px; border-radius:999px; border:1px solid #dce5db; background:#fff; padding:8px 12px; font-size:12px; font-weight:600; color:#557268; transition:background .15s; }
.btn-outline:hover{ background:#f0f3ee; }
.btn-primary-pill{ margin-top:12px; display:flex; width:100%; align-items:center; justify-content:center; gap:8px; border-radius:999px; background:var(--primary); padding:10px 12px; font-size:12px; font-weight:600; color:#fff; box-shadow:0 8px 20px rgba(28,77,62,0.15); transition:transform .15s, opacity .15s; }
.btn-primary-pill:hover:not(:disabled){ transform:translateY(-2px); }
.btn-primary-pill:disabled{ opacity:0.6; }
.google-connected{ margin-top:8px; display:flex; align-items:center; gap:8px; font-size:14px; font-weight:500; color:#4b7048; }
.google-connected span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.btn-danger-outline{ margin-top:auto; display:flex; align-items:center; justify-content:center; gap:8px; border-radius:999px; border:1px solid #f0d9d2; background:#fdf4f1; padding:10px 12px; font-size:12px; font-weight:600; color:#c35e4b; transition:background .15s; }
.btn-danger-outline:hover{ background:#fbe9e3; }

/* ---------- tela bloqueada (sem Google) ---------- */
.locked-page{ display:flex; min-height:100vh; flex-direction:column; align-items:center; justify-content:center; padding:16px; text-align:center; }
.locked-icon{ margin-bottom:20px; display:flex; height:56px; width:56px; align-items:center; justify-content:center; border-radius:999px; background:#eef6e4; color:#4b7048; font-size:24px; }
.locked-title{ margin:0; font-size:26px; font-weight:600; color:#1b3f34; }
.locked-desc{ margin-top:12px; max-width:380px; font-size:14px; line-height:1.7; color:var(--muted); }
.btn-primary-lg{ margin-top:24px; display:flex; align-items:center; gap:8px; border-radius:999px; background:var(--primary); padding:12px 20px; font-size:14px; font-weight:600; color:#fff; box-shadow:0 8px 20px rgba(28,77,62,0.15); transition:transform .15s, opacity .15s; }
.btn-primary-lg:hover:not(:disabled){ transform:translateY(-2px); }
.btn-primary-lg:disabled{ opacity:0.6; }

/* ---------- home ---------- */
.home-content{ flex:1; min-width:0; }
.home-inner{ margin:0 auto; max-width:1200px; padding:0 20px 56px; }
@media (min-width: 640px){ .home-inner{ padding-left:32px; padding-right:32px; } }
@media (min-width: 1024px){ .home-inner{ padding-left:48px; padding-right:48px; } }
.btn-outline-pill{ display:none; align-items:center; gap:8px; border-radius:999px; border:1px solid #dce5db; background:rgba(255,255,255,.7); padding:10px 16px; font-size:14px; font-weight:500; color:#557268; transition:background .15s; }
.btn-outline-pill:hover{ background:#fff; }
@media (min-width: 640px){ .btn-outline-pill{ display:flex; } }
.icon-btn-outline{ display:flex; height:40px; width:40px; align-items:center; justify-content:center; border-radius:999px; border:1px solid #dce5db; background:rgba(255,255,255,.7); color:#557268; }
@media (min-width: 640px){ .icon-btn-outline{ display:none; } }
.btn-primary-pill-lg{ display:flex; align-items:center; gap:8px; border-radius:999px; background:var(--primary); padding:10px 16px; font-size:14px; font-weight:600; color:#fff; box-shadow:0 8px 20px rgba(28,77,62,0.15); transition:transform .15s; }
.btn-primary-pill-lg:hover{ transform:translateY(-2px); }
.btn-primary-pill-lg .label{ display:none; }
@media (min-width: 640px){ .btn-primary-pill-lg .label{ display:inline; } }

.hero{ margin-bottom:32px; display:grid; gap:28px; }
@media (min-width: 1024px){ .hero{ grid-template-columns:1.2fr 0.8fr; align-items:end; } }
.hero-date{ margin-bottom:16px; display:flex; align-items:center; gap:8px; font-size:14px; font-weight:500; color:#789087; }
.hero-title{ margin:0; max-width:640px; font-family:'Fraunces',serif; font-size:clamp(2.4rem,6vw,5.3rem); font-weight:500; line-height:0.96; letter-spacing:-0.065em; color:#1b3f34; }
.hero-title em{ font-style:italic; color:#77a45c; }
.hero-sub{ margin-top:20px; max-width:480px; font-size:15px; line-height:1.75; color:var(--muted); }
.summary-card{ position:relative; overflow:hidden; border-radius:28px; background:#e6f1dc; padding:24px; }
@media (min-width: 640px){ .summary-card{ padding:28px; } }
.summary-ring{ position:absolute; right:-32px; top:-40px; height:144px; width:144px; border-radius:999px; border:18px solid rgba(205,228,189,.8); }
.summary-edit-btn{ position:absolute; top:16px; right:16px; z-index:1; display:flex; height:34px; width:34px; align-items:center; justify-content:center; border-radius:999px; background:rgba(255,255,255,.75); color:#4b7048; transition:background .15s; }
.summary-edit-btn:hover{ background:#fff; }
@media (min-width: 640px){ .summary-edit-btn{ top:20px; right:20px; } }
.summary-inner{ position:relative; }
.summary-label{ display:flex; align-items:center; gap:8px; font-size:14px; font-weight:600; color:#587a50; }
.summary-meta{ margin-top:4px; font-size:12px; font-weight:400; color:#7c9673; }
.summary-stats{ margin-top:20px; display:flex; align-items:flex-end; justify-content:space-between; gap:20px; }
.summary-remaining-value{ font-family:'Fraunces',serif; font-size:36px; font-weight:600; letter-spacing:-0.06em; color:#1d4b3d; }
.summary-remaining-label{ margin-top:4px; font-size:14px; color:#6f8d67; }
.summary-consumed{ text-align:right; }
.summary-consumed-value{ font-size:24px; font-weight:600; letter-spacing:-0.04em; color:#1d4b3d; }
.summary-consumed-label{ margin-top:4px; font-size:14px; color:#6f8d67; }
.progress-track-light{ margin-top:20px; height:8px; overflow:hidden; border-radius:999px; background:rgba(255,255,255,.7); }
.progress-fill-light{ height:100%; border-radius:999px; background:#6f9b59; transition:width .3s; }

.goals-panel{ margin-bottom:28px; border-radius:24px; border:1px solid #dce8dc; background:#fff; padding:20px; box-shadow:0 12px 35px rgba(43,73,53,0.06); }
.goals-panel-head{ margin-bottom:16px; display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
.goals-panel-head h2{ margin:0; font-family:'Fraunces',serif; font-size:20px; font-weight:600; }
.goals-panel-head p{ margin:4px 0 0; font-size:14px; color:#7c8c86; }
.icon-btn-ghost{ border-radius:999px; padding:8px; color:#81918a; }
.icon-btn-ghost:hover{ background:#f3f6f1; }
.goals-calorimetria-ref{ margin-bottom:16px; display:flex; align-items:flex-start; gap:10px; border-radius:16px; background:#fff3ec; padding:14px 16px; font-size:13px; line-height:1.6; color:#7a5a45; }
.goals-calorimetria-ref .icon{ margin-top:2px; flex-shrink:0; color:#d5824f; }
.goals-calorimetria-ref p{ margin:0; }
.goals-calorimetria-ref strong{ color:#5c4634; }
.goals-calorimetria-ref-data{ color:#9c8067; }
.goals-calorimetria-ref-vazio{ background:#f7f9f5; color:#5c6b62; }
.goals-calorimetria-ref-vazio .icon{ color:#8a9c93; }
.goals-calorimetria-ref-link{ font-weight:600; color:#4b7048; text-decoration:underline; text-underline-offset:2px; }
.goals-auto-calc{ margin-bottom:16px; }
.goals-auto-calc-btn{ display:flex; width:100%; align-items:center; justify-content:center; gap:8px; border-radius:12px; background:var(--primary); padding:12px 16px; font-size:14px; font-weight:600; color:#fff; transition:opacity .15s; }
.goals-auto-calc-btn:hover{ opacity:.9; }
.goals-auto-calc-note{ margin:8px 0 0; font-size:12px; line-height:1.6; color:#8a9c93; }
.goals-auto-calc-detalhes{ margin-top:8px; }
.goals-auto-calc-detalhes summary{ cursor:pointer; font-size:12px; font-weight:600; color:#4b7048; list-style:none; }
.goals-auto-calc-detalhes summary::-webkit-details-marker{ display:none; }
.goals-auto-calc-detalhes summary::before{ content:"▸ "; }
.goals-auto-calc-detalhes[open] summary::before{ content:"▾ "; }
.goals-auto-calc-detalhes-corpo{ margin-top:10px; border-radius:14px; background:#f7f9f5; padding:14px 16px; font-size:12px; line-height:1.7; color:#5c6b62; }
.goals-auto-calc-detalhes-corpo p{ margin:0 0 8px; }
.goals-auto-calc-detalhes-corpo p:last-child{ margin-bottom:0; }
.goals-auto-calc-detalhes-corpo strong{ color:#31564a; }
.goals-auto-calc-fontes-titulo{ margin-top:12px !important; font-weight:600; color:#31564a; }
.goals-auto-calc-detalhes-corpo ul{ margin:0 0 8px; padding-left:18px; }
.goals-auto-calc-detalhes-corpo li{ margin-bottom:8px; }
.goals-auto-calc-detalhes-corpo li:last-child{ margin-bottom:0; }
.goals-auto-calc-detalhes-corpo a{ color:#4b7048; text-decoration:underline; text-underline-offset:2px; }
.goals-auto-calc-aviso{ font-style:italic; color:#8a9c93; }
.goals-grid{ display:grid; gap:12px; grid-template-columns:1fr; }
@media (min-width: 640px){ .goals-grid{ grid-template-columns:repeat(2,1fr); } }
@media (min-width: 1024px){ .goals-grid{ grid-template-columns:repeat(5,1fr); } }
.goal-field{ border-radius:16px; background:#f7f9f5; padding:14px; }
.goal-field-head{ margin-bottom:8px; display:flex; justify-content:space-between; font-size:12px; font-weight:600; color:#688077; }
.goal-field-input{ width:100%; background:transparent; border:none; font-family:'Fraunces',serif; font-size:24px; font-weight:600; color:#214c3d; outline:none; }
.goal-objetivo-field{ display:block; margin-bottom:16px; }
.goal-objetivo-field select.goal-field-input{ font-family:inherit; font-size:15px; font-weight:600; cursor:pointer; }
.goal-objetivo-nota{ margin:8px 0 0; font-size:12px; line-height:1.6; color:#8a9c93; }

.nutrient-tabs{ margin-bottom:16px; display:flex; gap:8px; border-bottom:1px solid #e5e9e1; }
.nutrient-tab{ padding:10px 4px; margin-bottom:-1px; border-bottom:2px solid transparent; font-size:14px; font-weight:600; color:#9aa9a1; }
.nutrient-tab.active{ color:#1b3f34; border-bottom-color:var(--primary); }
.nutrient-grid{ margin-bottom:32px; display:grid; gap:16px; grid-template-columns:1fr; }
@media (min-width: 640px){ .nutrient-grid{ grid-template-columns:repeat(2,1fr); } }
@media (min-width: 1280px){ .nutrient-grid{ grid-template-columns:repeat(4,1fr); } }
.nutrient-grid-micro{ grid-template-columns:1fr; }
@media (min-width: 640px){ .nutrient-grid-micro{ grid-template-columns:repeat(2,1fr); } }
@media (min-width: 1280px){ .nutrient-grid-micro{ grid-template-columns:repeat(4,1fr); } }
.nutrient-card{ border-radius:22px; border:1px solid #e5e9e1; background:#fff; padding:20px; box-shadow:0 10px 28px rgba(43,73,53,0.045); }
.nutrient-card-head{ display:flex; align-items:center; justify-content:space-between; }
.nutrient-card-left{ display:flex; align-items:center; gap:10px; }
.nutrient-icon{ display:flex; height:36px; width:36px; align-items:center; justify-content:center; border-radius:12px; font-size:17px; }
.nutrient-name{ font-size:14px; font-weight:600; color:#31564a; }
.nutrient-unit{ font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:0.14em; color:#9aa9a1; }
.nutrient-info-btn{ display:flex; height:20px; width:20px; flex-shrink:0; align-items:center; justify-content:center; border-radius:999px; color:#c3ccc3; margin-left:-4px; }
.nutrient-info-btn:hover{ background:#f2f6ef; color:#6c8d68; }
.nutrient-info-btn .icon{ width:15px; height:15px; }
.nutrient-stats{ margin-top:16px; display:flex; align-items:flex-end; justify-content:space-between; gap:8px; }
.stat-label{ font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:0.14em; color:#9aa9a1; }
.stat-value-row{ margin-top:2px; display:flex; align-items:baseline; gap:4px; }
.stat-value{ font-family:'Fraunces',serif; font-size:28px; font-weight:600; color:#214c3d; }
.stat-unit{ font-size:12px; color:#93a199; }
.stat-goal{ text-align:right; }
.stat-goal-value{ margin-top:4px; font-size:14px; font-weight:600; color:#6e857c; }
.progress-track{ margin-top:12px; height:6px; overflow:hidden; border-radius:999px; background:#edf1ec; }
.progress-fill{ height:100%; border-radius:999px; transition:width .3s; }
.nutrient-delta{ margin-top:8px; display:flex; align-items:center; gap:4px; font-size:12px; font-weight:500; }

.dashboard-grid{ display:grid; gap:24px; grid-template-columns:1fr; }
@media (min-width: 1280px){ .dashboard-grid{ grid-template-columns:minmax(0,1fr) 410px; } }
.meal-card{ border-radius:26px; background:var(--primary); padding:20px; color:#fff; box-shadow:0 18px 40px rgba(28,77,62,0.16); }
@media (min-width: 640px){ .meal-card{ padding:28px; } }
.meal-card-eyebrow{ display:flex; align-items:center; gap:8px; font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:0.15em; color:#a9c9a1; }
.meal-card h2{ margin:8px 0 0; font-family:'Fraunces',serif; font-size:24px; font-weight:600; }

/* .btn-ghost-light foi pensado pro fundo escuro translúcido do resto do app (texto claro sobre fundo
   escuro) -- dentro de um .modal-card (fundo branco, ex.: modal de Cadastrar produto), o mesmo texto
   claro fica quase invisível (relatado pelo usuário). Modificador em vez de trocar de classe, pra manter
   o mesmo tamanho/layout de .btn-ghost-light e só corrigir cor/fundo pro contexto claro -- mesma ideia
   já usada na correção de .meal-textarea -> .field-input (ver comentário em cadastrarProdutoModalTemplate()). */
.btn-ghost-light-onlight{ background:rgba(85,114,104,.06); border-color:#dce5db; color:#3d5a4f; }
.btn-ghost-light-onlight:hover{ background:rgba(85,114,104,.12); }
/* Modal "Cadastrar produto" ficou mais alto depois da aba de cadastro manual (bem mais campos) -- sem
   isso, num celular o cartão ultrapassa a tela e o rodapé (botões Cancelar/Cadastrar produto) fica
   inalcançável (relatado pelo usuário). Cabeçalho/abas ficam fixos, só o miolo (.modal-body) rola, e o
   rodapé fica sempre visível no fim do cartão -- mesma ideia de "conteúdo rolável com altura máxima" já
   usada em .modal-card-wide/.nutrient-info-modal, só que aqui com o rodapé fixo em vez de rolar junto. */

/* ===================== utilidades ===================== */
function readStorage(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch { return fallback; }
}
function writeStorage(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch {} }
// Data de hoje NO FUSO HORÁRIO LOCAL do aparelho -- toISOString() converteria para UTC, o que faz a
// data "virar" cedo demais pra quem mora a oeste de Greenwich (ex.: no horário de Brasília, 3h antes da
// meia-noite local). Monta a string manualmente a partir dos componentes locais (getFullYear/Month/Date)
// em vez de usar toISOString(), que sempre reflete UTC independentemente do fuso do aparelho.
function todayKey() {
  const d = new Date();
  const ano = d.getFullYear();
  const mes = String(d.getMonth() + 1).padStart(2, "0");
  const dia = String(d.getDate()).padStart(2, "0");
  return ano + "-" + mes + "-" + dia;
}
function formatNumber(value, digits) {
  digits = digits || 0;
  return new Intl.NumberFormat("pt-BR", { maximumFractionDigits: digits, minimumFractionDigits: digits }).format(value);
}
function pct(value, goal) { return goal ? Math.min(100, Math.max(0, (value / goal) * 100)) : 0; }
// Lista fixa de chaves de nutrientes (macro + micro) somadas por addNutrients. É uma lista fixa (não
// derivada de Object.keys(nutrientMeta/micronutrientMeta)) de propósito: addNutrients soma tanto
// `food.values` (só nutrientes) quanto registros de refeição inteiros (que têm outros campos, como
// id/name/description) — somar só as chaves conhecidas evita tentar somar "id" ou concatenar "name".
const NUTRIENT_KEYS = ["calories", "protein", "carbs", "fat", "fiber", "vitA", "vitC", "vitD", "vitB12", "calcio", "ferro", "magnesio", "potassio", "zinco", "sodio"];
function addNutrients(a, b) { const out = {}; NUTRIENT_KEYS.forEach((k) => { out[k] = (a[k] || 0) + (b[k] || 0); }); return out; }
function scale(values, m) { const out = {}; for (const k of Object.keys(values)) out[k] = values[k] * m; return out; }
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

/* ===================== toasts ===================== */
function toast(message, type) {
  const container = document.getElementById("toast-container");

  el.className = "toast " + (type === "error" ? "toast-error" : type === "aviso" ? "toast-aviso" : "toast-success");
  el.textContent = message;
  container.appendChild(el);
  setTimeout(() => { el.style.opacity = "0"; el.style.transition = "opacity .25s"; setTimeout(() => el.remove(), 250); }, 3800);
}
const toastSuccess = (m) => toast(m, "success");

/* ===================== backend Apps Script (login/cadastro/confirmação/dados) ===================== */
// URL do "App da Web" publicado no Apps Script. Trocar aqui sempre que reimplantar com uma NOVA
// implantação (versão "Nova versão" mantém a mesma URL e não precisa mexer aqui).
const API_URL = "https://script.google.com/macros/s/AKfycbxdLs586rmwB60PADPkYClm23azB_sV6GefCZPj7AVLWNwGYLleEe_bVEm89kwSRsBx/exec";

async function chamarApi(acao, dados) {
  // Usamos GET (dados na própria URL) em vez de POST: o Apps Script devolve a resposta de um jeito
  // (redirecionamento interno) que o navegador aceita para GET, mas bloqueia por CORS para POST.
  const payload = JSON.stringify(Object.assign({ acao }, dados || {}));
  const url = API_URL + "?data=" + encodeURIComponent(payload);
  const response = await fetch(url, { method: "GET" });
  if (!response.ok) throw new Error("Erro de rede (" + response.status + ")");
  return response.json();
}

/* ===================== conexão com Google (Google Identity Services) ===================== */
// Importante: o back-end (Code.gs) é quem guarda a conexão de forma permanente (um "refresh token"
// salvo junto da conta, do mesmo jeito que já guardamos a senha). Isso significa que o navegador NUNCA
// mais precisa pedir nada ao Google sozinho — a única vez que a tela do Google aparece é quando a
// pessoa clica no botão "Conectar Google" (ver acaoConectarGoogle). Reabrir o app, trocar de aparelho
// ou fazer login de novo NUNCA aciona o Google: eles apenas perguntam ao nosso próprio servidor
// (authApi.carregarDadosGoogle) se a conta já está conectada, e ele responde com os dados guardados.
// O Client ID de app Web NÃO é segredo — é protegido pelas "Origens JavaScript autorizadas"
// configuradas no Google Cloud Console, por isso pode ficar direto no código do front-end.
const GOOGLE_CLIENT_ID = "324458100746-em71t2toc30d96up3adov613eljubt6h.apps.googleusercontent.com";
const GOOGLE_SCOPES = ["openid", "email", "profile", "https://www.googleapis.com/auth/spreadsheets", "https://www.googleapis.com/auth/drive.file"].join(" ");

function waitForGis() {
  return new Promise((resolve) => {
    (function check() {
      if (window.google && window.google.accounts && window.google.accounts.oauth2) resolve();
      else setTimeout(check, 150);
    })();
  });
}
// Só é chamada dentro de acaoConectarGoogle, ou seja, só a partir de um clique explícito da pessoa —
// nunca automaticamente. Pede um "código de autorização" (não um token) para o back-end trocar por um
// acesso permanente.
async function solicitarCodigoGoogle() {
  await waitForGis();
  return new Promise((resolve, reject) => {
    const client = window.google.accounts.oauth2.initCodeClient({
      client_id: GOOGLE_CLIENT_ID,
      scope: GOOGLE_SCOPES,
      ux_mode: "popup",
      access_type: "offline",
      prompt: "consent",
      callback: (resposta) => {
        if (resposta && resposta.code) resolve(resposta.code);
        else reject(new Error("Conexão cancelada."));
      },
      error_callback: () => reject(new Error("Não foi possível conectar ao Google.")),
    });
    client.requestCode();
  });
}
function mergeMeals(local, remote) {
  const byId = new Map();
  for (const m of local) byId.set(m.id, m);
  for (const m of remote) if (!byId.has(m.id)) byId.set(m.id, m);
  return Array.from(byId.values()).sort((a, b) => a.id - b.id);
}
const mergeMedidas = mergeMeals;

/* ===================== reconhecimento de alimentos (igual ao original) ===================== */
const nutrientMeta = {

  fiber: { label: "Fibras", unit: "g", color: "#71945c", soft: "#eef5e9", icon: "leaf" },

// Objetivos disponíveis no seletor do formulário de metas. Cada um define dois parâmetros usados pra
// sugerir a meta de calorias e a proteína automaticamente (ver sugerirCaloriasPorObjetivo() e
// calcularMacrosAutomaticos() logo abaixo):
// - ajusteCalorias(get): como ajustar o Gasto Energético Total (da Calorimetria) pra chegar na meta de
//   calorias sugerida pro objetivo.
// - proteinaPorKg: gramas de proteína por kg de peso corporal usados no cálculo automático de macros.
// As referências de cada valor estão na legenda do formulário (goalsPanelTemplate()).
const OBJETIVOS_META = {
  emagrecimento: { label: "Emagrecimento", ajusteCalorias: (get) => get - 500, proteinaPorKg: 1.6 },
  manutencao: { label: "Manutenção do peso", ajusteCalorias: (get) => get, proteinaPorKg: 1.4 },
  ganho_massa: { label: "Ganho de peso / massa muscular", ajusteCalorias: (get) => get * 1.15, proteinaPorKg: 1.8 },
  definicao: { label: "Definição muscular / recomposição corporal", ajusteCalorias: (get) => get * 0.90, proteinaPorKg: 1.8 },
  performance: { label: "Performance esportiva / resistência", ajusteCalorias: (get) => get, proteinaPorKg: 1.6 },
  saude: { label: "Saúde geral / bem-estar", ajusteCalorias: (get) => get, proteinaPorKg: 1.4 },
};

// Frase que descreve a fórmula de ajuste de calorias de cada objetivo, em texto -- usada na legenda
// de fonte da aba Macronutrientes (macroFonteNotaTemplate()). Espelha os mesmos ajustes de
// OBJETIVOS_META[chave].ajusteCalorias, só que descritos por extenso pro usuário.
const OBJETIVO_CALORIA_TEXTO = {
  emagrecimento: "seu GET menos 500 kcal/dia (déficit para perda de peso)",
  manutencao: "o seu GET (gasto energético total), sem ajuste",
  ganho_massa: "seu GET mais 15% (superávit para ganho de peso/massa muscular)",
  definicao: "seu GET menos 10% (déficit moderado para definição/recomposição)",
  performance: "o seu GET (gasto energético total), sem ajuste",
  saude: "o seu GET (gasto energético total), sem ajuste",
};

// Sugere a meta de calorias a partir do GET (Gasto Energético Total, da Calorimetria) e do objetivo
// escolhido -- só é usada quando a pessoa tem os dois cadastrados (ver acaoCalcularMacrosAutomaticos()).
// Nunca sugere um valor abaixo da TMB (Taxa Metabólica Basal): é o gasto mínimo do corpo em repouso, e
// nenhum dos ajustes por objetivo deve levar a meta abaixo disso.
function sugerirCaloriasPorObjetivo(get, objetivo, tmb) {
  const cfg = OBJETIVOS_META[objetivo];
  if (!cfg || !get) return null;
  let calorias = Math.round(cfg.ajusteCalorias(Number(get)));
  if (tmb) calorias = Math.max(calorias, Math.round(Number(tmb)));
  return calorias;

// Calcula proteína/carboidrato/gordura/fibra a partir só da meta de calorias (e, se disponível, do
// peso da última bioimpedância) usando os parâmetros de referência das Dietary Reference Intakes e
// das Dietary Guidelines for Americans 2025-2030:
// - Proteína: por padrão, 1,4 g/kg (meio da faixa de 1,2-1,6 g/kg recomendada pelas DGA 2025-2030 pra
//   controle de peso) quando o peso é conhecido; senão, 20% das calorias (dentro do AMDR de 10-35%).
//   Quando a pessoa escolhe um objetivo (ver OBJETIVOS_META acima), a proteína por kg muda pra refletir
//   esse objetivo -- ver a legenda do formulário pras referências de cada valor.
// - Carboidrato: pelo menos 130 g/dia (RDA baseada no uso mínimo de glicose pelo cérebro) ou 45% das
//   calorias (piso do AMDR), o que for maior.
// - Gordura: o restante das calorias, nunca abaixo de 20% (piso do AMDR, necessário pros ácidos graxos
//   essenciais e pra absorção das vitaminas lipossolúveis) — se sobrar menos que isso, tira a diferença
//   do carboidrato (nunca da proteína), respeitando o piso de 130 g.
// - Fibra: 14 g a cada 1.000 kcal (Ingestão Adequada).
// Esses são valores de referência gerais, não substituem orientação profissional individualizada.
function calcularMacrosAutomaticos(calorias, pesoKg, objetivo) {
  calorias = Math.max(0, Number(calorias) || 0);
  if (!calorias) return null;

  const proteinaPorKg = (objetivo && OBJETIVOS_META[objetivo]) ? OBJETIVOS_META[objetivo].proteinaPorKg : 1.4;
  let proteinKcal = pesoKg ? pesoKg * proteinaPorKg * 4 : calorias * 0.20;
  proteinKcal = Math.min(proteinKcal, calorias * 0.35); // nunca ultrapassa o teto do AMDR (35%)

  const carbFloorKcal = 130 * 4;
  let carbKcal = Math.max(calorias * 0.45, carbFloorKcal);

  let fatKcal = calorias - proteinKcal - carbKcal;
  const fatFloorKcal = calorias * 0.20;
  if (fatKcal < fatFloorKcal) {
    const falta = fatFloorKcal - fatKcal;
    carbKcal = Math.max(carbFloorKcal, carbKcal - falta);
    fatKcal = calorias - proteinKcal - carbKcal;
  }
  fatKcal = Math.max(0, fatKcal);

  return {
    protein: Math.round(proteinKcal / 4 * 10) / 10,
    carbs: Math.round(carbKcal / 4 * 10) / 10,
    fat: Math.round(fatKcal / 9 * 10) / 10,
    fiber: Math.round(calorias / 1000 * 14),
  };
}

// dos frascos de suplemento (ex.: "5000 UI"), diferente das demais vitaminas/minerais daqui, que só
// aparecem em mcg/mg. Por isso, em todo lugar do app onde um valor de vitamina D em mcg é mostrado pro

// doseAmountForFood() pros alimentos de suplementação (1 mcg = 40 UI, ou seja 1 UI = 0,025 mcg).
const VITAMINA_D_MCG_PARA_UI = 40;
function formatVitaminaDComUI(mcg, digitsMcg) {
  const valor = mcg || 0;

const MEAL_TIPOS = ["Caf\u00e9 da manh\u00e3", "Lanche da manh\u00e3", "Almo\u00e7o", "Lanche da tarde", "Jantar", "Ceia", "Suplementa\u00e7\u00e3o", "Exposi\u00e7\u00e3o Solar", "Outro"];
// Posi\u00e7\u00e3o de uma refei\u00e7\u00e3o na ordem do seletor de tipos (MEAL_TIPOS) -- usada por
// ordenarPorTipoDeRefeicao() logo abaixo pra exibir as refei\u00e7\u00f5es de um dia sempre na ordem em que os
// tipos aparecem no seletor (Caf\u00e9 da manh\u00e3, Lanche da manh\u00e3, Almo\u00e7o, ...), nunca na ordem em que
// foram REGISTRADAS. Uma refei\u00e7\u00e3o "Outro" com nome pr\u00f3prio (ex.: "Bolo de anivers\u00e1rio") n\u00e3o bate
// literalmente com nenhum item de MEAL_TIPOS -- o nome guardado \u00e9 o texto digitado, n\u00e3o a palavra
// "Outro" (ver acaoSalvarRefeicao()) -- ent\u00e3o cai no mesmo lugar que "Outro" ocuparia no seletor (por
// padr\u00e3o, por \u00faltimo).
function indiceTipoRefeicao(nome) {
  const i = MEAL_TIPOS.indexOf(nome);
  return i === -1 ? MEAL_TIPOS.indexOf("Outro") : i;
}
// Reordena uma lista de refei\u00e7\u00f5es pela ordem dos tipos no seletor (MEAL_TIPOS), n\u00e3o pela ordem de
// registro -- pedido do usu\u00e1rio: se a pessoa s\u00f3 lembrar de registrar o almo\u00e7o DEPOIS de j\u00e1 ter
// registrado a janta ou a ceia daquele dia, o almo\u00e7o deve aparecer ACIMA da janta/ceia na lista, mesmo
// tendo sido salvo por \u00faltimo. Refei\u00e7\u00f5es do MESMO tipo (ex.: duas "Lanche da tarde" no mesmo dia)
// mant\u00eam a ordem relativa entre si (sort() \u00e9 est\u00e1vel em todos os motores usados aqui), que \u00e9 a ordem
// de registro (a lista de entrada j\u00e1 vem nessa ordem, por constru\u00e7\u00e3o) -- faz mais sentido cronol\u00f3gico
// do que reordenar por hor\u00e1rio digitado manualmente.
function ordenarPorTipoDeRefeicao(meals) {
  return meals.slice().sort((a, b) => indiceTipoRefeicao(a.name) - indiceTipoRefeicao(b.name));
}

/* ===================== exposi\u00e7\u00e3o solar (vitamina D) ===================== */
// O sol \u00e9 a principal fonte de vitamina D do corpo (a pele sintetiza a partir da radia\u00e7\u00e3o UVB) -- essa
// se\u00e7\u00e3o estima quanto foi sintetizado numa exposi\u00e7\u00e3o, a partir do hor\u00e1rio de in\u00edcio/fim, do \u00edndice UV
// real do local (via geolocaliza\u00e7\u00e3o do dispositivo + API p\u00fablica Open-Meteo, sem chave de acesso) e do
// tipo de pele cadastrado no perfil do usu\u00e1rio (ver TIPOS_PELE/editarPerfilTemplate()). Quando a
// localiza\u00e7\u00e3o n\u00e3o \u00e9 autorizada ou a busca do \u00edndice UV falha (sem internet, API fora do ar), o app cai
// automaticamente pro modo manual (a pessoa informa como estava o c\u00e9u) -- ver
// exposicaoSolarCamposTemplate()/acaoObterLocalizacaoExposicao(). N\u00e3o \u00e9 uma medi\u00e7\u00e3o real (s\u00f3 exame de
// sangue mostra o n\u00edvel de verdade) -- \u00e9 uma ESTIMATIVA com base nos fatores que mais pesam na s\u00edntese
// cut\u00e2nea de vitamina D. Fontes: Holick MF, "Vitamin D Deficiency" (New England Journal of Medicine,
// 2007) e "Environmental factors that influence the cutaneous production of vitamin D" (American Journal
// of Clinical Nutrition, 2008); NIH Office of Dietary Supplements \u2014 Vitamin D Fact Sheet.

// Fototipos de pele (escala inspirada em Fitzpatrick, em linguagem do dia a dia) -- fator relativo de
// velocidade de s\u00edntese de vitamina D: pele mais clara sintetiza bem mais r\u00e1pido que pele mais escura,
// na MESMA quantidade de sol (a melanina compete com o precursor da vitamina D pela radia\u00e7\u00e3o UVB).
const TIPOS_PELE = [
  { valor: "tipo1", label: "Pele muito clara \u2014 sempre queima, nunca bronzeia", fator: 1 },
  { valor: "tipo2", label: "Pele clara \u2014 queima f\u00e1cil, bronzeia pouco", fator: 0.9 },
  { valor: "tipo3", label: "Pele morena clara \u2014 queima moderado, bronzeia aos poucos", fator: 0.7 },
  { valor: "tipo4", label: "Pele morena \u2014 queima pouco, bronzeia bem", fator: 0.55 },
  { valor: "tipo5", label: "Pele morena escura \u2014 raramente queima, bronzeia bastante", fator: 0.4 },
  { valor: "tipo6", label: "Pele negra \u2014 praticamente n\u00e3o queima", fator: 0.25 },
];
// Sem tipo de pele cadastrado, cai pro fototipo intermedi\u00e1rio (tipo 3) s\u00f3 pra n\u00e3o travar um c\u00e1lculo j\u00e1
// em andamento -- na pr\u00e1tica a tela de exposi\u00e7\u00e3o solar exige o cadastro antes de liberar o bot\u00e3o de
// calcular (ver exposicaoSolarCamposTemplate()), ent\u00e3o esse fallback quase nunca \u00e9 usado de verdade.
function fatorTipoPele(valor) { const t = TIPOS_PELE.find((x) => x.valor === valor); return t ? t.fator : 0.7; }

// Condi\u00e7\u00e3o do c\u00e9u no momento da exposi\u00e7\u00e3o -- s\u00f3 usada no modo MANUAL (fallback), quando n\u00e3o foi
// poss\u00edvel obter o \u00edndice UV real pela localiza\u00e7\u00e3o (ver calcularVitaminaDSolPorUV() mais abaixo, que \u00e9 o
// caminho preferido). Nuvens bloqueiam boa parte (mas n\u00e3o toda) a radia\u00e7\u00e3o UVB.
const CEU_FATOR = { limpo: 1, parcial: 0.6, nublado: 0.25 };
const CEU_LABEL = { limpo: "C\u00e9u limpo (sol forte, sem nuvens)", parcial: "Parcialmente nublado", nublado: "Muito nublado / encoberto" };

// Intensidade relativa da radia\u00e7\u00e3o UVB conforme a hora do dia -- curva suave com pico ao meio-dia e
// zero antes das 6h/depois das 18h, aproximando o formato real da curva solar sem precisar saber
// latitude, esta\u00e7\u00e3o do ano ou \u00edndice UV em tempo real. Usada s\u00f3 no modo manual (calcularVitaminaDSol()
// / fallback sem localiza\u00e7\u00e3o) -- quando h\u00e1 \u00edndice UV real dispon\u00edvel, ele j\u00e1 embute a varia\u00e7\u00e3o por
// hor\u00e1rio e essa curva n\u00e3o \u00e9 usada (ver calcularVitaminaDSolPorUV()).
function fatorHorarioSolar(horaDecimal) {
  if (horaDecimal <= 6 || horaDecimal >= 18) return 0;
  return Math.max(0, Math.cos((horaDecimal - 12) * (Math.PI / 12)));
}
// "13:30" -> 13.5
function horaParaDecimal(hhmm) {
  const partes = String(hhmm).split(":");
  const h = Number(partes[0]);
  const m = Number(partes[1] || 0);
  return h + m / 60;
}

// Calibrado pra que ~15 minutos de sol a pino (meio-dia), c\u00e9u limpo, fototipo 3 (o "meio-termo" da
// escala) produzam cerca de 25 mcg (\u22481000 UI) de vitamina D -- estimativa de exposi\u00e7\u00e3o moderada
// amplamente citada na literatura (ver Holick, 2007). TETO: a pele se autorregula e para de sintetizar
// mais vitamina D depois de um certo ponto (fotodegrada\u00e7\u00e3o do excesso de pr\u00e9-vitamina D3) -- por isso
// o resultado nunca passa de ~250 mcg (\u224810.000 UI) numa \u00fanica exposi\u00e7\u00e3o, por mais tempo de sol que dure.
const VITAMINA_D_SOL_TAXA_BASE = 2.4; // mcg por minuto, em condi\u00e7\u00f5es de refer\u00eancia (fator 1 em tudo)
const VITAMINA_D_SOL_TETO_MCG = 250;
const VITAMINA_D_SOL_PASSO_MIN = 5; // granularidade da integra\u00e7\u00e3o num\u00e9rica ao longo da janela de exposi\u00e7\u00e3o

// Soma o fator hora-a-hora ao longo de toda a janela de exposi\u00e7\u00e3o (em vez de s\u00f3 olhar um ponto m\u00e9dio)
// -- importa pra janelas longas que atravessam hor\u00e1rios bem diferentes (ex.: 9h \u00e0s 15h tem sol muito
// mais forte no meio do que nas pontas). Retorna null se o hor\u00e1rio de t\u00e9rmino n\u00e3o for depois do in\u00edcio,
// ou se a condi\u00e7\u00e3o do c\u00e9u n\u00e3o for uma das reconhecidas.
function calcularVitaminaDSol(inicio, fim, ceu, tipoPeleValor) {
  const inicioDec = horaParaDecimal(inicio);
  const fimDec = horaParaDecimal(fim);
  if (!(inicio && fim) || !(fimDec > inicioDec)) return null;
  const fatorCeu = CEU_FATOR[ceu];
  if (fatorCeu == null) return null;
  const fatorPele = fatorTipoPele(tipoPeleValor);
  const passoHoras = VITAMINA_D_SOL_PASSO_MIN / 60;
  let minutosPonderados = 0;
  for (let h = inicioDec; h < fimDec; h += passoHoras) {
    minutosPonderados += fatorHorarioSolar(h) * VITAMINA_D_SOL_PASSO_MIN;
  }
  const mcg = Math.min(VITAMINA_D_SOL_TETO_MCG, VITAMINA_D_SOL_TAXA_BASE * minutosPonderados * fatorCeu * fatorPele);
  return { mcg, minutos: Math.round((fimDec - inicioDec) * 60) };
}

// ---- Caminho preferido: \u00edndice UV real, via geolocaliza\u00e7\u00e3o do dispositivo ----
// Quando o navegador consegue a localiza\u00e7\u00e3o do usu\u00e1rio, buscarIndiceUVAtual() traz o \u00edndice UV real
// hora-a-hora de HOJE pra aquele local (API p\u00fablica e gratuita Open-Meteo, sem chave de acesso). O
// \u00edndice UV \u00e9 uma medida direta da radia\u00e7\u00e3o (inclui nuvens, esta\u00e7\u00e3o do ano, latitude, tudo isso j\u00e1
// embutido), ent\u00e3o substitui de vez a curva estimada por hor\u00e1rio + a sele\u00e7\u00e3o manual do c\u00e9u -- \u00e9 um
// c\u00e1lculo mais preciso, e continua sem precisar de nenhuma chave de API paga.
// Interpola linearmente entre as duas leituras hor\u00e1rias mais pr\u00f3ximas (a API s\u00f3 d\u00e1 1 valor por hora).
function uvIndexNaHora(horaDecimal, uvHorario) {
  if (!uvHorario || !uvHorario.uv || !uvHorario.uv.length) return 0;
  const h0 = Math.max(0, Math.min(uvHorario.uv.length - 1, Math.floor(horaDecimal)));
  const h1 = Math.min(uvHorario.uv.length - 1, h0 + 1);
  const frac = horaDecimal - h0;
  const v0 = uvHorario.uv[h0] != null ? uvHorario.uv[h0] : 0;
  const v1 = uvHorario.uv[h1] != null ? uvHorario.uv[h1] : v0;
  return v0 + (v1 - v0) * frac;
}
// Calibrado no MESMO ponto de refer\u00eancia do modo manual (ver calcularVitaminaDSol() acima): \u00edndice UV 7
// (sol forte ao meio-dia, c\u00e9u limpo) por 15 minutos, fototipo 3, \u2248 25 mcg de vitamina D.
const VITAMINA_D_SOL_UV_REF = 7;
const VITAMINA_D_SOL_MIN_REF = 15;
const VITAMINA_D_SOL_MCG_REF = 25;
const VITAMINA_D_SOL_TAXA_UV = VITAMINA_D_SOL_MCG_REF / (VITAMINA_D_SOL_UV_REF * VITAMINA_D_SOL_MIN_REF * fatorTipoPele("tipo3"));
// A cobertura de nuvens (0-100%, tamb\u00e9m vinda da Open-Meteo -- ver buscarIndiceUVAtual()) j\u00e1 est\u00e1
// embutida no \u00edndice UV (nuvem forte derruba o \u00edndice), mas o PR\u00d3PRIO SISTEMA tamb\u00e9m informa pro
// usu\u00e1rio, em palavras, que condi\u00e7\u00e3o de tempo foi detectada durante a exposi\u00e7\u00e3o -- nas mesmas
// categorias do modo manual (CEU_LABEL), s\u00f3 que descobertas automaticamente em vez de perguntadas.
function condicaoCeuPorNuvens(percentualNuvens) {
  if (percentualNuvens == null) return "";
  if (percentualNuvens < 25) return CEU_LABEL.limpo;
  if (percentualNuvens < 70) return CEU_LABEL.parcial;
  return CEU_LABEL.nublado;
}
// Mesma interpola\u00e7\u00e3o hor\u00e1ria de uvIndexNaHora(), s\u00f3 que pra cobertura de nuvens em vez de \u00edndice UV.
function nuvensNaHora(horaDecimal, uvHorario) {
  if (!uvHorario || !uvHorario.nuvens || !uvHorario.nuvens.length) return null;
  const h0 = Math.max(0, Math.min(uvHorario.nuvens.length - 1, Math.floor(horaDecimal)));
  const h1 = Math.min(uvHorario.nuvens.length - 1, h0 + 1);
  const frac = horaDecimal - h0;
  const v0 = uvHorario.nuvens[h0] != null ? uvHorario.nuvens[h0] : 0;
  const v1 = uvHorario.nuvens[h1] != null ? uvHorario.nuvens[h1] : v0;
  return v0 + (v1 - v0) * frac;
}
// Mesma integra\u00e7\u00e3o num\u00e9rica de calcularVitaminaDSol() (passos de 5 min ao longo da janela), s\u00f3 que
// pesando pelo \u00edndice UV real de cada instante em vez da curva estimada \u00d7 fator do c\u00e9u. Tamb\u00e9m calcula a
// cobertura de nuvens M\u00c9DIA da janela (nuvensMedia) e a condi\u00e7\u00e3o de tempo em palavras (condicaoTempo) --
// \u00e9 o que permite o app informar pro usu\u00e1rio como estava o tempo durante a exposi\u00e7\u00e3o, sem precisar
// perguntar. Retorna null se o hor\u00e1rio de t\u00e9rmino n\u00e3o for depois do in\u00edcio, ou se n\u00e3o houver dados de
// \u00edndice UV em m\u00e3os.
function calcularVitaminaDSolPorUV(inicio, fim, uvHorario, tipoPeleValor) {
  const inicioDec = horaParaDecimal(inicio);
  const fimDec = horaParaDecimal(fim);
  if (!(inicio && fim) || !(fimDec > inicioDec)) return null;
  if (!uvHorario || !uvHorario.uv || !uvHorario.uv.length) return null;
  const fatorPele = fatorTipoPele(tipoPeleValor);
  const passoHoras = VITAMINA_D_SOL_PASSO_MIN / 60;
  let uvMinutos = 0;
  let somaNuvens = 0;
  let passosComNuvens = 0;
  for (let h = inicioDec; h < fimDec; h += passoHoras) {
    uvMinutos += uvIndexNaHora(h, uvHorario) * VITAMINA_D_SOL_PASSO_MIN;
    const nuvensNoInstante = nuvensNaHora(h, uvHorario);
    if (nuvensNoInstante != null) { somaNuvens += nuvensNoInstante; passosComNuvens++; }
  }
  const mcg = Math.min(VITAMINA_D_SOL_TETO_MCG, VITAMINA_D_SOL_TAXA_UV * uvMinutos * fatorPele);
  const nuvensMedia = passosComNuvens ? somaNuvens / passosComNuvens : null;
  return { mcg, minutos: Math.round((fimDec - inicioDec) * 60), nuvensMedia, condicaoTempo: condicaoCeuPorNuvens(nuvensMedia) };
}
// Consulta o \u00edndice UV E a cobertura de nuvens hora-a-hora de HOJE pra uma coordenada, usando a API
// p\u00fablica e gratuita Open-Meteo (sem chave de acesso, sem cadastro, aceita chamadas direto do
// navegador). Lan\u00e7a erro se a consulta falhar (sem internet, API fora do ar) -- quem chama trata isso
// caindo pro modo manual.
async function buscarIndiceUVAtual(lat, lon) {
  const url = "https://api.open-meteo.com/v1/forecast?latitude=" + encodeURIComponent(lat) + "&longitude=" + encodeURIComponent(lon) + "&hourly=uv_index,cloud_cover&timezone=auto&forecast_days=1";
  const resposta = await fetch(url);
  if (!resposta.ok) throw new Error("Falha ao consultar \u00edndice UV (HTTP " + resposta.status + ")");
  const dados = await resposta.json();
  if (!dados || !dados.hourly || !Array.isArray(dados.hourly.uv_index)) throw new Error("Resposta inesperada da API de \u00edndice UV");
  return { horarios: dados.hourly.time, uv: dados.hourly.uv_index, nuvens: Array.isArray(dados.hourly.cloud_cover) ? dados.hourly.cloud_cover : [] };
}

// cadastrou pra esse grupo (ver acaoConfirmarNovoExercicio()), que ficam salvos em
// state.exerciciosCustomizados e reaparecem automaticamente em qualquer treino futuro desse grupo.
function exerciciosDoGrupo(grupoId) {
  const grupo = grupoMuscularPorId(grupoId);
  if (!grupo) return [];
  return grupo.exercicios.concat((state.exerciciosCustomizados && state.exerciciosCustomizados[grupoId]) || []);
}

function normalizeText(value) { return value.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, ""); }

// Alguns alimentos contados por unidade (food.count, sem food.grams) têm o peso típico da unidade
// descrito no próprio baseAmount, ex.: "1 unidade (200 g)" pra Manga. Quando a pessoa digita a
// quantidade em gramas pra um desses (ex.: "25g de manga"), usamos esse peso típico pra converter os
// gramas digitados em fração da unidade (25/200 = 0,125), em vez de ignorar o número e cair pro padrão
// "1 unidade" -- que é o que estava acontecendo antes, porque o caminho de gramas exigia food.grams.
function unitGramsFromBaseAmount(baseAmount) {
  const m = /\((\d+(?:[.,]\d+)?)\s*g\)/i.exec(baseAmount || "");
  return m ? Number(m[1].replace(",", ".")) : null;
}

function amountForFood(text, position, food) {
  const before = text.slice(Math.max(0, position - 38), position);
  const grams = before.match(/(\d+(?:[.,]\d+)?)\s*(?:g|gramas?|gramos?)\s*(?:de\s*)?$/i);
  const ml = before.match(/(\d+(?:[.,]\d+)?)\s*(?:ml|mililitros?)\s*(?:de\s*)?$/i);
  // Litros ("1,5 l", "500 lt", "2 litros") -- mesma ideia de "ml", só que convertendo pra ml antes de
  // dividir por food.ml (1 l = 1000 ml). Pedido explícito do usuário ao cadastrar bebidas (caipirinha,
  // refrigerante zero, água): "para o usuário informar o consumo em lt ou ml" -- como é uma mudança no
  // parser genérico de quantidade (não em cada alimento), qualquer bebida medida em ml já passa a aceitar
  // litros também, sem precisar duplicar lógica por alimento.
  const litros = before.match(/(\d+(?:[.,]\d+)?)\s*(?:litros?|lts?|l)\s*(?:de\s*)?$/i);
  const units = before.match(/(\d+(?:[.,]\d+)?)\s*(?:unidades?|unid\.?|ovos?|pães?|paes?)\s*(?:de\s*)?$/i);
  const numberOnly = before.match(/(?:^|[\s,;])(?:um|uma|um copo de)?\s*(\d+(?:[.,]\d+)?)\s*$/i);
  const numberWord = /(?:^|[\s,;])(um|uma)\s*$/.test(before);
  const number = (match) => (match ? Number(match[1].replace(",", ".")) : null);
  if (food.grams && grams) { const value = number(grams); return { multiplier: value / food.grams, amount: formatNumber(value, 0) + " g" }; }
  if (!food.grams && food.count && grams) {
    const perUnitGrams = unitGramsFromBaseAmount(food.baseAmount);
    if (perUnitGrams) { const value = number(grams); return { multiplier: value / perUnitGrams, amount: formatNumber(value, 0) + " g" }; }
  }
  if (food.ml && ml) { const value = number(ml); return { multiplier: value / food.ml, amount: formatNumber(value, 0) + " ml" }; }
  if (food.ml && litros) { const valorMl = number(litros) * 1000; return { multiplier: valorMl / food.ml, amount: formatNumber(valorMl, 0) + " ml" }; }
  if (units) { const value = number(units); return { multiplier: value / (food.count || 1), amount: formatNumber(value, 0) + " unidade" + (value > 1 ? "s" : "") }; }
  // Um número solto do lado do alimento, sem "g"/"ml"/"unidades" (ex.: "1 pão francês", "2 bananas",
  // "3 ovos") quase sempre significa "N porções" na fala natural — não "N gramas". Antes isso era
  // dividido por food.grams/food.ml, então "1 pão francês" virava "1 grama de pão" (135 kcal → 3 kcal,
  // visível de forma bem clara no detalhamento por alimento). Trata como múltiplo da porção padrão,
  // igual ao caminho de "unidades" explícitas — quem quiser um valor preciso em gramas/ml usa "g"/"ml".
  if (numberOnly) { const value = number(numberOnly); return { multiplier: value / (food.count || 1), amount: formatNumber(value, 0) + " unidade" + (value > 1 ? "s" : "") }; }
  if (numberWord || /\bum\b|\buma\b/.test(before)) return { multiplier: 1, amount: food.baseAmount };
  return { multiplier: 1, amount: food.baseAmount };
}

// Quantidade pra suplementos "puros" (food.dose -- ver foodLibrary) -- diferente de amountForFood(),
// aceita a dose ANTES ("5000 UI de vitamina D") OU DEPOIS ("vitamina D 5000 UI") do nome, porque é assim
// que rótulo de suplemento costuma ser lido/falado, e reconhece as unidades específicas da dose
// (mg/mcg/UI/g, conforme food.dose.unidades) em vez de só g/ml/unidades. Como os valores em food.values
// já são "por 1 unidade da dose" (ver comentário acima da lista de suplementos), o multiplicador é
// sempre o próprio número digitado, sem dividir por nada.
function doseAmountForFood(text, position, length, food) {
  const dose = food.dose;
  const unitPattern = dose.unidades.join("|");
  const before = text.slice(Math.max(0, position - 38), position);
  const after = text.slice(position + length, position + length + 38);
  const beforeMatch = before.match(new RegExp("(\\d+(?:[.,]\\d+)?)\\s*(?:" + unitPattern + ")\\s*(?:de\\s*)?$", "i"));
  const afterMatch = after.match(new RegExp("^\\s*(?:de\\s*)?(\\d+(?:[.,]\\d+)?)\\s*(?:" + unitPattern + ")\\b", "i"));
  const match = beforeMatch || afterMatch;
  if (match) {
    const valor = Number(match[1].replace(",", "."));
    return { multiplier: valor, amount: formatNumber(valor, valor % 1 === 0 ? 0 : 1) + " " + dose.rotulo };
  }
  return { multiplier: dose.padrao, amount: food.baseAmount };
}

// Estimativa de quantos gramas um item identificado contribui -- usada só pra somar o "peso do produto"
// no cadastro de um produto pronto (ver acaoCadastrarProduto()); o resto do app (mealTotal(),
// alimentoDetalheTemplate() etc.) ignora esse campo normalmente. Não é uma medição real: pra alimentos
// medidos em ml, assume-se 1 ml ≈ 1 g (razoável pra molhos/caldos de cozinha); pra alimentos contados
// por unidade sem peso digitado, usa o peso típico da unidade (ver unitGramsFromBaseAmount()) ou, na
// falta desse dado, um padrão de 100 g; suplementos (food.dose) têm massa desprezível numa receita.
function gramsEstimadosParaItem(food, multiplier) {
  if (food.grams) return multiplier * food.grams;
  if (food.ml) return multiplier * food.ml;
  if (food.count) return multiplier * (unitGramsFromBaseAmount(food.baseAmount) || 100);
  return 0;
}
function detectFoods(description) {
  const text = normalizeText(description);
  // Alimentos reconhecidos = a biblioteca embutida (foodLibrary) + os produtos que a própria pessoa
  // cadastrou (ver CHAVE_PRODUTOS_CUSTOMIZADOS/acaoCadastrarProduto()) -- cada produto customizado tem
  // exatamente o mesmo formato de uma entrada da biblioteca (terms/label/baseAmount/values/grams), então
  // participa do reconhecimento normalmente, inclusive podendo ser digitado com quantidade (ex.: "150g
  // de pastel de camarão").
  const biblioteca = foodLibrary.concat(state.produtosCustomizados || []);
  // Junta todos os termos de todos os alimentos que aparecem no texto, em vez de resolver um alimento
  // de cada vez na ordem em que aparecem na biblioteca. Isso importa porque vários termos mais
  // específicos contêm um termo mais curto de OUTRO alimento (ex.: "suco de uva" contém "uva", que
  // também é o termo da fruta "Uva" sozinha) — resolver na ordem da biblioteca dependeria de qual dos
  // dois vem primeiro no array, o que é frágil. Ordenando todos os candidatos pelo tamanho do termo
  // (do mais longo pro mais curto) e aceitando de forma gulosa sem sobreposição de intervalos, o termo
  // mais específico (mais longo) sempre vence — não importa a ordem em que foi declarado.
  const candidates = [];
  for (const food of biblioteca) {
    for (const term of food.terms) {
      const normalizedTerm = normalizeText(term);
      const position = text.indexOf(normalizedTerm);
      if (position !== -1) candidates.push({ food, position, length: normalizedTerm.length });
    }
  }
  candidates.sort((a, b) => b.length - a.length || a.position - b.position);
  const found = [];
  const usedFoods = new Set();
  const occupied = [];
  for (const c of candidates) {
    if (usedFoods.has(c.food)) continue; // já identificamos esse alimento por um termo mais específico
    const overlaps = occupied.some((range) => c.position < range.end && c.position + c.length > range.start);
    if (overlaps) continue;
    const r = c.food.dose ? doseAmountForFood(text, c.position, c.length, c.food) : amountForFood(text, c.position, c.food);
    found.push({ label: c.food.label, amount: r.amount, values: scale(c.food.values, r.multiplier), gramsEstimados: gramsEstimadosParaItem(c.food, r.multiplier) });
    usedFoods.add(c.food);
    occupied.push({ start: c.position, end: c.position + c.length });
  }
  return found;
}

    case "pressao":
      return "Pressão arterial (mmHg): baixa < 90/60; normal < 120/80; pré-hipertensão 120–139/80–89; hipertensão estágio 1 140–159/90–99; estágio 2 160–179/100–109; estágio 3 (crise) ≥ 180/110 — Diretriz Brasileira de Hipertensão Arterial (SBC/SBH/SBN, 2020).";
    case "batimentos":
      return "Frequência cardíaca de repouso: abaixo de 50 bpm bradicardia; 50–99 bpm normal; 100 bpm ou mais taquicardia — Sociedade Brasileira de Cardiologia.";
    case "glicemia":
      return r.jejum
        ? "Glicemia em jejum: abaixo de 70 mg/dL hipoglicemia; até 99 mg/dL normal; 100–125 mg/dL pré-diabetes; 126 mg/dL ou mais faixa de diabetes — Sociedade Brasileira de Diabetes."
        : "Glicemia fora do jejum: abaixo de 70 mg/dL hipoglicemia; até 139 mg/dL dentro do esperado; 140–199 mg/dL elevada; 200 mg/dL ou mais sugestiva de diabetes — Sociedade Brasileira de Diabetes.";
    case "temperatura":
      return "Temperatura corporal: abaixo de 35°C hipotermia; 35–37,2°C normal; 37,3–37,7°C febrícula; 37,8–38,9°C febre; 39–40°C febre alta; acima de 40°C hiperpirexia — parâmetros clínicos usuais (enfermagem/semiologia médica).";
    case "saturacao":
      return "Saturação de oxigênio (SpO₂): 95–100% normal; 90–94% levemente reduzida; 85–89% baixa; abaixo de 85% muito baixa (risco à vida) — Sociedade Brasileira de Pneumologia e Tisiologia.";
    case "cintura": {
      const sexo = state.usuario && state.usuario.sexo;
      if (sexo === "masculino") return "Circunferência da cintura (homens): abaixo de 94 cm risco não aumentado; 94–101,9 cm risco aumentado; 102 cm ou mais risco muito aumentado — Organização Mundial da Saúde.";
      if (sexo === "feminino") return "Circunferência da cintura (mulheres): abaixo de 80 cm risco não aumentado; 80–87,9 cm risco aumentado; 88 cm ou mais risco muito aumentado — Organização Mundial da Saúde.";
      return "Circunferência da cintura (Organização Mundial da Saúde): risco aumentado a partir de 94 cm em homens e 80 cm em mulheres; risco muito aumentado a partir de 102 cm em homens e 88 cm em mulheres. Informe seu sexo no perfil para ver a sua classificação.";
    }
    default:
      return null;
  }
}
/* Limites (em kg/m²) usados para desenhar as faixas coloridas do gráfico de IMC. */
const IMC_ESCALA_MIN = 15;
const IMC_ESCALA_MAX = 45;
const IMC_ESCALA_CORTES = [18.5, 25, 30, 35, 40];
function imcChartTemplate(imc) {
  const pct = (v) => Math.min(100, Math.max(0, ((v - IMC_ESCALA_MIN) / (IMC_ESCALA_MAX - IMC_ESCALA_MIN) * 100)));
  const cores = IMC_FAIXAS.map((f) => f.cor);
  const cortesPct = IMC_ESCALA_CORTES.map(pct);
  const stops = [];
  stops.push(cores[0] + " 0%");
  for (let i = 0; i < cortesPct.length; i++) {
    stops.push(cores[i] + " " + cortesPct[i].toFixed(1) + "%");
    stops.push(cores[i + 1] + " " + cortesPct[i].toFixed(1) + "%");
  }
  stops.push(cores[cores.length - 1] + " 100%");
  const gradient = "linear-gradient(to right," + stops.join(",") + ")";
  const marcadorPct = imc == null ? null : Math.min(97, Math.max(3, pct(imc)));
  return '' +
    '<div class="imc-chart">' +
      '<div class="imc-chart-marker-wrap">' +
        (marcadorPct == null ? "" :
          '<div class="imc-chart-marker" style="left:' + marcadorPct.toFixed(1) + '%">' +
            '<div class="imc-chart-marker-value">' + formatNumber(imc, 1) + "</div>" +
            '<div class="imc-chart-marker-pin"></div>' +
          "</div>"
        ) +
      "</div>" +
      '<div class="imc-chart-track" style="background:' + gradient + '"></div>' +
      '<div class="imc-chart-ticks">' + IMC_ESCALA_CORTES.map((t, i) => '<span class="imc-chart-tick" style="left:' + cortesPct[i].toFixed(1) + '%">' + t + "</span>").join("") + "</div>" +
    "</div>";
}

// Tipos de medida que exigem responder "em jejum?" antes de salvar -- ver medidasFormTemplate()/
// acaoSalvarMedida(). Glicemia precisa porque os parâmetros de referência da classificação mudam
// bastante num caso e no outro (ver GLICEMIA_JEJUM_FAIXAS/GLICEMIA_NAO_JEJUM_FAIXAS); peso, pra poder
// comparar pesagens em jejum de um dia com o do seguinte no Diário de Kcal (ver pesoJejumDoDia()), sem
// depender de procurar "jejum" no texto livre da observação.
const MEDIDA_TIPOS_COM_JEJUM = ["peso", "glicemia"];
// Só pra peso (não glicemia): além de jejum, o usuário também informa em que momento do dia pesou --
// ajuda a entender variações de peso ligadas a sono, refeição ou treino (retenção de líquidos,
// esvaziamento gástrico etc.). Mostrado na legenda do card de IMC (ver imcCardTemplate()/
// legendaContextoPesoReferencia()) junto com a hora e o jejum daquele registro.
const MEDIDA_MOMENTO_PESO_OPCOES = [
  { valor: "dormir", label: "Antes de dormir", frase: "antes de dormir" },
  { valor: "antes_refeicao", label: "Antes da refeição", frase: "antes da refeição" },
  { valor: "depois_refeicao", label: "Depois da refeição", frase: "depois da refeição" },
  { valor: "antes_treino", label: "Antes do treino", frase: "antes do treino" },
  { valor: "depois_treino", label: "Depois do treino", frase: "depois do treino" },
];
function momentoPesoInfo(valor) { return MEDIDA_MOMENTO_PESO_OPCOES.find((o) => o.valor === valor) || null; }
function acaoSelecionarTipoMedida(tipo) { state.medidaTipo = tipo; state.medidaJejum = ""; state.medidaMomentoPeso = ""; render(); }
// Trocar a resposta de jejum dispara um re-render (pra atualizar o <select> com a opção escolhida), e
// esse re-render recria o campo de valor/observação do zero (não são inputs "controlados" por
// state) -- sem isso, um valor já digitado antes de responder a pergunta de jejum seria perdido. Por
// isso guarda o que já estava digitado e devolve pros campos recriados, igual a um input "não
// controlado" resistiria a esse tipo de re-render.
function acaoSelecionarJejum(valor) {
  const valorDigitado = (document.getElementById("medida-valor") || {}).value || "";
  const notaDigitada = (document.getElementById("medida-nota") || {}).value || "";

  render();
  const inputValor = document.getElementById("medida-valor");
  if (inputValor) inputValor.value = valorDigitado;
  const inputNota = document.getElementById("medida-nota");
  if (inputNota) inputNota.value = notaDigitada;
}
// Mesmo motivo/mecânica de acaoSelecionarJejum() acima -- preserva o valor/nota já digitados através
// do re-render disparado pela troca de momento.
function acaoSelecionarMomentoPeso(valor) {
  const valorDigitado = (document.getElementById("medida-valor") || {}).value || "";
  const notaDigitada = (document.getElementById("medida-nota") || {}).value || "";
  state.medidaMomentoPeso = valor;
  render();
  const inputValor = document.getElementById("medida-valor");
  if (inputValor) inputValor.value = valorDigitado;
  const inputNota = document.getElementById("medida-nota");
  if (inputNota) inputNota.value = notaDigitada;
}
function acaoSalvarMedida() {
  const tipo = state.medidaTipo;
  if (!tipo || !medidaTipos[tipo]) { toastError("Selecione o tipo de medição."); return; }
  const input = document.getElementById("medida-valor");
  const valorBruto = input ? input.value.trim() : "";
  if (!valorBruto) { toastError("Informe o valor da medição."); return; }
  const meta = medidaTipos[tipo];
  const valor = meta.texto ? valorBruto : valorBruto.replace(",", ".");
  if (!meta.texto && isNaN(Number(valor))) { toastError("Informe um valor numérico válido."); return; }
  // Ver MEDIDA_TIPOS_COM_JEJUM -- pergunta em medidasFormTemplate().
  if (MEDIDA_TIPOS_COM_JEJUM.includes(tipo) && state.medidaJejum !== "sim" && state.medidaJejum !== "nao") {
    toastError("Informe se a medição foi feita em jejum.");
    return;
  }
  // Ver MEDIDA_MOMENTO_PESO_OPCOES -- pergunta em medidasFormTemplate(), só pra peso.
  if (tipo === "peso" && !momentoPesoInfo(state.medidaMomentoPeso)) {
    toastError("Informe em que momento você pesou (antes de dormir, da refeição ou do treino).");
    return;
  }
  const notaInput = document.getElementById("medida-nota");
  const nota = notaInput ? notaInput.value.trim() : "";
  const now = new Date();
  const novaMedida = {
    id: Date.now(), date: today(), time: now.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }),
    tipo, valor, nota,
  };
  // Ao registrar um peso, calcula e congela o IMC daquele peso na hora (com a altura cadastrada até
  // então) -- fica salvo junto do registro em vez de recalculado sempre com a altura mais recente, pra
  // não mudar o IMC de pesos antigos se a altura for atualizada depois. Sem altura cadastrada ainda,
  // fica sem IMC (mesma mensagem do card do topo pedindo pra cadastrar a altura em Bioimpedância).
  if (tipo === "peso") novaMedida.imc = calcularImcDoPeso(Number(valor));
  if (MEDIDA_TIPOS_COM_JEJUM.includes(tipo)) novaMedida.jejum = state.medidaJejum === "sim";
  if (tipo === "peso") novaMedida.momento = state.medidaMomentoPeso;
  state.medidas = state.medidas.concat([novaMedida]);
  persistMedidas();
  state.medidaTipo = "";
  state.medidaJejum = "";
  state.medidaMomentoPeso = "";
  toastSuccess(tipo === "peso" && novaMedida.imc
    ? "Registro salvo no histórico (IMC " + formatNumber(novaMedida.imc, 1) + ")."
    : "Registro salvo no histórico.");
  if (state.account) enviarComFila("salvarMedidaGoogle", [state.usuario.email, novaMedida]);
  render();
}

  state.medidas = state.medidas.filter((m) => m.id !== id);
  persistMedidas();
  if (state.account) enviarComFila("removerMedidaGoogle", [state.usuario.email, id]);

}

function compressImageDataUrl(file, maxSize, quality) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        const scale = Math.min(1, maxSize / Math.max(width, height));
        width = Math.round(width * scale);
        height = Math.round(height * scale);
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", quality || 0.7));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
async function onAvatarSelected(event) {
