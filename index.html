    "</div>";
}

// O histórico mostra sempre UM dia por vez (o de hoje, por padrão) — para ver dias anteriores, a
// pessoa escolhe a data no calendário suspenso (input type="date") em vez de rolar uma lista com
// todo o histórico acumulado.
// Lista todos os dias com refeições registradas (mais recente primeiro), cada um como um card que se
// expande ao clicar, mostrando as refeições daquele dia -- ver historyDayCardTemplate(). Substituiu o
// antigo calendário de "escolher uma data por vez", que obrigava adivinhar em qual dia havia registro.
function historyPanelTemplate() {
  if (!state.showHistory) return "";
  const days = historyDays();
  return '' +
    '<div class="history-panel">' +
      '<div class="history-panel-label">Histórico salvo</div>' +
      (days.length
        ? '<div class="history-days-list">' + days.map((date) => historyDayCardTemplate(date)).join("") + "</div>"
        : '<p class="history-panel-empty">Suas refeições aparecerão aqui depois do primeiro registro.</p>'
      ) +
    "</div>";
}
// Meta/objetivo "daquele dia registrado" -- usa o registro CONGELADO do Diário de Kcal pra essa mesma
// data quando existe (a pessoa já clicou em "Encerrar dia" pra esse dia), senão cai pra meta/objetivo
// ATUAIS (mesmo padrão de fallback usado em diarioKcalMetaTexto()).
function historyDayMetaInfo(date) {
  const registroDiario = state.diarioKcal.find((r) => r.date === date);
  if (registroDiario && registroDiario.metaCalorias != null) {
    return { meta: registroDiario.metaCalorias, objetivo: registroDiario.objetivo };
  }
  return { meta: state.goals.calories, objetivo: state.goals.objetivo };
}
function historyDayCardTemplate(date) {
  const dayMeals = ordenarPorTipoDeRefeicao(state.meals.filter((m) => m.date === date));
  const dayTotal = dayMeals.reduce((sum, m) => sum + m.calories, 0);
  const expandido = state.historyDiaExpandido === date;
  const metaInfo = historyDayMetaInfo(date);
  const objetivoLabel = metaInfo.objetivo && OBJETIVOS_META[metaInfo.objetivo] ? OBJETIVOS_META[metaInfo.objetivo].label : "";
  const percentualTexto = metaInfo.meta > 0 ? "/" + formatNumber((dayTotal / metaInfo.meta) * 100) + "%" : "";
  return '' +
    '<div class="history-day' + (expandido ? " history-day-expandido" : "") + '">' +
      '<div class="history-day-head history-day-head-btn" onclick="acaoAlternarDiaHistorico(\'' + date + '\')">' +
        '<span class="date">' + dateLabel(date) + (objetivoLabel ? " (" + objetivoLabel + ")" : "") + "</span>" +
        '<span class="history-day-head-direita"><span class="total">' + formatNumber(dayTotal) + " kcal" + percentualTexto + " - " + dayMeals.length + (dayMeals.length > 1 ? " refeições" : " refeição") + "</span>" +
        '<button class="meal-row-delete" aria-label="Excluir refeições de ' + esc(dateLabel(date)) + '" onclick="event.stopPropagation(); acaoRemoverDiaHistorico(\'' + date + '\')">' + icon("trash") + "</button>" +
        icon("chevron", "history-day-chevron") + "</span>" +
      "</div>" +
      (expandido
        ? '<div class="history-day-meals">' + dayMeals.map((m) => '<div class="history-day-meal" onclick="acaoAbrirDetalheRefeicao(' + m.id + ')"><span>' + esc(m.name) + "</span><span>" + formatNumber(m.calories) + " kcal</span></div>").join("") + "</div>"
        : ""
      ) +
    "</div>";
}
// Exclui TODAS as refeições registradas naquele dia (o "registro do dia" no histórico é o agrupamento
// de refeições por data, não um registro único) -- remove cada uma localmente e sincroniza cada remoção
// com o backend, igual acaoRemoverRefeicao() faz pra uma refeição avulsa.
function acaoRemoverDiaHistorico(date) {
  const idsDoDia = state.meals.filter((m) => m.date === date).map((m) => m.id);
  if (!idsDoDia.length) return;
  state.meals = state.meals.filter((m) => m.date !== date);
  persistMeals();
  if (state.account) idsDoDia.forEach((id) => enviarComFila("removerRefeicaoGoogle", [state.usuario.email, id]));
  if (state.historyDiaExpandido === date) state.historyDiaExpandido = null;
  render();
}
// Abre/fecha um dia do histórico (accordion: só um dia expandido de cada vez -- clicar num dia diferente
// troca qual está aberto, sem precisar fechar o anterior primeiro).
function acaoAlternarDiaHistorico(date) {
  state.historyDiaExpandido = state.historyDiaExpandido === date ? null : date;
  render();
}
// Cada vez que o histórico é aberto, começa com todos os dias fechados (evita reabrir com um dia antigo
// expandido que a pessoa tinha navegado antes e esquecido).
function acaoAlternarHistorico() {
  state.showHistory = !state.showHistory;
  if (state.showHistory) state.historyDiaExpandido = null;
  render();
}

/* ===================== treinos/esportes ===================== */
function acaoSelecionarEsporte(valor) {
  state.treinoEsporte = valor;
  if (valor !== "Outro") state.treinoEsporteCustom = "";
  render();
}
// Resolve o nome final do esporte a partir da seleção do formulário: se a pessoa escolheu "Outro", usa
// o texto digitado, cadastrando-o em esportesCustomizados (se ainda não existir) pra reaparecer no
// seletor da próxima vez -- senão usa direto o valor já selecionado. Devolve "" se a seleção for
// inválida (nada escolhido, ou "Outro" com o campo de texto vazio).
function resolverEsporteTreino() {
  if (state.treinoEsporte !== "Outro") return state.treinoEsporte;
  // Lê direto do DOM (mesmo padrão de nota/distância em acaoSalvarTreino/acaoEncerrarTreino) -- essa
  // função roda como a PRIMEIRA linha de acaoIniciarTreino()/acaoSalvarTreino(), antes de qualquer
  // render(), então o texto digitado pode ainda não ter sido capturado em state.treinoEsporteCustom
  // (isso só acontece dentro de captureFormState(), chamado no início de um render()).
  const el = document.getElementById("treino-esporte-custom");
  const nome = ((el ? el.value : state.treinoEsporteCustom) || "").trim();
  if (!nome) return "";
  if (!ESPORTE_TIPOS.includes(nome) && !state.esportesCustomizados.includes(nome)) {
    state.esportesCustomizados = state.esportesCustomizados.concat([nome]).sort((a, b) => a.localeCompare(b, "pt-BR"));
    persistEsportesCustomizados();
  }
  return nome;
}

// Adiciona um grupo muscular ao registro de treino atual (dropdown de treinoGruposMuscularesCampoTemplate()).
// Pode adicionar quantos grupos quiser -- cada um vira um bloco separado com checkboxes dos exercícios
// daquele grupo (ver treinoGrupoBlocoTemplate()).
function acaoAdicionarGrupoMuscular(grupoId) {
  if (!grupoId || !grupoMuscularPorId(grupoId)) return;
  if (!state.treinoGruposSelecionados.includes(grupoId)) {
    state.treinoGruposSelecionados = state.treinoGruposSelecionados.concat([grupoId]);
  }
  render();
}
// Remove um grupo do registro atual e descarta os exercícios que tinham sido marcados nele.
function acaoRemoverGrupoMuscular(grupoId) {
  state.treinoGruposSelecionados = state.treinoGruposSelecionados.filter((g) => g !== grupoId);
  if (state.treinoNovoExercicioGrupoAberto === grupoId) state.treinoNovoExercicioGrupoAberto = null;
  const prefixo = grupoId + "::";
  const novosMarcados = {};
  Object.keys(state.treinoExerciciosMarcados).forEach((chave) => { if (chave.indexOf(prefixo) !== 0) novosMarcados[chave] = state.treinoExerciciosMarcados[chave]; });
  state.treinoExerciciosMarcados = novosMarcados;
  render();
}
// Marca/desmarca um exercício específico dentro de um grupo já adicionado. chave é "grupoId::exercicioId".
// Ao marcar, abre os campos de séries/repetições/peso (ver treinoGrupoBlocoTemplate()); ao desmarcar,
// descarta os valores já digitados nesses campos.
function acaoAlternarExercicio(chave) {
  const novosMarcados = Object.assign({}, state.treinoExerciciosMarcados);
  if (novosMarcados[chave]) delete novosMarcados[chave];
  else novosMarcados[chave] = { series: "", repeticoes: "", peso: "" };
  state.treinoExerciciosMarcados = novosMarcados;
  render();
}
// Abre/fecha/confirma o formulário inline de "novo exercício" (botão "+ Exercício" no bloco do grupo,
// ver treinoNovoExercicioFormTemplate()). Ao confirmar, o exercício é adicionado à lista PADRÃO desse
// grupo (persistido em state.exerciciosCustomizados e sincronizado com a conta Google, se conectada) --
// então já aparece automaticamente em qualquer treino futuro desse mesmo grupo, sem precisar recadastrar.
// Se a pessoa digitar o nome de um exercício que já existe (padrão ou já cadastrado antes), reaproveita
// o existente em vez de criar um duplicado.
function acaoAbrirNovoExercicio(grupoId) {
  state.treinoNovoExercicioGrupoAberto = grupoId;
  state.treinoNovoExercicioNome = "";
  render();
}
function acaoCancelarNovoExercicio() {
  state.treinoNovoExercicioGrupoAberto = null;
  state.treinoNovoExercicioNome = "";
  render();
}
function acaoConfirmarNovoExercicio(grupoId) {
  const inputEl = document.getElementById("treino-novo-exercicio-nome");
  const nome = inputEl ? inputEl.value.trim() : "";
  if (!nome) { toastError("Informe o nome do exercício."); return; }
  const existente = exerciciosDoGrupo(grupoId).find((ex) => ex.label.trim().toLowerCase() === nome.toLowerCase());
  let exercicio = existente;
  if (!exercicio) {
    exercicio = { id: "custom_" + Date.now(), label: nome };
    state.exerciciosCustomizados = Object.assign({}, state.exerciciosCustomizados);
    state.exerciciosCustomizados[grupoId] = (state.exerciciosCustomizados[grupoId] || []).concat([exercicio]);
    persistExerciciosCustomizados();
    if (state.account) enviarComFila("salvarExercicioCustomizadoGoogle", [state.usuario.email, { grupoId: grupoId, id: exercicio.id, label: exercicio.label }]);
    toastSuccess('Exercício "' + nome + '" adicionado — ele já vai aparecer nos próximos treinos desse grupo.');
  } else {
    toastSuccess('Esse exercício já estava na lista — marcamos ele pra você.');
  }
  const chave = grupoId + "::" + exercicio.id;
  const novosMarcados = Object.assign({}, state.treinoExerciciosMarcados);
  if (!novosMarcados[chave]) novosMarcados[chave] = { series: "", repeticoes: "", peso: "" };
  state.treinoExerciciosMarcados = novosMarcados;
  state.treinoNovoExercicioGrupoAberto = null;
  state.treinoNovoExercicioNome = "";
  render();
}
// Monta a lista final de grupos/exercícios marcados pra salvar junto do registro do treino -- ver
// acaoEncerrarTreino()/acaoSalvarTreino(). Cada item: { grupo: "Peito", exercicios: [{ exercicio, series,
// repeticoes, peso }, ...] } (exercicios pode vir vazio, se a pessoa só adicionou o grupo sem marcar
// nenhum exercício; series/repeticoes/peso ficam null se não informados -- são opcionais). Lê os campos
// de séries/repetições/peso DIRETO DO DOM (não do state) -- mesmo motivo de calcularCamposDistanciaTreino()
// ler #treino-distancia direto: acaoSalvarTreino()/acaoEncerrarTreino() não passam por um render() antes
// de montar o registro, então um valor digitado agora mesmo (sem nenhum render() no meio) ainda não
// teria sido recapturado em state.treinoExerciciosMarcados.
function montarGrupoMuscularParaSalvar(grupoId) {
  const grupo = grupoMuscularPorId(grupoId);
  if (!grupo) return null;
  const paraNumero = (v) => (v !== undefined && v !== null && String(v).trim() !== "" ? Number(String(v).trim().replace(",", ".")) || null : null);
  const exercicios = exerciciosDoGrupo(grupoId)
    .filter((ex) => state.treinoExerciciosMarcados[grupoId + "::" + ex.id])
    .map((ex) => {
      const domPrefixo = treinoExercicioDomPrefixo(grupoId, ex.id);
      const seriesEl = document.getElementById(domPrefixo + "-series");
      const repeticoesEl = document.getElementById(domPrefixo + "-repeticoes");
      const pesoEl = document.getElementById(domPrefixo + "-peso");
      const dados = state.treinoExerciciosMarcados[grupoId + "::" + ex.id] || {};
      const series = seriesEl ? seriesEl.value : dados.series;
      const repeticoes = repeticoesEl ? repeticoesEl.value : dados.repeticoes;
      const peso = pesoEl ? pesoEl.value : dados.peso;
      return { exercicio: ex.label, series: paraNumero(series), repeticoes: paraNumero(repeticoes), peso: paraNumero(peso) };
    });
  return { grupo: grupo.label, exercicios: exercicios };
}
function obterGruposMuscularesParaSalvar() {
  return state.treinoGruposSelecionados.map(montarGrupoMuscularParaSalvar).filter(Boolean);
}
// Troca de modo também descarta uma foto já selecionada — evita uma foto escolhida num modo "vazar"
// silenciosamente pro outro.
function acaoAlternarModoTreino(modo) { state.treinoModo = modo; limparFotoTreinoSelecionada(); render(); }

// Intervalo que atualiza o cronômetro na tela a cada segundo enquanto um treino está rodando (não
// fica no state porque é só uma questão de UI — não precisa ser persistido nem disparar sincronização).
let treinoTickIntervalId = null;
function iniciarTickTreinoSeNecessario() {
  pararTickTreino();
  if (state.treinoAtivo && !state.treinoAtivo.pausado) {
    treinoTickIntervalId = setInterval(render, 1000);
  }
}
function pararTickTreino() {
  if (treinoTickIntervalId) { clearInterval(treinoTickIntervalId); treinoTickIntervalId = null; }
}

function acaoIniciarTreino() {
  const esporte = resolverEsporteTreino();
  if (!esporte) { toastError(state.treinoEsporte === "Outro" ? "Informe o nome do esporte." : "Selecione o esporte."); return; }
  const now = new Date();
  state.treinoAtivo = {
    esporte, date: today(),
    horaInicioClock: now.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }),
    segmentoAtualInicio: Date.now(),
    acumuladoMs: 0,
    pausado: false,
  };
  persistTreinoAtivo();
  iniciarTickTreinoSeNecessario();
  render();
}

function acaoPausarTreino() {
  if (!state.treinoAtivo || state.treinoAtivo.pausado) return;
  state.treinoAtivo.acumuladoMs += Date.now() - state.treinoAtivo.segmentoAtualInicio;
  state.treinoAtivo.segmentoAtualInicio = null;
  state.treinoAtivo.pausado = true;
  persistTreinoAtivo();
  pararTickTreino();
  render();
}

function acaoRetomarTreino() {
  if (!state.treinoAtivo || !state.treinoAtivo.pausado) return;
  state.treinoAtivo.segmentoAtualInicio = Date.now();
  state.treinoAtivo.pausado = false;
  persistTreinoAtivo();
  iniciarTickTreinoSeNecessario();
  render();
}

// Lê o campo de distância (só existe na tela pros esportes em ESPORTES_COM_DISTANCIA -- ver
// treinoDistanciaCampoTemplate()) e calcula velocidade média/pace a partir dela e da duração.
// Reaproveitado tanto pelo cronômetro (acaoEncerrarTreino) quanto pelo registro manual
// (acaoSalvarTreino), pra manter os três campos calculados do mesmo jeito nos dois modos. Sem GPS,
// sem rastreamento -- só a conta simples de distância/tempo em cima do que a pessoa informou.
function calcularCamposDistanciaTreino(esporte, duracaoMin) {
  const distanciaEl = document.getElementById("treino-distancia");
  const distanciaKm = (ESPORTES_COM_DISTANCIA.includes(esporte) && distanciaEl && distanciaEl.value !== "")
    ? Number(distanciaEl.value.trim().replace(",", ".")) || null
    : null;
  return {
    distanciaKm,
    velocidadeMediaKmh: distanciaKm ? calcularVelocidadeMediaKmh(distanciaKm, duracaoMin) : null,
    paceMinPorKm: distanciaKm ? calcularPaceMinPorKm(distanciaKm, duracaoMin) : null,
  };
}

/* ===================== estimativa de calorias queimadas ===================== */
// Estimativa de calorias gastas no treino, pelo método padrão de MET (Equivalente Metabólico de
// Tarefa): calorias = MET × peso(kg) × duração(horas). É uma estimativa, não uma medição -- não temos
// frequência cardíaca nem VO2 real, só o que a pessoa registrou (esporte, duração, ritmo quando há
// distância, e no caso de Musculação, séries/exercícios).
//
// Faixas de velocidade -> MET, baseadas em valores usuais do Compêndio de Atividades Físicas. Só se
// aplica a Corrida/Caminhada/Ciclismo quando há distância percorrida (ver ESPORTES_COM_DISTANCIA) --
// sem ritmo real, a intensidade fica pouco confiável pra estimar.
function metPorRitmo(esporte, velocidadeMediaKmh) {
  if (esporte === "Caminhada") {
    if (velocidadeMediaKmh < 4) return 2.8;
    if (velocidadeMediaKmh < 5.5) return 3.5;
    if (velocidadeMediaKmh < 6.5) return 4.3;
    if (velocidadeMediaKmh < 7.5) return 5.0;
    return 6.5;
  }
  if (esporte === "Corrida") {
    if (velocidadeMediaKmh < 8) return 6.0;
    if (velocidadeMediaKmh < 9.5) return 8.3;
    if (velocidadeMediaKmh < 10.5) return 9.8;
    if (velocidadeMediaKmh < 11.5) return 10.5;
    if (velocidadeMediaKmh < 13) return 11.0;
    if (velocidadeMediaKmh < 14.5) return 11.8;
    if (velocidadeMediaKmh < 16) return 12.8;
    return 14.5;
  }
  if (esporte === "Ciclismo") {
    if (velocidadeMediaKmh < 16) return 4.0;
    if (velocidadeMediaKmh < 19) return 6.8;
    if (velocidadeMediaKmh < 22.5) return 8.0;
    if (velocidadeMediaKmh < 25.5) return 10.0;
    if (velocidadeMediaKmh < 30) return 12.0;
    return 15.8;
  }
  return null;
}
// MET médio (fixo) pros esportes sem dado de ritmo -- valores aproximados de intensidade moderada do
// Compêndio de Atividades Físicas. Menos precisos que os calculados por ritmo, mas melhores que nada.
const MET_ESPORTE_FIXO = {
  Boxe: 7.8,
  Futebol: 7.0,
  "Jiu-jitsu": 10.0,
  "Muay Thai": 10.3,
  Natação: 6.0,
  Tênis: 7.3,
};
// Musculação não tem ritmo pra usar, e não existe fórmula validada ligando peso levantado a calorias
// (o gasto vem majoritariamente do custo metabólico do esforço e da recuperação entre séries, não do
// trabalho mecânico de erguer a barra). Por isso a intensidade aqui é estimada pela "densidade" do
// treino -- quantas séries no total foram feitas por minuto: mais séries num tempo mais curto sugere
// menos descanso entre elas (treino mais intenso, estilo circuito); poucas séries num tempo mais longo
// sugere mais descanso (estilo tradicional). É uma aproximação grosseira, não uma medição precisa.
function metMusculacao(gruposMusculares, duracaoMin) {
  const totalSeries = (gruposMusculares || []).reduce((soma, g) => soma + (g.exercicios || []).reduce((s, ex) => s + (ex.series || 0), 0), 0);
  const densidade = duracaoMin > 0 ? totalSeries / duracaoMin : 0;
  if (densidade >= 0.6) return 6.0;
  if (densidade >= 0.3) return 5.0;
  return 3.5;
}
// Estima as calorias gastas de um treino já montado (precisa de esporte, duracaoMin e, quando houver,
// velocidadeMediaKmh/gruposMusculares -- os mesmos campos que já ficam no registro do treino). Usa o
// peso mais recente registrado em Medidas e Aferições (ver ultimoRegistroMedida()); sem peso registrado
// ou sem duração, não dá pra estimar e a função devolve null (o campo "caloriasQueimadas" do treino
// fica null/ausente nesse caso, e simplesmente não aparece na tela).
function estimarCaloriasQueimadas(treino) {
  const registroPeso = ultimoRegistroMedida("peso");
  const pesoKg = registroPeso ? Number(registroPeso.valor) : null;
  if (!pesoKg || !treino.duracaoMin) return null;
  let met = null;
  if (treino.velocidadeMediaKmh) met = metPorRitmo(treino.esporte, treino.velocidadeMediaKmh);
  else if (treino.esporte === "Musculação") met = metMusculacao(treino.gruposMusculares, treino.duracaoMin);
  else met = MET_ESPORTE_FIXO[treino.esporte] || null;
  if (!met) return null;
  return met * pesoKg * (treino.duracaoMin / 60);
}
function acaoEncerrarTreino() {
  if (!state.treinoAtivo) return;
  if (treinoFotoSelecionada && !state.account) { toastError("Conecte sua conta do Google para anexar fotos."); return; }
  const duracaoMin = Math.round(treinoAtivoElapsedMs() / 60000);
  const now = new Date();
  const notaEl = document.getElementById("treino-nota");
  const nota = notaEl ? notaEl.value : "";
  const distanciaEl = document.getElementById("treino-distancia");
  const camposDistancia = calcularCamposDistanciaTreino(state.treinoAtivo.esporte, duracaoMin);
  const gruposMusculares = obterGruposMuscularesParaSalvar();
  const novoTreino = Object.assign({
    id: Date.now(), date: state.treinoAtivo.date, esporte: state.treinoAtivo.esporte,
    horaInicio: state.treinoAtivo.horaInicioClock, horaFim: now.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }),
    duracaoMin, fotoUrl: "", nota, gruposMusculares,
  }, camposDistancia);
  novoTreino.caloriasQueimadas = estimarCaloriasQueimadas(novoTreino);
  // Mesmo padrão "salva primeiro, anexo depois" já usado nos exames de bioimpedância/calorimetria
  // (ver processarAnexoBioimpedanciaEmSegundoPlano): o treino nunca fica refém do envio da foto.
  const arquivoFoto = treinoFotoSelecionada;
  state.treinos = state.treinos.concat([novoTreino]);
  persistTreinos();
  state.treinoAtivo = null;
  persistTreinoAtivo();
  pararTickTreino();
  state.treinoEsporte = "";
  state.treinoEsporteCustom = "";
  state.treinoNota = "";
  state.treinoDistanciaKm = "";
  state.treinoGruposSelecionados = [];
  state.treinoExerciciosMarcados = {};
  state.treinoNovoExercicioGrupoAberto = null;
  if (notaEl) notaEl.value = ""; // ver comentário em acaoSalvarTreino sobre limpar o DOM diretamente
  if (distanciaEl) distanciaEl.value = "";
  limparFotoTreinoSelecionada();
  toastSuccess(arquivoFoto ? "Treino registrado. Enviando a foto em segundo plano..." : "Treino registrado.");
  const promessaRegistroBase = state.account ? enviarComFila("salvarTreinoGoogle", [state.usuario.email, novoTreino]) : Promise.resolve();
  render();
  if (arquivoFoto) processarFotoTreinoEmSegundoPlano(novoTreino.id, arquivoFoto, promessaRegistroBase);
}

// Ver comentário equivalente em processarAnexoBioimpedanciaEmSegundoPlano: espera o envio do registro
// em si terminar antes de mandar a atualização da foto, pra essas duas escritas nunca se cruzarem.
async function processarFotoTreinoEmSegundoPlano(idTreino, file, promessaRegistroBase) {
  const [resultado] = await Promise.all([enviarAnexoExame(file), promessaRegistroBase]);
  if (!resultado.ok) {
    toastError((resultado.erro || "Não foi possível enviar a foto") + " — o treino foi salvo, só sem a foto.");
    return;
  }
  const registro = state.treinos.find((t) => t.id === idTreino);
  if (!registro) return; // treino foi removido enquanto a foto ainda enviava
  registro.fotoUrl = resultado.url;
  persistTreinos();
  toastSuccess("Foto anexada ao treino.");
  if (state.account) enviarComFila("atualizarFotoTreinoGoogle", [state.usuario.email, idTreino, resultado.url]);
  render();
}

// Descarta o treino em andamento sem salvar (ex.: a pessoa iniciou por engano).
function acaoCancelarTreinoAtivo() {
  state.treinoAtivo = null;
  persistTreinoAtivo();
  pararTickTreino();
  limparFotoTreinoSelecionada();
  render();
}

// Abre o formulário manual já preenchido com os dados de um treino salvo (clicado em "Treinos de
// hoje" ou no histórico), para editar em vez de registrar um novo -- mesmo padrão de
// acaoEditarBioimpedancia()/acaoEditarCalorimetria(). Os grupos musculares/exercícios do registro (se
// for Musculação) NÃO são recarregados no seletor -- ficam preservados como estão e só voltam a mudar
// se a pessoa remontá-los do zero; o formulário de edição cobre esporte, data, horários, distância e
// nota, que são os campos que também afetam a estimativa de calorias queimadas.
function acaoEditarTreino(id) {
  const t = state.treinos.find((tr) => tr.id === id);
  if (!t) return;
  state.treinoModo = "manual";
  state.treinoEsporte = t.esporte;
  state.treinoData = t.date;
  state.treinoHoraInicio = t.horaInicio;
  state.treinoHoraFim = t.horaFim;
  state.treinoNota = t.nota || "";
  state.treinoDistanciaKm = t.distanciaKm ? String(t.distanciaKm) : "";
  state.showHistoryTreinos = false;
  state.historyDiaExpandidoTreinos = null;
  limparFotoTreinoSelecionada();
  state.treinoEditandoId = id;
  render();
  // O formulário manual pode já estar montado na tela (ex.: editar um treino logo depois de editar
  // outro, sem trocar de aba) -- nesse caso captureFormState(), chamado no INÍCIO do render() acima,
  // recaptura os valores ainda presentes no DOM (do preenchimento anterior) antes desse novo
  // preenchimento ter chance de aparecer, sobrescrevendo os campos de state setados logo acima. Escreve
  // direto nos inputs, depois do render(), pra garantir que o formulário sempre reflita o treino que
  // está sendo editado -- mesmo padrão (e mesmo motivo) do ajuste em acaoSelecionarJejum().
  const dataEl = document.getElementById("treino-data");
  const inicioEl = document.getElementById("treino-hora-inicio");
  const fimEl = document.getElementById("treino-hora-fim");
  const notaEl = document.getElementById("treino-nota");
  const distanciaEl = document.getElementById("treino-distancia");
  if (dataEl) dataEl.value = t.date;
  if (inicioEl) inicioEl.value = t.horaInicio;
  if (fimEl) fimEl.value = t.horaFim;
  if (notaEl) notaEl.value = t.nota || "";
  if (distanciaEl) distanciaEl.value = t.distanciaKm ? String(t.distanciaKm) : "";
  toastSuccess("Treino carregado no formulário para edição.");
}
function acaoCancelarEdicaoTreino() {
  state.treinoEditandoId = null;
  state.treinoEsporte = "";
  state.treinoEsporteCustom = "";
  state.treinoData = "";
  state.treinoNota = "";
  state.treinoDistanciaKm = "";
  render();
}
function acaoSalvarTreino() {
  const esporte = resolverEsporteTreino();
  if (!esporte) { toastError(state.treinoEsporte === "Outro" ? "Informe o nome do esporte." : "Selecione o esporte."); return; }
  const dataEl = document.getElementById("treino-data");
  const dataTreino = dataEl && dataEl.value ? dataEl.value : today();
  if (dataTreino > today()) { toastError("A data do treino não pode ser no futuro."); return; }
  const inicioEl = document.getElementById("treino-hora-inicio");
  const fimEl = document.getElementById("treino-hora-fim");
  const horaInicio = inicioEl ? inicioEl.value : "";
  const horaFim = fimEl ? fimEl.value : "";
  if (!horaInicio || !horaFim) { toastError("Informe os horários de início e término."); return; }
  const duracaoMin = duracaoMinutos(horaInicio, horaFim);
  if (duracaoMin <= 0) { toastError("O horário de término deve ser depois do horário de início."); return; }
  if (treinoFotoSelecionada && !state.account) { toastError("Conecte sua conta do Google para anexar fotos."); return; }
  const notaEl = document.getElementById("treino-nota");
  const nota = notaEl ? notaEl.value : "";
  const distanciaEl = document.getElementById("treino-distancia");
  const esporteCustomEl = document.getElementById("treino-esporte-custom");
  const camposDistancia = calcularCamposDistanciaTreino(esporte, duracaoMin);

  // Modo edição (ver acaoEditarTreino()): atualiza o registro já salvo em vez de criar um novo,
  // preservando id e grupos musculares -- e, ao final, ressincroniza qualquer dia já encerrado no
  // Diário de Kcal que dependa desse treino (o dia antigo, se a data mudou, e o dia novo), pra
  // calorias queimadas de um dia já fechado não ficarem desatualizadas depois da edição. A foto segue o
  // mesmo padrão de acaoSalvarBioimpedancia(): sem selecionar um novo arquivo, a foto já anexada
  // continua a mesma; selecionando um novo, ela é enviada em segundo plano e substitui a anterior só
  // quando terminar.
  const editandoId = state.treinoEditandoId;
  if (editandoId != null) {
    const registro = state.treinos.find((tr) => tr.id === editandoId);
    if (!registro) { toastError("Treino não encontrado."); return; }
    const dataAntiga = registro.date;
    registro.esporte = esporte;
    registro.date = dataTreino;
    registro.horaInicio = horaInicio;
    registro.horaFim = horaFim;
    registro.duracaoMin = duracaoMin;
    registro.nota = nota;
    Object.assign(registro, camposDistancia);
    registro.caloriasQueimadas = estimarCaloriasQueimadas(registro);
    const arquivoFoto = treinoFotoSelecionada;
    if (arquivoFoto) registro.fotoUrl = ""; // preenchida de novo quando o novo anexo terminar de enviar
    state.treinos = state.treinos.map((tr) => (tr.id === editandoId ? registro : tr));
    persistTreinos();
    state.treinoEditandoId = null;
    state.treinoEsporte = "";
    state.treinoEsporteCustom = "";
    state.treinoData = "";
    state.treinoNota = "";
    state.treinoDistanciaKm = "";
    if (dataEl) dataEl.value = "";
    inicioEl.value = "";
    fimEl.value = "";
    if (notaEl) notaEl.value = "";
    if (distanciaEl) distanciaEl.value = "";
    if (esporteCustomEl) esporteCustomEl.value = "";
    limparFotoTreinoSelecionada();
    sincronizarDiarioKcalDoDia(dataAntiga);
    if (registro.date !== dataAntiga) sincronizarDiarioKcalDoDia(registro.date);
    toastSuccess(arquivoFoto ? "Treino atualizado. Enviando a nova foto em segundo plano..." : "Treino atualizado.");
    const promessaEdicao = state.account ? enviarComFila("atualizarTreinoGoogle", [state.usuario.email, registro]) : Promise.resolve();
    render();
    if (arquivoFoto) processarFotoTreinoEmSegundoPlano(registro.id, arquivoFoto, promessaEdicao);
    return;
  }

  const gruposMusculares = obterGruposMuscularesParaSalvar();
  const novoTreino = Object.assign({ id: Date.now(), date: dataTreino, esporte, horaInicio, horaFim, duracaoMin, fotoUrl: "", nota, gruposMusculares }, camposDistancia);
  novoTreino.caloriasQueimadas = estimarCaloriasQueimadas(novoTreino);
  const arquivoFoto = treinoFotoSelecionada;
  state.treinos = state.treinos.concat([novoTreino]);
  persistTreinos();
  state.treinoEsporte = "";
  state.treinoEsporteCustom = "";
  state.treinoData = "";
  state.treinoNota = "";
  state.treinoDistanciaKm = "";
  state.treinoGruposSelecionados = [];
  state.treinoExerciciosMarcados = {};
  state.treinoNovoExercicioGrupoAberto = null;
  // Limpa os campos no DOM diretamente (não só no state) — como os inputs continuam montados na
  // tela após salvar, o captureFormState() chamado no início do próximo render() ia recapturar o
  // valor antigo ainda presente nos inputs e desfazer a limpeza do state.
  if (dataEl) dataEl.value = "";
  inicioEl.value = "";
  fimEl.value = "";
  if (notaEl) notaEl.value = "";
  if (distanciaEl) distanciaEl.value = "";
  if (esporteCustomEl) esporteCustomEl.value = "";
  limparFotoTreinoSelecionada();
  toastSuccess(arquivoFoto ? "Treino registrado. Enviando a foto em segundo plano..." : "Treino registrado.");
  const promessaRegistroBase = state.account ? enviarComFila("salvarTreinoGoogle", [state.usuario.email, novoTreino]) : Promise.resolve();
  // Mesmo motivo do sincronizarDiarioKcalDoDia() no modo edição acima: se dataTreino for um dia que já
  // tinha sido encerrado no Diário de Kcal (ex.: registrando agora um treino esquecido de um dia que já
  // virou), o registro fechado precisa ser ressincronizado pra já incluir as calorias queimadas desse
  // treino novo -- sem isso, ficava faltando até a pessoa clicar manualmente em "Recalcular".
  sincronizarDiarioKcalDoDia(dataTreino);
  render();
  if (arquivoFoto) processarFotoTreinoEmSegundoPlano(novoTreino.id, arquivoFoto, promessaRegistroBase);
}

function acaoRemoverTreino(id) {
  const t = state.treinos.find((tr) => tr.id === id);
  state.treinos = state.treinos.filter((tr) => tr.id !== id);
  persistTreinos();
  if (state.account) enviarComFila("removerTreinoGoogle", [state.usuario.email, id]);
  // Mesmo motivo do sincronizarDiarioKcalDoDia() em acaoSalvarTreino(): se o dia desse treino já tinha
  // sido encerrado no Diário de Kcal, as calorias queimadas guardadas lá incluíam esse treino -- sem
  // ressincronizar, o registro fechado ficaria com um valor a mais depois da remoção.
  if (t) sincronizarDiarioKcalDoDia(t.date);
  render();
}

// "5,2 km · 8,7 km/h · 6:00 min/km" -- ou "" se o treino não tem distância registrada. Reaproveitado
// na lista de hoje e no histórico.
function treinoDistanciaResumoTexto(t) {
  if (!t.distanciaKm) return "";
  let texto = formatNumber(t.distanciaKm, 2) + " km";
  if (t.velocidadeMediaKmh) texto += " · " + formatNumber(t.velocidadeMediaKmh, 1) + " km/h";
  if (t.paceMinPorKm) texto += " · " + formatarPace(t.paceMinPorKm);
  return texto;
}
// "Peito: Supino reto (4x10, 42kg), Crucifixo (3x12) · Bíceps: Rosca direta (3x12, 15kg)" -- ou "" se o
// treino não tem grupos musculares registrados (só é preenchido pra Musculação -- ver
// treinoGruposMuscularesCampoTemplate()).
function treinoExercicioResumoTexto(ex) {
  const detalhes = [];
  if (ex.series && ex.repeticoes) detalhes.push(ex.series + "x" + ex.repeticoes);
  else if (ex.series) detalhes.push(ex.series + " séries");
  else if (ex.repeticoes) detalhes.push(ex.repeticoes + " repetições");
  if (ex.peso) detalhes.push(formatNumber(ex.peso, 1) + "kg");
  return ex.exercicio + (detalhes.length ? " (" + detalhes.join(", ") + ")" : "");
}
function treinoGrupoResumoTexto(g) {
  return g.exercicios && g.exercicios.length ? g.grupo + ": " + g.exercicios.map(treinoExercicioResumoTexto).join(", ") : g.grupo;
}
function treinoGruposMuscularesResumoTexto(t) {
  if (!t.gruposMusculares || !t.gruposMusculares.length) return "";
  return t.gruposMusculares.map(treinoGrupoResumoTexto).join(" · ");
}
// Versão em lista numerada dos grupos musculares (um grupo por linha, "1. Costas: ...; 2. Peito: ...."),
// usada só no histórico de treinos salvos (treinoHistoryDayCardTemplate()) -- lá o texto corrido
// (treinoGruposMuscularesResumoTexto(), usada no card de "hoje") ficava difícil de ler com vários grupos.
function treinoGruposMuscularesListaHtml(t) {
  if (!t.gruposMusculares || !t.gruposMusculares.length) return "";
  const grupos = t.gruposMusculares;
  return '<ol class="history-day-meal-grupos-lista">' + grupos.map((g, i) => {
    const exerciciosTexto = g.exercicios && g.exercicios.length ? g.exercicios.map(treinoExercicioResumoTexto).join(", ") : "";
    const pontuacao = i === grupos.length - 1 ? "." : ";";
    return "<li><strong>" + esc(g.grupo) + "</strong>" + (exerciciosTexto ? ": " + esc(exerciciosTexto) : "") + pontuacao + "</li>";
  }).join("") + "</ol>";
}
// "~420 kcal" -- ou "" se não deu pra estimar (sem peso registrado em Medidas e Aferições, ou esporte
// sem MET aplicável). Ver estimarCaloriasQueimadas().
function treinoCaloriasResumoTexto(t) {
  if (!t.caloriasQueimadas) return "";
  return "~" + formatNumber(t.caloriasQueimadas) + " kcal";
}
// Resumo de modalidade + kcal queimadas de CADA treino do dia (um item por treino, não agrupado por
// esporte) -- usado na informação inicial (sem precisar expandir) do histórico de treinos salvos, ver
// treinoHistoryDayCardTemplate(). Sem estimativa de kcal pro treino (sem peso cadastrado, ou esporte sem
// MET aplicável -- ver treinoCaloriasResumoTexto()), mostra só a modalidade.
function treinoResumoModalidadesHtml(dayTreinos) {
  return '<div class="history-day-modalidades">' + dayTreinos.map((t) => {
    const kcalTexto = treinoCaloriasResumoTexto(t);
    return '<span class="history-day-modalidade-item">' + emojiEsporte(t.esporte) + " " + esc(t.esporte) +
      (kcalTexto ? ' <span class="modalidade-kcal">· ' + esc(kcalTexto) + "</span>" : "") + "</span>";
  }).join("") + "</div>";
}

    (t.caloriasQueimadas ? '<div class="meal-row-calorias-queimadas">' + icon("flame") + " " + esc(treinoCaloriasResumoTexto(t)) + " queimadas (estimativa)</div>" : "") +
    (t.nota ? '<div class="meal-row-nota">' + icon("help") + " " + esc(t.nota) + "</div>" : "") +

  ).join("");
}

// Mesma lógica do histórico de refeições (ver historyPanelTemplate()): lista TODOS os dias com treinos
// registrados (mais recente primeiro), cada um como um card que se expande ao clicar, mostrando os
// treinos daquele dia -- ver treinoHistoryDayCardTemplate(). Substituiu o antigo calendário de "escolher
// uma data por vez", que obrigava adivinhar em qual dia havia registro.
function treinoHistoryPanelTemplate() {
  if (!state.showHistoryTreinos) return "";
  const days = historyDaysTreinos();
  return '' +
    '<div class="history-panel">' +
      '<div class="history-panel-label">Histórico salvo</div>' +
      (days.length
        ? '<div class="history-days-list">' + days.map((date) => treinoHistoryDayCardTemplate(date)).join("") + "</div>"
        : '<p class="history-panel-empty">Seus treinos aparecerão aqui depois do primeiro registro.</p>'
      ) +

}

  return '' +
    '<div class="history-day' + (expandido ? " history-day-expandido" : "") + '">' +

            '<div class="history-day-meal history-day-meal-static' + ((t.nota || t.distanciaKm || t.caloriasQueimadas || (t.gruposMusculares && t.gruposMusculares.length)) ? " history-day-meal-com-nota" : "") + '">' +
              '<div class="history-day-meal-linha"><span>' + emojiEsporte(t.esporte) + " " + esc(t.esporte) + " · " + esc(t.horaInicio) + "–" + esc(t.horaFim) + "</span><span>" + esc(formatarDuracao(t.duracaoMin)) + (t.fotoUrl ? ' <a class="history-day-meal-foto-link" href="' + esc(t.fotoUrl) + '" target="_blank" rel="noopener" aria-label="Ver foto do treino">' + icon("camera") + "</a>" : "") + ' <button class="history-day-meal-editar-link" aria-label="Editar treino" onclick="event.stopPropagation(); acaoEditarTreino(' + t.id + ')">' + icon("edit") + "</button></span></div>" +
              (t.distanciaKm ? '<p class="history-day-meal-distancia">' + esc(treinoDistanciaResumoTexto(t)) + "</p>" : "") +
              treinoGruposMuscularesListaHtml(t) +
              (t.caloriasQueimadas ? '<p class="history-day-meal-calorias-queimadas">' + esc(treinoCaloriasResumoTexto(t)) + " queimadas (estimativa)</p>" : "") +
              (t.nota ? '<p class="history-day-meal-nota">' + esc(t.nota) + "</p>" : "") +
            "</div>"
          ).join("") + "</div>"

// Abre/fecha um dia do histórico de treinos (accordion: só um dia expandido de cada vez).
function acaoAlternarDiaHistoricoTreinos(date) {
  state.historyDiaExpandidoTreinos = state.historyDiaExpandidoTreinos === date ? null : date;
  render();
}
// Exclui TODOS os treinos registrados naquele dia -- remove cada um localmente e sincroniza cada
// remoção com o backend, igual acaoRemoverTreino() faz pra um treino avulso.
function acaoRemoverDiaHistoricoTreinos(date) {
  const idsDoDia = state.treinos.filter((t) => t.date === date).map((t) => t.id);
  if (!idsDoDia.length) return;
  state.treinos = state.treinos.filter((t) => t.date !== date);
  persistTreinos();
  if (state.account) idsDoDia.forEach((id) => enviarComFila("removerTreinoGoogle", [state.usuario.email, id]));
  if (state.historyDiaExpandidoTreinos === date) state.historyDiaExpandidoTreinos = null;
  sincronizarDiarioKcalDoDia(date);
  render();
}
// Cada vez que o histórico é aberto, começa com todos os dias fechados (evita reabrir com um dia antigo
// expandido que a pessoa tinha navegado antes e esquecido).
function acaoAlternarHistoricoTreinos() {
  state.showHistoryTreinos = !state.showHistoryTreinos;
  if (state.showHistoryTreinos) state.historyDiaExpandidoTreinos = null;
  render();
}

function mealListTemplate() {
  const meals = ordenarPorTipoDeRefeicao(todayMeals());
  if (!meals.length) {
    return '<div class="meal-empty"><div class="meal-empty-icon">' + icon("plus") + "</div><p>Nenhuma refeição registrada hoje</p><p>Descreva a primeira refeição no formulário ao lado.</p></div>";
  }
  // Percentual que o kcal dessa refeição representa da meta de calorias do dia (meta ATUAL, em
  // state.goals -- diferente do Diário de Kcal, essa lista é do dia ainda em aberto, então não há nada
  // congelado ainda pra usar). Ex.: "752 kcal / 39,2%". Sem meta cadastrada (0 ou ausente), mostra só o
  // kcal, sem o percentual.
  const metaCalorias = state.goals.calories;
  return meals.map((m) => {
    // "Exposição Solar" não tem kcal/macros (só vitamina D) -- mostra o resultado que faz sentido pra
    // esse tipo de registro em vez de "0 kcal" (tecnicamente certo, mas confuso de bater o olho).
    const exposicaoSolar = m.name === "Exposição Solar";
    const percentualTexto = metaCalorias > 0 ? " / " + formatNumber((m.calories / metaCalorias) * 100, 1) + "%" : "";
    return '<div class="meal-row" onclick="acaoAbrirDetalheRefeicao(' + m.id + ')"><div class="meal-row-left"><div class="meal-row-icon">' + icon(exposicaoSolar ? "sun" : "utensils") + '</div><div class="meal-row-text"><div class="meal-row-name">' + esc(m.name) + '</div><div class="meal-row-meta">' + icon("clock") + " " + esc(m.time) + " · " + esc(m.detected.join(", ")) + "</div></div></div>" +
    '<div class="meal-row-right"><div class="meal-row-stat">' + (exposicaoSolar
      ? '<div class="meal-row-kcal">' + formatVitaminaDComUI(m.vitD, 1) + " vitamina D</div>"
      : '<div class="meal-row-kcal">' + formatNumber(m.calories) + " kcal" + percentualTexto + '</div><div class="meal-row-macro">P ' + formatNumber(m.protein, 1) + " · C " + formatNumber(m.carbs, 1) + " · G " + formatNumber(m.fat, 1) + "</div>"
    ) + "</div>" +
    '<button class="meal-row-delete" aria-label="Remover refeição" onclick="event.stopPropagation(); acaoRemoverRefeicao(' + m.id + ')">' + icon("trash") + "</button></div></div>";
  }).join("");
}

// Alimentos/comidas de hoje (dentro das refeições que os cards somam -- ver
// mealsDesdeUltimoEncerramento()) que têm ALGUMA contribuição pro nutriente "chave" (>0), da que mais
// contribuiu pra que menos contribuiu -- usada na seção "Alimentos que mais influenciaram" do modal de
// informações de cada card (ver nutrientInfoModalTemplate()). CORRIGIDO a pedido do usuário: a versão
// anterior listava a REFEIÇÃO inteira (ex.: "Almoço"), não o alimento específico (ex.: "Arroz branco
// cozido") -- agora desce um nível, olhando m.alimentos (o detalhamento por alimento já guardado em
// cada refeição, ver acaoSalvarRefeicao()) em vez da refeição como um todo. O mesmo alimento comido em
// mais de uma refeição hoje (ex.: arroz no almoço E na janta) é somado numa linha só -- é a contribuição
// TOTAL daquele alimento no nutriente que importa aqui, não cada ocasião em que foi comido. Empates
// mantêm a ordem de primeira aparição (sort() é estável), e "Exposição solar" entra na lista
// normalmente quando a chave é vitD (é a única em que contribui) -- sem nenhum caso especial, já que é
// só mais um "alimento" (label "Exposição solar") dentro de uma refeição com vitD > 0.
function alimentosQueMaisInfluenciaramNutriente(chave) {
  const porAlimento = new Map();
  mealsDesdeUltimoEncerramento().forEach((m) => {
    (m.alimentos || []).forEach((a) => {
      const valor = (a.values && a.values[chave]) || 0;
      if (!valor) return;
      const atual = porAlimento.get(a.label);
      if (atual) atual.valor += valor;
      else porAlimento.set(a.label, { label: a.label, valor: valor });
    });
  });
  return Array.from(porAlimento.values()).sort((a, b) => b.valor - a.valor);
}
// Formata o valor de UM alimento pra uma chave de nutriente qualquer (macro ou micro), com a mesma
// regra de casas decimais já usada nos cards (nutrientCardsTemplate()/micronutrientCardsTemplate()) --
// calorias sem casas decimais, os demais macros com 1, micronutrientes em mg com referência >= 100
// sem casas decimais (ex.: cálcio, potássio, sódio) e os demais com 1. Vitamina D sempre em "mcg / UI"
// (ver formatVitaminaDComUI()), igual em todo o resto do app.
function formatNutrienteValorGenerico(chave, valor) {
  if (chave === "vitD") return formatVitaminaDComUI(valor, 1);
  const macro = nutrientMeta[chave];
  if (macro) return formatNumber(valor, chave === "calories" ? 0 : 1) + " " + macro.unit;
  const micro = micronutrientMeta[chave];
  if (!micro) return formatNumber(valor, 1);
  const goal = MICRO_GOALS[chave];
  const digits = micro.unit === "mg" && goal >= 100 ? 0 : 1;
  return formatNumber(valor, digits) + " " + micro.unit;
}
// Seção "Alimentos que mais influenciaram" do modal de informações de um nutriente -- lista os
// alimentos de hoje com alguma contribuição pra esse nutriente, em ordem decrescente de contribuição
// (ver alimentosQueMaisInfluenciaramNutriente()), cada um com uma barrinha proporcional ao quanto
// representa do total consumido hoje daquele nutriente (mesmo pct() já usado nas barras de progresso
// dos cards). Sem nenhum alimento com contribuição ainda hoje, mostra um aviso em vez da lista vazia.
function alimentosInfluenciaramNutrienteTemplate(chave, meta) {
  const lista = alimentosQueMaisInfluenciaramNutriente(chave);
  if (!lista.length) {
    return '<p class="imc-empty">Você ainda não registrou hoje nenhum alimento que contribua para ' + esc(meta.label.toLowerCase()) + ".</p>";
  }
  const total = lista.reduce((soma, r) => soma + r.valor, 0);
  return '<div class="nutrient-info-refeicoes-lista">' + lista.map((r, i) =>
    '<div class="nutrient-info-refeicao-row">' +
      '<span class="nutrient-info-refeicao-rank">' + (i + 1) + "º</span>" +
      '<div class="nutrient-info-refeicao-info"><div class="nutrient-info-refeicao-nome">' + esc(r.label) + "</div>" +
        '<div class="nutrient-info-refeicao-barra"><div class="nutrient-info-refeicao-barra-fill" style="width:' + pct(r.valor, total) + "%;background:" + meta.color + '"></div></div></div>' +
      '<span class="nutrient-info-refeicao-valor">' + formatNutrienteValorGenerico(chave, r.valor) + '<span class="nutrient-info-refeicao-pct">' + formatNumber(pct(r.valor, total), 0) + "%</span></span>" +
    "</div>"
  ).join("") + "</div>";
}

// Seção específica do modal de informações da Bioimpedância (ver exameInfoModalTemplate()) -- pedido
// do usuário: Peso, IMC, massa muscular e % de gordura do último registro, cada um comparado ao valor
// que seria esperado/desejado pras características (idade, sexo, altura) do usuário. Peso/IMC usa a
// classificação de IMC da OMS (ver faixaPesoSaudavel()); gordura e massa muscular reaproveitam as
// mesmas referências e textos já usados na conclusão de idade metabólica (ver
// comparacaoGorduraEsperadaTexto()/comparacaoMassaMuscularLimiarTexto()).
function exameInfoBioimpedanciaSecaoTemplate() {
  const ultimoBio = ultimaBioimpedancia();
  if (!ultimoBio) {
    return '<p class="calo-conclusao-dica">' + icon("help") + " Cadastre um registro de Bioimpedância para ver a comparação com os valores esperados para suas características." + "</p>";
  }
  const idadeRealInfo = state.usuario && state.usuario.dataNascimento ? calcularIdadeExata(state.usuario.dataNascimento) : null;
  const sexoUsuario = state.usuario && state.usuario.sexo;
  const partes = [];
  if (ultimoBio.altura != null && ultimoBio.peso != null) {
    const faixaPeso = faixaPesoSaudavel(ultimoBio.altura);
    const peso = Number(ultimoBio.peso);
    const alturaM = Number(ultimoBio.altura) / 100;
    const imc = peso / (alturaM * alturaM);
    if (faixaPeso) {
      const dentroFaixa = peso >= faixaPeso.min && peso <= faixaPeso.max;
      partes.push('<p class="calo-conclusao-razao"><strong>Peso e IMC:</strong> para sua altura (' + formatNumber(ultimoBio.altura, 1) + ' cm), a Organização Mundial da Saúde considera saudável o peso entre ' + formatNumber(faixaPeso.min, 1) + ' kg e ' + formatNumber(faixaPeso.max, 1) + ' kg (IMC entre 18,5 e 24,9). Seu peso medido (' + formatNumber(peso, 1) + ' kg, IMC ' + formatNumber(imc, 1) + ") está " +
        (dentroFaixa
          ? "dentro dessa faixa"
          : (peso > faixaPeso.max
            ? formatNumber(peso - faixaPeso.max, 1) + " kg acima dela"
            : formatNumber(faixaPeso.min - peso, 1) + " kg abaixo dela")) + ".</p>");
    }
  }
  if (ultimoBio.gordura != null) {
    const textoGordura = idadeRealInfo && sexoUsuario ? comparacaoGorduraEsperadaTexto(ultimoBio.gordura, idadeRealInfo.anos, sexoUsuario) : null;
    partes.push('<p class="calo-conclusao-razao"><strong>Percentual de gordura:</strong> ' + (textoGordura || ("seu valor medido foi de " + formatNumber(ultimoBio.gordura, 1) + "%; informe sua data de nascimento e sexo no perfil para comparar com a faixa esperada para suas características.")) + "</p>");
  }
  if (ultimoBio.massaMuscular != null) {
    const textoMassaMuscular = sexoUsuario ? comparacaoMassaMuscularLimiarTexto(ultimoBio.massaMuscular, sexoUsuario) : null;
    partes.push('<p class="calo-conclusao-razao"><strong>Massa muscular:</strong> ' + (textoMassaMuscular || ("seu valor medido foi de " + formatNumber(ultimoBio.massaMuscular, 1) + " kg; informe seu sexo no perfil para comparar com o limiar de referência.")) + "</p>");
  }
  if (!partes.length) {
    return '<p class="calo-conclusao-dica">' + icon("help") + " Cadastre seu peso, altura, % de gordura e massa muscular na Bioimpedância para ver essa comparação." + "</p>";
  }
  return '<p class="calo-conclusao-titulo">Exame de ' + dataCurta(ultimoBio.date) + "</p>" + partes.join("");
}

// BUG CORRIGIDO (relatado pelo usuário: texto digitado no campo de ingredientes ficava invisível): o

// Junta uma lista de textos numa frase natural em português: com vírgulas entre os itens e "e" antes
// do último (ex.: ["às 07:15", "em jejum", "antes de dormir"] -> "às 07:15, em jejum e antes de
// dormir"). Descarta itens vazios. Usado pela legenda do card de IMC (ver
// legendaContextoPesoReferencia() logo abaixo).
function juntarComE(itens) {
  const validos = itens.filter(Boolean);
  if (!validos.length) return "";
  if (validos.length === 1) return validos[0];
  return validos.slice(0, -1).join(", ") + " e " + validos[validos.length - 1];
}
// Complementa a legenda do card de IMC ("Calculado a partir do peso de X kg, registrado em [data]")
// com a hora do registro e o que o usuário informou ao pesar: se foi em jejum ou não, e em que momento
// (antes de dormir, antes/depois da refeição ou antes/depois do treino -- ver
// MEDIDA_MOMENTO_PESO_OPCOES/acaoSalvarMedida()). Pedido do usuário. Devolve já com um espaço na
// frente, pronta pra ser concatenada direto depois da data (ou "" se não houver nada a acrescentar --
// registros salvos antes desses campos existirem, por exemplo).
function legendaContextoPesoReferencia(pesoRef) {
  const momento = pesoRef.momento ? momentoPesoInfo(pesoRef.momento) : null;
  const texto = juntarComE([
    pesoRef.time ? "às " + esc(pesoRef.time) : "",
    typeof pesoRef.jejum === "boolean" ? (pesoRef.jejum ? "em jejum" : "fora de jejum") : "",
    momento ? momento.frase : "",
  ]);
  return texto ? " " + texto : "";
}

      :
