const BIOIMPEDANCIA_CAMPOS = ["altura", "peso", "gordura", "massaMagra", "massaMuscular", "aguaCorporal", "gorduraVisceral"];
// idadeMetabolica morou aqui, mas passou pro formulário de Calorimetria a pedido do usuário -- faz mais
// sentido junto da TMB, já que é a partir dela que a estimativa é calculada (ver
// acaoEstimarIdadeMetabolica() logo abaixo). Continua opcional, igual antes.
const CALORIMETRIA_CAMPOS = ["tmb", "get", "idadeMetabolica"];

// Perfis de Nível de Atividade Física (NAF) usados pra ESTIMAR o GET a partir da TMB quando a pessoa não
// sabe/não tem o valor do próprio exame (ver getCampoTemplate()/acaoCalcularGetPerfil() logo abaixo).
// Fórmula: GET = TMB x fator de atividade -- os fatores são a tabela clássica de atividade física
// (adaptada do conceito de PAL da FAO/OMS/UNU, "Human Energy Requirements", 2001, e amplamente usada por
// calculadoras de nutrição esportiva, ex. Legion Athletics). O jeito preferido/mais objetivo de
// identificar o perfil é pela média de passos/dia (faixas do índice de sedentarismo por contagem de
// passos -- Tudor-Locke C, et al., "A step-defined sedentary lifestyle index: <5000 steps/day", Applied
// Physiology, Nutrition, and Metabolism, 2013); quando a pessoa não sabe os passos, cai pro heurístico
// por pontuação de 3 perguntas de apoio sobre a rotina (tempo em pé fora do trabalho, frequência de
// caminhadas pra resolver coisas, uso de escadas) -- uma estimativa mais grosseira, por isso não alcança
// os dois perfis mais ativos (ver perfilPorPontuacaoFallback()).
const PERFIS_NAF = [
  { chave: "sedentario", label: "Sedentário", fator: 1.2, passosTexto: "menos de 5.000 passos/dia", descricao: "pouca ou nenhuma movimentação no dia a dia, sem exercício regular" },
  { chave: "pouco_ativo", label: "Pouco ativo", fator: 1.375, passosTexto: "5.000 a 7.499 passos/dia", descricao: "alguma caminhada e movimentação no dia a dia (resolver coisas a pé, escadas), sem exercício estruturado" },
  { chave: "moderadamente_ativo", label: "Moderadamente ativo", fator: 1.55, passosTexto: "7.500 a 9.999 passos/dia", descricao: "rotina com movimentação constante ao longo do dia" },
  { chave: "muito_ativo", label: "Muito ativo", fator: 1.725, passosTexto: "10.000 a 12.499 passos/dia", descricao: "rotina com bastante movimentação diária" },
  { chave: "extremamente_ativo", label: "Extremamente ativo", fator: 1.9, passosTexto: "12.500 passos/dia ou mais", descricao: "rotina com movimentação muito intensa no dia a dia" },
];
function perfilNaf(chave) { return PERFIS_NAF.find((p) => p.chave === chave) || null; }
function perfilPorFaixaPassos(faixa) {
  const mapa = { menos5000: "sedentario", "5000a7499": "pouco_ativo", "7500a9999": "moderadamente_ativo", "10000a12499": "muito_ativo", mais12500: "extremamente_ativo" };
  return mapa[faixa] || null;
}
// Heurístico de apoio (só usado quando a pessoa não sabe a média de passos/dia): soma pontos das 3
// perguntas (0 a 3 cada, exceto escadas que vai só até 2) e mapeia a soma pra um perfil -- uma
// aproximação qualitativa, por isso não chega aos perfis "Muito ativo"/"Extremamente ativo" (esses só
// saem do caminho objetivo, por passos).
function perfilPorPontuacaoFallback(empe, caminhadas, escadas) {
  const pontos = {
    empe: { menos30: 0, "30a60": 1, "60a120": 2, mais120: 3 },
    caminhadas: { quase_nunca: 0, "1a2": 1, "3a5": 2, quase_todo_dia: 3 },
    escadas: { raramente: 0, ocasional: 1, frequente: 2 },
  };
  if (!(empe in pontos.empe) || !(caminhadas in pontos.caminhadas) || !(escadas in pontos.escadas)) return null;
  const soma = pontos.empe[empe] + pontos.caminhadas[caminhadas] + pontos.escadas[escadas];
  if (soma <= 1) return "sedentario";
  if (soma <= 4) return "pouco_ativo";
  if (soma <= 6) return "moderadamente_ativo";
  return "muito_ativo";
}

// Botão "Calcular GET a partir do perfil" (ver getCampoTemplate()) -- mesmo padrão dos outros botões de
// estimativa deste formulário (acaoEstimarIdadeMetabolica() logo abaixo, acaoLerRotuloOCR() no cadastro
// de produto): lê a TMB e as respostas do mini-questionário direto do DOM, sem chamar render() no meio
// (pra não arriscar apagar outros campos deste formulário ainda não sincronizados em
// state.caloFormValores -- ver comentário em idadeMetabolicaCampoTemplate()). Caminho preferido:
// identificar o perfil pela faixa de passos/dia selecionada (objetivo, ver PERFIS_NAF); só cai pro
// heurístico das 3 perguntas de apoio (perfilPorPontuacaoFallback()) quando a pessoa marca "não sei" nos
// passos. Calcula GET = TMB x fator do perfil identificado, escreve direto no campo #calo-get e mostra o
// resultado (perfil, fórmula e valor) na legenda logo abaixo -- a pessoa ainda pode ajustar manualmente
// antes de salvar.
function acaoCalcularGetPerfil() {
  const inputTmb = document.getElementById("calo-tmb");
  const tmbBruto = inputTmb ? Number(inputTmb.value.trim().replace(",", ".")) : NaN;
  if (!tmbBruto) { toastError("Informe a Taxa Metabólica Basal (TMB) acima antes de calcular o GET."); return; }
  // Usa a TMB JÁ COM o desconto de balança de bioimpedância (ver tmbCampoTemplate()/tmbComDesconto()),
  // não o valor bruto digitado -- o campo #calo-tmb sempre guarda o que a pessoa digitou, sem desconto
  // (o desconto só é aplicado na hora de salvar, em acaoSalvarCalorimetria()); calcular o GET aqui a
  // partir do bruto inflava o GET quando a fonte era balança (bug relatado pelo usuário).
  const fonteEl = document.querySelector('input[name="calo-tmb-fonte"]:checked');
  const fonte = fonteEl ? fonteEl.value : "";
  const tmb = tmbComDesconto(tmbBruto, fonte);

  const passosEl = document.getElementById("calo-perfil-passos");
  const passos = passosEl ? passosEl.value : "";
  let chavePerfil = null;
  if (!passos) { toastError("Selecione sua média de passos por dia (ou \"Não sei / não meço\") pra calcular o GET."); return; }
  if (passos === "nao_sei") {
    const empeEl = document.getElementById("calo-perfil-empe");
    const caminhadasEl = document.getElementById("calo-perfil-caminhadas");
    const escadasEl = document.getElementById("calo-perfil-escadas");
    chavePerfil = perfilPorPontuacaoFallback(empeEl ? empeEl.value : "", caminhadasEl ? caminhadasEl.value : "", escadasEl ? escadasEl.value : "");
    if (!chavePerfil) { toastError("Responda as 3 perguntas abaixo pra eu conseguir estimar seu perfil sem os passos."); return; }
  } else {
    chavePerfil = perfilPorFaixaPassos(passos);
  }

  const perfil = perfilNaf(chavePerfil);
  if (!perfil) { toastError("Não foi possível identificar o perfil com essas respostas."); return; }
  const get = Math.round(tmb * perfil.fator);
  const inputGet = document.getElementById("calo-get");
  if (inputGet) inputGet.value = get;

  const resultadoEl = document.getElementById("calo-perfil-resultado");
  if (resultadoEl) {
    resultadoEl.innerHTML = '<p class="calo-conclusao-resultado">' + icon("sparkles") +
      " Perfil identificado: <strong>" + esc(perfil.label) + "</strong> (fator " + formatNumber(perfil.fator, 3) + "×) — " + esc(perfil.descricao) + "." +
      " GET = " + formatNumber(tmb) + " × " + formatNumber(perfil.fator, 3) + " = <strong>" + formatNumber(get) + " kcal</strong>." +
      (fonte === "bioimpedancia" ? " (TMB já com o desconto de 10% da balança: " + formatNumber(tmbBruto, 1) + " × 0,90 = " + formatNumber(tmb, 1) + " kcal.)" : "") +
    "</p>";
  }
  toastSuccess("GET calculado em " + formatNumber(get) + " kcal, a partir do perfil " + perfil.label + ". Esse valor exclui os treinos (que entram à parte no Diário) -- confira antes de salvar.");
}
// Mostra/esconde as 3 perguntas de apoio (ver perfilPorPontuacaoFallback()) conforme a pessoa escolhe
// "Não sei / não meço" na média de passos -- só alterna o display direto no elemento (sem render()),
// mesmo motivo das outras ações deste formulário.
function acaoAlternarFallbackPerfilNaf() {
  const passosEl = document.getElementById("calo-perfil-passos");
  const fallbackEl = document.getElementById("calo-perfil-fallback");
  if (!passosEl || !fallbackEl) return;
  fallbackEl.style.display = passosEl.value === "nao_sei" ? "" : "none";
}

// Fator de desconto aplicado à TMB quando a pessoa marca que o valor veio de uma balança de
// bioimpedância doméstica, em vez de um exame de calorimetria indireta -- balanças de bioimpedância são
// notoriamente menos precisas que a calorimetria indireta pra medir taxa metabólica (usam fórmulas de
// estimativa a partir de bioimpedância elétrica, não medição direta de troca gasosa), a pedido do usuário
// pra compensar esse erro típico. Ver tmbCampoTemplate()/acaoSalvarCalorimetria().
const TMB_DESCONTO_BIOIMPEDANCIA = 0.9;
function tmbComDesconto(bruto, fonte) {
  const valor = fonte === "bioimpedancia" ? bruto * TMB_DESCONTO_BIOIMPEDANCIA : bruto;
  return Math.round(valor * 10) / 10;
}
// Mostra/esconde o campo de TMB conforme a pessoa escolhe a fonte do valor (ver tmbCampoTemplate()) --
// só alterna o display e atualiza o aviso de desconto/a conclusão de idade metabólica direto nos
// elementos (sem render()), mesmo motivo das outras ações deste formulário.
function acaoTrocarFonteTmb() {
  const wrapEl = document.getElementById("calo-tmb-campo-wrap");
  const fonteEl = document.querySelector('input[name="calo-tmb-fonte"]:checked');
  if (wrapEl) wrapEl.style.display = fonteEl ? "" : "none";
  acaoAtualizarDescontoTmbBioimpedancia();
  acaoAtualizarConclusaoIdadeMetabolica(); // idade metabólica também depende da TMB -- mantém em sincronia
}
// Legenda ao vivo (oninput na TMB, onchange na fonte) mostrando o valor final que será salvo quando a
// fonte é "bioimpedancia" -- só aparece nesse caso; com "calorimetria" (ou sem fonte escolhida ainda) o
// valor digitado é usado sem nenhum ajuste, não precisa de aviso.
function acaoAtualizarDescontoTmbBioimpedancia() {
  const avisoEl = document.getElementById("calo-tmb-desconto-aviso");
  if (!avisoEl) return;
  const fonteEl = document.querySelector('input[name="calo-tmb-fonte"]:checked');
  const fonte = fonteEl ? fonteEl.value : "";
  const inputTmb = document.getElementById("calo-tmb");
  const bruto = inputTmb ? Number(inputTmb.value.trim().replace(",", ".")) : NaN;
  avisoEl.innerHTML = (fonte === "bioimpedancia" && bruto) ? tmbDescontoAvisoHtml(bruto) : "";
}

// Campo movido de Bioimpedância pra Calorimetria a pedido do usuário -- faz mais sentido junto da TMB,
// já que é a partir dela que a estimativa é calculada. Lê a TMB direto do DOM (o formulário não
// sincroniza esse campo com o state a cada tecla -- só na hora de salvar, ver acaoSalvarCalorimetria),
// pra pegar o valor mais atual que a pessoa está digitando agora, mesmo que ainda não tenha sido salvo.
// Peso e altura vêm do último registro de Bioimpedância já salvo (ultimaBioimpedancia()) -- são campos
// de OUTRO formulário/aba, não deste. Preenche o campo "Idade metabólica" direto (sem chamar render())
// -- ver comentário em idadeMetabolicaCampoTemplate() -- e atualiza a conclusão logo abaixo (ver
// conclusaoIdadeMetabolicaHtml()), que já cobre com mais detalhe a comparação com a idade real.
function acaoEstimarIdadeMetabolica() {
  const inputTmb = document.getElementById("calo-tmb");
  const tmb = inputTmb ? Number(inputTmb.value.trim().replace(",", ".")) : NaN;
  if (!tmb) { toastError("Informe a Taxa Metabólica Basal (TMB) acima antes de calcular a estimativa."); return; }
  const ultimaBio = ultimaBioimpedancia();
  if (!ultimaBio || !ultimaBio.peso || !ultimaBio.altura) { toastError("Registre peso e altura em Bioimpedância antes de calcular a estimativa de idade metabólica."); return; }
  const sexo = state.usuario && state.usuario.sexo;
  if (sexo !== "masculino" && sexo !== "feminino") { toastError("Informe seu sexo no seu perfil antes de calcular a estimativa de idade metabólica."); return; }
  const estimativa = estimarIdadeMetabolica(tmb, ultimaBio.peso, ultimaBio.altura, sexo);
  if (estimativa == null) { toastError("Não foi possível calcular a estimativa com os dados informados."); return; }
  const inputIdade = document.getElementById("calo-idadeMetabolica");
  if (inputIdade) inputIdade.value = estimativa;
  toastSuccess("Idade metabólica estimada em " + estimativa + " anos, com base na TMB informada acima e no peso/altura do registro de Bioimpedância de " + dataCurta(ultimaBio.date) + " e no sexo do perfil. Não é o valor oficial do seu aparelho — veja como calculamos na legenda abaixo. Você ainda pode ajustar manualmente antes de salvar.");
  acaoAtualizarConclusaoIdadeMetabolica();
}

// Diferença em dias corridos entre duas datas "AAAA-MM-DD" -- usada só pelas tendências de peso/kcal
// abaixo. "T12:00:00" (meio-dia) evita o problema de fuso horário que rolaria com meia-noite (ver
// mesmo padrão em today()/proximoDia()).
function diasEntre(dateA, dateB) {
  return Math.round((new Date(dateB + "T12:00:00").getTime() - new Date(dateA + "T12:00:00").getTime()) / 86400000);
}
// Tendência de peso nas últimas semanas -- um dos fatores especulativos usados por
// conclusaoIdadeMetabolicaHtml() (ver comentário lá). Exige pelo menos duas medições de peso na janela
// E separadas por pelo menos 14 dias -- menos que isso é variação do dia a dia (hidratação, refeição
// recente etc.), não uma tendência de verdade.
function tendenciaPesoUltimasSemanas(janelaDias) {
  const hoje = today();
  const limite = new Date(hoje + "T12:00:00");
  limite.setDate(limite.getDate() - janelaDias);
  const limiteStr = limite.toISOString().slice(0, 10);
  const registros = state.medidas
    .filter((m) => m.tipo === "peso" && m.date >= limiteStr && m.date <= hoje)
    .map((m) => ({ date: m.date, valor: Number(String(m.valor).replace(",", ".")) }))
    .filter((m) => !isNaN(m.valor))
    .sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
  if (registros.length < 2) return null;
  const primeiro = registros[0];
  const ultimo = registros[registros.length - 1];
  const dias = diasEntre(primeiro.date, ultimo.date);
  if (dias < 14) return null;
  return { deltaKg: ultimo.valor - primeiro.valor, dias: dias };
}
// Consumo/gasto médio das últimas semanas -- ver comentário de tendenciaPesoUltimasSemanas() acima.
// Usa o Diário de Kcal (state.diarioKcal), que já tem o total consumido e as calorias queimadas em
// treino de cada dia fechado -- exige pelo menos 7 dias com registro dentro da janela (uma semana
// cheia), senão a média fica sujeita demais a poucos dias isolados.
function tendenciaKcalUltimasSemanas(janelaDias, tmb) {
  const hoje = today();
  const limite = new Date(hoje + "T12:00:00");
  limite.setDate(limite.getDate() - janelaDias);
  const limiteStr = limite.toISOString().slice(0, 10);
  const registros = state.diarioKcal.filter((r) => r.date >= limiteStr && r.date < hoje && r.calories != null);
  if (registros.length < 7) return null;
  const mediaConsumida = registros.reduce((soma, r) => soma + r.calories, 0) / registros.length;
  const mediaQueimada = registros.reduce((soma, r) => soma + (r.caloriasQueimadas || 0), 0) / registros.length;
  const mediaGastoTotal = tmb + mediaQueimada;
  return { mediaConsumida: mediaConsumida, mediaGastoTotal: mediaGastoTotal, saldoMedio: mediaConsumida - mediaGastoTotal, dias: registros.length };
}
// Janela usada pelas duas tendências acima -- "últimas semanas", nunca "últimos dias": TMB não muda de
// um dia pro outro, só composição corporal e hábito alimentar mudam ao longo de semanas/meses (ver
// conclusaoIdadeMetabolicaHtml() abaixo).
const JANELA_TENDENCIA_IDADE_METABOLICA_DIAS = 30;
// "Conclusão" mostrada junto ao campo de idade metabólica na Calorimetria -- pedido do usuário: compara
// a idade metabólica (do campo, digitada ou calculada) com a idade real (do perfil) e tenta explicar
// prováveis razões da diferença. Decidido com o usuário: a explicação usa (1) composição corporal
// (massa muscular/gordura) do último registro de Bioimpedância, quando existir, e (2) a tendência de
// peso e o saldo calórico médio das ÚLTIMAS SEMANAS (nunca de poucos dias -- ver comentário acima) --
// sempre deixando claro que é uma correlação especulativa com os dados já registrados no app, não uma
// causa comprovada nem um diagnóstico. Sem nenhum dado disponível pra nenhuma das duas explicações, cai
// pra uma resposta honesta genérica em vez de inventar uma causa.
function conclusaoIdadeMetabolicaHtml(idadeMetabolicaValor, tmbValor) {
  const idadeMetabolica = Number(String(idadeMetabolicaValor == null ? "" : idadeMetabolicaValor).trim().replace(",", "."));
  if (!idadeMetabolica) return "";
  const idadeRealInfo = state.usuario && state.usuario.dataNascimento ? calcularIdadeExata(state.usuario.dataNascimento) : null;
  if (!idadeRealInfo) {
    return '<p class="calo-conclusao-dica">' + icon("help") + " Informe sua data de nascimento no perfil para comparar com sua idade real.</p>";
  }
  const idadeReal = idadeRealInfo.anos + idadeRealInfo.meses / 12;
  const diff = idadeMetabolica - idadeReal; // positivo = idade metabólica MAIOR (TMB abaixo do esperado); negativo = MENOR (TMB acima do esperado)
  const diffAbs = Math.abs(diff);

  if (diffAbs < 3) {
    return '<div class="calo-conclusao-idade-metabolica"><p class="calo-conclusao-resultado">' + icon("check") +
      " Sua idade metabólica estimada (" + formatNumber(idadeMetabolica, 1) + " anos) está bem próxima da sua idade real (" + idadeRealInfo.anos + " anos) — sem uma diferença relevante pra explicar.</p></div>";
  }

  const maisJovem = diff < 0; // TMB acima do previsto pra idade real
  const razoes = [];

  const ultimaBio = ultimaBioimpedancia();
  const tmb = Number(String(tmbValor == null ? "" : tmbValor).trim().replace(",", "."));
  // TMB "esperada" pra alguém com a idade REAL, sexo, altura e peso do usuário (calcularTmbEsperada()
  // acima) -- comparada com a TMB que ele efetivamente registrou no exame de calorimetria. Pedido do
  // usuário: mostrar esses dois números antes das prováveis razões, em vez de só um aviso genérico de
  // "estimativa pouco confiável". Sem peso/altura (Bioimpedância) ou sexo cadastrados, não dá pra
  // calcular -- omite esse trecho em vez de inventar um número.
  const sexoUsuario = state.usuario && state.usuario.sexo;
  const tmbEsperada = ultimaBio && ultimaBio.peso != null && ultimaBio.altura != null
    ? calcularTmbEsperada(idadeRealInfo.anos, ultimaBio.peso, ultimaBio.altura, sexoUsuario)
    : null;
  let comparacaoTmbHtml = "";
  if (tmbEsperada != null) {
    comparacaoTmbHtml = "Para sua idade, sexo, altura e peso a TMB esperada é de " + formatNumber(tmbEsperada) + " kcal/dia.";
    if (tmb) {
      const diffTmb = tmb - tmbEsperada;
      comparacaoTmbHtml += " No último exame sua TMB resultou " + formatNumber(tmb) + " kcal/dia, o que indica uma diferença de " +
        formatNumber(Math.abs(diffTmb)) + " kcal/dia " + (diffTmb < 0 ? "abaixo" : "acima") + " da TMB de alguém com suas características.";
    }
  }

  if (ultimaBio && (ultimaBio.massaMuscular != null || ultimaBio.gordura != null)) {
    const partes = [];
    if (ultimaBio.massaMuscular != null) partes.push(formatNumber(ultimaBio.massaMuscular, 1) + " kg de massa muscular");
    if (ultimaBio.gordura != null) partes.push(formatNumber(ultimaBio.gordura, 1) + "% de gordura corporal");
    // Comparação com valores de referência (pedido do usuário -- mesma lógica da "TMB esperada" acima:
    // não basta dizer "mais" ou "menos" sem mostrar contra o quê). Gordura tem uma faixa esperada
    // cientificamente estabelecida (Gallagher et al., 2000); massa muscular não tem um equivalente
    // confiável, então usamos o limiar clínico de massa BAIXA (EWGSOP2) só como referência aproximada,
    // sempre com a ressalva do método (DXA/apendicular vs. bioimpedância de corpo inteiro) e da
    // população de validação (idosos) -- ver GORDURA_ESPERADA_FAIXAS/MASSA_MUSCULAR_BAIXA_LIMIAR_KG.
    let comparacaoComposicaoHtml = "";
    if (ultimaBio.gordura != null) {
      const textoGordura = comparacaoGorduraEsperadaTexto(ultimaBio.gordura, idadeRealInfo.anos, sexoUsuario);
      if (textoGordura) comparacaoComposicaoHtml += " " + textoGordura;
    }
    if (ultimaBio.massaMuscular != null) {
      const textoMassaMuscular = comparacaoMassaMuscularLimiarTexto(ultimaBio.massaMuscular, sexoUsuario);
      if (textoMassaMuscular) comparacaoComposicaoHtml += " " + textoMassaMuscular;
    }
    razoes.push("<strong>Composição corporal:</strong> seu último registro de Bioimpedância (" + dataCurta(ultimaBio.date) + ") mostra " + partes.join(" e ") + "." + comparacaoComposicaoHtml +
      " A fórmula usada na estimativa não enxerga esses dados — só peso, altura e sexo — e " +
      (maisJovem
        ? "mais massa muscular (que consome mais energia em repouso que gordura) costuma elevar a TMB real acima do previsto, o que pode explicar uma idade metabólica estimada mais baixa que a real."
        : "menos massa muscular ou mais gordura corporal em relação à média costuma reduzir a TMB real abaixo do previsto, o que pode explicar uma idade metabólica estimada mais alta que a real."));
  }

  if (tmb) {
    const tendenciaKcal = tendenciaKcalUltimasSemanas(JANELA_TENDENCIA_IDADE_METABOLICA_DIAS, tmb);
    const tendenciaPeso = tendenciaPesoUltimasSemanas(JANELA_TENDENCIA_IDADE_METABOLICA_DIAS);
    if (tendenciaKcal) {
      const deficit = tendenciaKcal.saldoMedio < -100;
      const superavit = tendenciaKcal.saldoMedio > 100;
      if (deficit && !maisJovem) {
        razoes.push("<strong>Consumo x gasto recente:</strong> nos últimos " + tendenciaKcal.dias + " dias com registro no Diário de Kcal, seu consumo médio (" + formatNumber(tendenciaKcal.mediaConsumida) + " kcal/dia) ficou abaixo do seu gasto total médio estimado (" + formatNumber(tendenciaKcal.mediaGastoTotal) + " kcal/dia)" +
          (tendenciaPeso && tendenciaPeso.deltaKg < -0.5 ? ", e seu peso caiu " + formatNumber(Math.abs(tendenciaPeso.deltaKg), 1) + " kg nesse período" : "") +
          ". Um déficit calórico sustentado por semanas pode, em alguns casos, reduzir temporariamente o metabolismo basal além do esperado só pela perda de peso (um efeito chamado adaptação metabólica) — é uma correlação plausível com os seus dados, não uma causa comprovada nesse caso.");
      } else if (superavit && maisJovem) {
        razoes.push("<strong>Consumo x gasto recente:</strong> nos últimos " + tendenciaKcal.dias + " dias com registro no Diário de Kcal, seu consumo médio (" + formatNumber(tendenciaKcal.mediaConsumida) + " kcal/dia) ficou acima do seu gasto total médio estimado (" + formatNumber(tendenciaKcal.mediaGastoTotal) + " kcal/dia)" +
          (tendenciaPeso && tendenciaPeso.deltaKg > 0.5 ? ", e seu peso subiu " + formatNumber(tendenciaPeso.deltaKg, 1) + " kg nesse período" : "") +
          ". Um superávit calórico sustentado, especialmente combinado a treino de força, favorece ganho de massa muscular — o que eleva a TMB real acima do previsto. É uma correlação plausível com os seus dados, não uma causa comprovada nesse caso.");
      }
    }
  }

  if (!razoes.length) {
    razoes.push("Não há dados suficientes (composição corporal em Bioimpedância, ou histórico de consumo/peso das últimas semanas) pra apontar uma causa específica. Pode ser variação individual normal do seu metabolismo, a margem de erro da própria fórmula — que é uma média populacional, não personalizada — ou uma característica do aparelho/exame que gerou essa TMB.");
  }

  const naoConfiavel = diffAbs >= LIMIAR_DIFERENCA_IDADE_METABOLICA_ANOS;
  return '<div class="calo-conclusao-idade-metabolica">' +
    '<p class="calo-conclusao-resultado' + (naoConfiavel ? " calo-conclusao-resultado-aviso" : "") + '">' + icon(naoConfiavel ? "info" : "sparkles") +
      " Sua idade metabólica estimada (" + formatNumber(idadeMetabolica, 1) + " anos) está " + formatNumber(diffAbs, 1) + " anos " + (maisJovem ? "mais jovem" : "mais velha") + " que sua idade real (" + idadeRealInfo.anos + " anos)." +
    "</p>" +
    (comparacaoTmbHtml ? '<p class="calo-conclusao-tmb-comparacao">' + comparacaoTmbHtml + "</p>" : "") +
    '<p class="calo-conclusao-titulo">Prováveis razões</p>' +
    razoes.map((r) => '<p class="calo-conclusao-razao">' + r + "</p>").join("") +
    '<p class="calo-conclusao-aviso">Essas são correlações especulativas com os dados que você já registrou no app, não um diagnóstico. Se a diferença persistir ou for muito grande, vale conversar com um profissional (endocrinologista ou nutricionista).</p>' +
  "</div>";
}
// Reescreve a conclusão acima a cada tecla digitada no campo de idade metabólica ou na TMB (oninput em
// #calo-idadeMetabolica/#calo-tmb, ver idadeMetabolicaCampoTemplate()/calorimetriaFormCamposTemplate())
// -- direto no elemento, sem chamar render(), pelo mesmo motivo de idadeMetabolicaCampoTemplate(): não
// arriscar apagar outros campos desse formulário que a pessoa já tenha digitado e ainda não foram
// capturados em state.caloFormValores (esses campos não têm onchange, só são lidos do DOM na hora de
// salvar).
function acaoAtualizarConclusaoIdadeMetabolica() {
  const container = document.getElementById("calo-conclusao-idade-metabolica-wrap");
  const inputIdade = document.getElementById("calo-idadeMetabolica");
  const inputTmb = document.getElementById("calo-tmb");
  if (!container || !inputIdade) return;
  container.innerHTML = conclusaoIdadeMetabolicaHtml(inputIdade.value, inputTmb ? inputTmb.value : "");
}

function acaoSalvarBioimpedancia() {
  const dataEl = document.getElementById("bio-data");
  const data = dataEl ? dataEl.value : "";
  if (!data) { toastError("Informe a data da medição."); return; }
  const valores = {};
  BIOIMPEDANCIA_CAMPOS.forEach((c) => {
    const el = document.getElementById("bio-" + c);
    valores[c] = el ? el.value.trim().replace(",", ".") : "";
  });
  if (!valores.altura || isNaN(Number(valores.altura))) { toastError("Informe a altura."); return; }
  if (anexoSelecionadoBio && !state.account) { toastError("Conecte sua conta do Google para anexar arquivos."); return; }

  const arquivoAnexo = anexoSelecionadoBio;
  const editandoId = state.bioimpedanciaEditandoId;

  // Modo edição (usuário clicou no ícone de editar de um registro já existente no histórico):
  // atualiza o registro em vez de criar um novo, preservando id e mantendo o anexo já existente a
  // menos que um novo arquivo tenha sido escolhido.
  if (editandoId != null) {
    const registro = state.bioimpedancia.find((r) => r.id === editandoId);
    if (!registro) { toastError("Registro não encontrado."); return; }
    registro.date = data;
    BIOIMPEDANCIA_CAMPOS.forEach((c) => { registro[c] = valores[c] ? Number(valores[c]) : null; });
    if (arquivoAnexo) registro.anexoUrl = ""; // preenchido de novo quando o anexo terminar de enviar
    persistBioimpedancia();
    state.showFormBioimpedancia = false;
    anexoSelecionadoBio = null;
    state.bioFormValores = {};
    state.bioimpedanciaEditandoId = null;
    toastSuccess(arquivoAnexo ? "Registro atualizado. Enviando o anexo em segundo plano..." : "Registro de bioimpedância atualizado.");
    const promessaEdicao = state.account ? enviarComFila("atualizarBioimpedanciaGoogle", [state.usuario.email, registro]) : Promise.resolve();
    render();
    if (arquivoAnexo) processarAnexoBioimpedanciaEmSegundoPlano(registro.id, arquivoAnexo, promessaEdicao);
    return;
  }

  // O registro é salvo AGORA MESMO (dado nunca depende do anexo terminar de enviar — evita perder a
  // medição inteira se o envio do arquivo for interrompido, ex.: celular bloqueia a tela no meio de
  // uma rede mais lenta). O anexo, quando selecionado, é enviado depois, em segundo plano, e só
  // "gruda" no registro já salvo quando terminar (ver processarAnexoBioimpedanciaEmSegundoPlano).
  const now = new Date();
  const novoRegistro = Object.assign(
    { id: Date.now(), date: data, time: now.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }), anexoUrl: "" },
    BIOIMPEDANCIA_CAMPOS.reduce((acc, c) => { acc[c] = valores[c] ? Number(valores[c]) : null; return acc; }, {})
  );
  state.bioimpedancia = state.bioimpedancia.concat([novoRegistro]);
  persistBioimpedancia();
  state.showFormBioimpedancia = false;
  anexoSelecionadoBio = null;
  state.bioFormValores = {};
  toastSuccess(arquivoAnexo ? "Registro salvo. Enviando o anexo em segundo plano..." : "Registro de bioimpedância salvo.");
  const promessaRegistroBase = state.account ? enviarComFila("salvarBioimpedanciaGoogle", [state.usuario.email, novoRegistro]) : Promise.resolve();
  render();
  if (arquivoAnexo) processarAnexoBioimpedanciaEmSegundoPlano(novoRegistro.id, arquivoAnexo, promessaRegistroBase);
}

// Envia o anexo depois que o registro já está salvo (ver comentário acima). Se der certo, atualiza o
// registro (local e no servidor) com o link do arquivo; se falhar, o registro continua salvo do
// mesmo jeito — só sem o anexo — e a pessoa é avisada para tentar anexar de novo mais tarde.
// IMPORTANTE: espera "promessaRegistroBase" (o envio do registro em si) terminar antes de mandar a
// atualização do anexo pro servidor — sem isso, os dois podiam chegar ao mesmo tempo (o primeiro
// criando a linha, o segundo lendo/reescrevendo a aba inteira pra colar o link) e um apagar campos que
// o outro tinha acabado de salvar.
async function processarAnexoBioimpedanciaEmSegundoPlano(idRegistro, file, promessaRegistroBase) {
  const [resultado] = await Promise.all([enviarAnexoExame(file), promessaRegistroBase]);
  if (!resultado.ok) {
    toastError((resultado.erro || "Não foi possível enviar o anexo") + " — o registro de bioimpedância foi salvo, só sem o exame anexado.");
    return;
  }
  const registro = state.bioimpedancia.find((r) => r.id === idRegistro);
  if (!registro) return; // registro foi removido enquanto o anexo ainda enviava
  registro.anexoUrl = resultado.url;
  persistBioimpedancia();
  toastSuccess("Exame anexado ao registro de bioimpedância.");
  if (state.account) enviarComFila("atualizarAnexoBioimpedanciaGoogle", [state.usuario.email, idRegistro, resultado.url]);
  render();
}
function acaoRemoverBioimpedancia(id) {
  state.bioimpedancia = state.bioimpedancia.filter((r) => r.id !== id);
  persistBioimpedancia();
  if (state.account) enviarComFila("removerBioimpedanciaGoogle", [state.usuario.email, id]);
  render();
}
function acaoSalvarCalorimetria() {
  const dataEl = document.getElementById("calo-data");
  const data = dataEl ? dataEl.value : "";
  if (!data) { toastError("Informe a data do exame."); return; }
  const valores = {};
  CALORIMETRIA_CAMPOS.forEach((c) => {
    const el = document.getElementById("calo-" + c);
    valores[c] = el ? el.value.trim().replace(",", ".") : "";
  });
  const fonteEl = document.querySelector('input[name="calo-tmb-fonte"]:checked');
  const tmbFonte = fonteEl ? fonteEl.value : "";
  if (!tmbFonte) { toastError("Selecione de onde veio o valor da TMB (exame de calorimetria indireta ou balança de bioimpedância)."); return; }
  if (!valores.tmb || isNaN(Number(valores.tmb))) { toastError("Informe a Taxa Metabólica Basal (TMB)."); return; }
  if (!valores.get || isNaN(Number(valores.get))) { toastError("Informe o Gasto Energético Total (GET)."); return; }
  if (anexoSelecionadoCalo && !state.account) { toastError("Conecte sua conta do Google para anexar arquivos."); return; }
  // TMB final: com desconto de 10% quando a fonte é balança de bioimpedância (ver
  // TMB_DESCONTO_BIOIMPEDANCIA/tmbComDesconto()); usada como digitada quando é exame de calorimetria.
  const tmbFinal = tmbComDesconto(Number(valores.tmb), tmbFonte);

  const arquivoAnexo = anexoSelecionadoCalo;
  const editandoId = state.calorimetriaEditandoId;

  // Modo edição — mesma lógica usada em acaoSalvarBioimpedancia (ver comentário lá).
  if (editandoId != null) {
    const registro = state.calorimetria.find((r) => r.id === editandoId);
    if (!registro) { toastError("Registro não encontrado."); return; }
    registro.date = data;
    registro.tmb = tmbFinal;
    registro.tmbFonte = tmbFonte;
    registro.get = Number(valores.get);
    registro.idadeMetabolica = valores.idadeMetabolica ? Number(valores.idadeMetabolica) : null;
    if (arquivoAnexo) registro.anexoUrl = "";
    persistCalorimetria();
    state.showFormBioimpedancia = false;
    anexoSelecionadoCalo = null;
    state.caloFormValores = {};
    state.calorimetriaEditandoId = null;
    toastSuccess(arquivoAnexo ? "Registro atualizado. Enviando o anexo em segundo plano..." : "Registro de calorimetria atualizado.");
    const promessaEdicao = state.account ? enviarComFila("atualizarCalorimetriaGoogle", [state.usuario.email, registro]) : Promise.resolve();
    render();
    if (arquivoAnexo) processarAnexoCalorimetriaEmSegundoPlano(registro.id, arquivoAnexo, promessaEdicao);
    return;
  }

  // Mesma lógica da bioimpedância (ver comentário lá): o registro é salvo já, o anexo vai depois em
  // segundo plano e só é "colado" ao registro quando (e se) terminar de enviar.
  const now = new Date();
  const novoRegistro = {
    id: Date.now(), date: data, time: now.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }),
    tmb: tmbFinal, tmbFonte: tmbFonte, get: Number(valores.get), idadeMetabolica: valores.idadeMetabolica ? Number(valores.idadeMetabolica) : null, anexoUrl: "",
  };
  state.calorimetria = state.calorimetria.concat([novoRegistro]);
  persistCalorimetria();
  state.showFormBioimpedancia = false;
  anexoSelecionadoCalo = null;
  state.caloFormValores = {};
  toastSuccess(arquivoAnexo ? "Registro salvo. Enviando o anexo em segundo plano..." : "Registro de calorimetria salvo.");
  const promessaRegistroBase = state.account ? enviarComFila("salvarCalorimetriaGoogle", [state.usuario.email, novoRegistro]) : Promise.resolve();
  render();
  if (arquivoAnexo) processarAnexoCalorimetriaEmSegundoPlano(novoRegistro.id, arquivoAnexo, promessaRegistroBase);
}

// Formata "AAAA-MM-DD" como "DD/MM/AAAA", pro formato pedido no histórico (diferente do dateLabel()
// por extenso usado no resto do app).
function dataCurta(dateStr) {
  const partes = String(dateStr || "").split("-");
  if (partes.length !== 3) return dateStr || "";
  return partes[2] + "/" + partes[1] + "/" + partes[0];
}

// Legenda com os valores do exame de um registro de Bioimpedância -- mostrada logo abaixo do link "Ver
// exame" (ou do aviso "Sem exame anexado") no histórico, a pedido do usuário: os números do próprio
// exame ficam visíveis ali mesmo, sem precisar abrir o anexo (quando ele existe) ou entrar no modo de
// edição só pra conferir o que foi registrado. Só entram os campos que a pessoa realmente preencheu
// (BIOIMPEDANCIA_CAMPOS permite deixar em branco) -- um registro sem nenhum valor preenchido (nunca
// deveria acontecer, já que altura é obrigatória, mas por segurança) não mostra legenda nenhuma.
function valoresBioimpedanciaLegenda(r) {
  const partes = [];
  if (r.altura != null) partes.push("Altura: " + formatNumber(r.altura, 1) + " cm");
  if (r.peso != null) partes.push("Peso: " + formatNumber(r.peso, 1) + " kg");
  if (r.gordura != null) partes.push("Gordura: " + formatNumber(r.gordura, 1) + "%");
  if (r.massaMagra != null) partes.push("Massa magra: " + formatNumber(r.massaMagra, 1) + " kg");
  if (r.massaMuscular != null) partes.push("Massa muscular: " + formatNumber(r.massaMuscular, 1) + " kg");
  if (r.aguaCorporal != null) partes.push("Água corporal: " + formatNumber(r.aguaCorporal, 1) + "%");
  if (r.gorduraVisceral != null) partes.push("Gordura visceral: nível " + formatNumber(r.gorduraVisceral, 1));
  return partes.length ? partes.join(" · ") : null;
}
// Mesma ideia acima, só que pros valores de um registro de Calorimetria (TMB/GET/idade metabólica --
// esse último migrou de Bioimpedância pra cá a pedido do usuário, ver CALORIMETRIA_CAMPOS).
function valoresCalorimetriaLegenda(r) {
  const partes = [];
  if (r.tmb != null) partes.push("TMB: " + formatNumber(r.tmb) + " kcal" + (r.tmbFonte === "bioimpedancia" ? " (balança, -10%)" : ""));
  if (r.get != null) partes.push("GET: " + formatNumber(r.get) + " kcal");
  if (r.idadeMetabolica != null) partes.push("Idade metabólica: " + formatNumber(r.idadeMetabolica, 1) + " anos");
  return partes.length ? partes.join(" · ") : null;
}
// valoresLegenda: função que devolve o texto da legenda de valores de UM registro (ou null/"" pra não
// mostrar nenhuma) -- diferente pra Bioimpedância e Calorimetria, já que cada uma tem seus próprios
// campos (ver valoresBioimpedanciaLegenda()/valoresCalorimetriaLegenda() acima), então quem chama essa
// função passa a função certa pro tipo de registro sendo listado.
function historicoListaTemplate(registros, tipoLabel, acaoRemover, acaoEditar, valoresLegenda) {
  if (!registros.length) return '<p class="imc-empty" style="margin-top:14px">Nenhum registro de ' + tipoLabel.toLowerCase() + " ainda.</p>";
  return '<div class="medidas-history-list" style="margin-top:14px">' + registros.map((r) => {
    const legenda = valoresLegenda ? valoresLegenda(r) : null;
    return '<div class="medida-history-item">' +
      '<div class="medida-history-row"><div class="medida-history-left"><span class="medida-history-tipo">' + tipoLabel + " registrada em " + dataCurta(r.date) + "</span>" +
      (r.anexoUrl
        ? '<a class="bioimpedancia-anexo-link" href="' + esc(r.anexoUrl) + '" target="_blank" rel="noopener">' + icon("file") + " Ver exame</a>"
        : '<span class="medida-history-meta">Sem exame anexado</span>') +
      "</div>" +
      '<div class="medida-history-right">' +
        '<button class="meal-row-delete" aria-label="Editar registro" onclick="' + acaoEditar + "(" + r.id + ')">' + icon("edit") + "</button>" +
        '<button class="meal-row-delete" aria-label="Remover registro" onclick="' + acaoRemover + "(" + r.id + ')">' + icon("trash") + "</button>" +
      "</div></div>" +
      // Legenda logo ABAIXO do link do exame (mesmo padrão visual da legenda de referência do histórico
      // de Medidas e Aferições, ver medidaHistoryRowTemplate()/legendaMedida()).
      (legenda ? '<p class="medida-history-legenda">' + icon("help") + " " + esc(legenda) + "</p>" : "") +
    "</div>";
  }).join("") + "</div>";
}

function historicoBioimpedanciaTemplate() {
  const aba = state.historicoAbaAtiva;
  const registrosBio = state.bioimpedancia.slice().sort((a, b) => b.id - a.id);
  const registrosCalo = state.calorimetria.slice().sort((a, b) => b.id - a.id);
  return '' +
    '<section class="medidas-section">' +
      '<h2 class="medidas-section-title">' + icon("history") + " Histórico de registros</h2>" +
      '<div class="bioimpedancia-form-tabs">' +
        '<button class="bioimpedancia-form-tab' + (aba === "bioimpedancia" ? " active" : "") + '" onclick="acaoTrocarAbaHistoricoBioimpedancia(\'bioimpedancia\')">Bioimpedância</button>' +
        '<button class="bioimpedancia-form-tab' + (aba === "calorimetria" ? " active" : "") + '" onclick="acaoTrocarAbaHistoricoBioimpedancia(\'calorimetria\')">Calorimetria</button>' +
      "</div>" +
      (aba === "calorimetria"
        ? historicoListaTemplate(registrosCalo, "Calorimetria", "acaoRemoverCalorimetria", "acaoEditarCalorimetria", valoresCalorimetriaLegenda)
        : historicoListaTemplate(registrosBio, "Bioimpedância", "acaoRemoverBioimpedancia", "acaoEditarBioimpedancia", valoresBioimpedanciaLegenda)) +
      '<div class="bioimpedancia-form-acoes"><button class="bioimpedancia-btn-secundario" onclick="acaoFecharHistoricoBioimpedancia()">Voltar</button></div>' +
    "</section>";
}

function bioimpedanciaSectionTemplate() {
  if (state.showFormBioimpedancia) return bioimpedanciaFormTemplate();
  if (state.showHistoricoBioimpedancia) return historicoBioimpedanciaTemplate();
  const ultimoBio = ultimaBioimpedancia();
  const ultimoCalo = ultimaCalorimetria();
  if (!ultimoBio && !ultimoCalo) {
    return '<section class="medidas-section">' +
      '<h2 class="medidas-section-title">' + icon("ruler") + " Bioimpedância e Calorimetria</h2>" +
      '<button class="bioimpedancia-add-btn" onclick="acaoAbrirFormBioimpedancia()">' + icon("plus") + "<span>Clique aqui para cadastrar as informações</span></button>" +
      "</section>";
  }
  const linha = (valor, label) => '<div class="bioimpedancia-resumo-linha"><span class="bioimpedancia-resumo-valor-sm">' + valor + '</span><span class="bioimpedancia-resumo-label">' + label + "</span></div>";
  // Cabeçalho de cada coluna (Bioimpedância/Calorimetria): legenda no canto superior esquerdo do
  // campo, com a data do último exame logo abaixo -- a pedido do usuário, substitui a legenda única
  // que ficava solta no rodapé do card (ver antigo .bioimpedancia-atualizado), já que agora cada
  // coluna mostra sua própria data.
  // tipoInfo: "bioimpedancia" | "calorimetria" -- identifica qual dos dois modais de informação do
  // exame o botão "i" ao lado do texto deve abrir (ver exameInfoBtnTemplate()/EXAME_INFO, pedido do
  // usuário: ícone de informação ao lado dos campos de Bioimpedância e Calorimetria).
  const cabecalhoColuna = (texto, ultimoRegistro, tipoInfo) => '<div class="bioimpedancia-resumo-coluna-head">' +
    '<span style="display:flex;align-items:center;gap:2px"><span class="bioimpedancia-resumo-coluna-legenda">' + texto + "</span>" + exameInfoBtnTemplate(tipoInfo, texto) + "</span>" +
    '<span class="bioimpedancia-resumo-coluna-data">' + (ultimoRegistro ? "Exame realizado em " + dateLabelComAno(ultimoRegistro.date) + "." : "Sem registro ainda.") + "</span>" +
  "</div>";
  return '<section class="medidas-section">' +
    '<div class="medidas-section-title-row"><h2 class="medidas-section-title">' + icon("ruler") + " Bioimpedância e Calorimetria</h2>" +
    '<div class="medidas-section-title-actions">' +
      '<button class="bioimpedancia-btn-secundario" onclick="acaoAbrirHistoricoBioimpedancia()">' + icon("history") + " Histórico de registros</button>" +
      '<button class="bioimpedancia-btn-secundario" onclick="acaoAbrirFormBioimpedancia()">' + icon("plus") + " Nova medição</button>" +
    "</div></div>" +
    '<div class="bioimpedancia-resumo">' +
      '<div class="bioimpedancia-resumo-item"><span class="bioimpedancia-resumo-valor">' + (ultimoBio && ultimoBio.altura ? formatNumber(ultimoBio.altura, 1) : "—") + '</span><span class="bioimpedancia-resumo-label">Altura (cm)</span></div>' +
      '<div class="bioimpedancia-resumo-item bioimpedancia-resumo-item-multi">' +
        cabecalhoColuna("Bioimpedância", ultimoBio, "bioimpedancia") +
        linha(ultimoBio && ultimoBio.peso ? formatNumber(ultimoBio.peso, 1) : "—", "Peso (kg)") +
        linha(ultimoBio && ultimoBio.massaMuscular ? formatNumber(ultimoBio.massaMuscular, 1) : "—", "Massa musc. (kg)") +
        linha(ultimoBio && ultimoBio.gordura ? formatNumber(ultimoBio.gordura, 1) : "—", "Gordura (%)") +
      "</div>" +
      '<div class="bioimpedancia-resumo-item bioimpedancia-resumo-item-multi">' +
        cabecalhoColuna("Calorimetria", ultimoCalo, "calorimetria") +
        linha(ultimoCalo && ultimoCalo.tmb ? formatNumber(ultimoCalo.tmb) : "—", "TMB (kcal)") +
        linha(ultimoCalo && ultimoCalo.get ? formatNumber(ultimoCalo.get) : "—", "GET (kcal)") +
        linha(ultimoCalo && ultimoCalo.idadeMetabolica != null ? formatNumber(ultimoCalo.idadeMetabolica, 1) : "—", "Idade metab. (anos)") +
      "</div>" +
    "</div>" +
    "</section>";
}

// Cada vez que o histórico é aberto, começa com todos os dias fechados -- mesmo padrão de
// acaoAlternarHistorico()/acaoAlternarHistoricoTreinos().
function acaoAbrirHistoricoMedidas() { state.showHistoricoMedidas = true; state.historyDiaExpandidoMedidas = null; render(); }
function acaoFecharHistoricoMedidas() { state.showHistoricoMedidas = false; render(); }
// Card de um dia no histórico de Medidas e Aferições -- mesma lógica de dia expansível (accordion) do
// histórico de refeições (historyDayCardTemplate()) e de treinos (treinoHistoryDayCardTemplate()).
function medidasHistoryDayCardTemplate(date) {
  // Só os registros do dia que passam no filtro atual (ver medidaPassaFiltro()) -- com o filtro no
  // padrão (todos os tipos, sem período) isso equivale a mostrar todos os registros do dia, igual ao
  // comportamento de antes dessa opção existir.
  const dayMedidas = state.medidas.filter((m) => m.date === date && medidaPassaFiltro(m)).sort((a, b) => b.id - a.id);
  const expandido = state.historyDiaExpandidoMedidas === date;
  return '' +
    '<div class="history-day' + (expandido ? " history-day-expandido" : "") + '">' +
      '<div class="history-day-head history-day-head-btn" onclick="acaoAlternarDiaHistoricoMedidas(\'' + date + '\')">' +
        '<span class="date">' + dateLabel(date) + "</span>" +
        '<span class="history-day-head-direita"><span class="total">' + dayMedidas.length + " registro" + (dayMedidas.length > 1 ? "s" : "") + "</span>" +
        '<button class="meal-row-delete" aria-label="Excluir registros de ' + esc(dateLabel(date)) + '" onclick="event.stopPropagation(); acaoRemoverDiaHistoricoMedidas(\'' + date + '\')">' + icon("trash") + "</button>" +
        icon("chevron", "history-day-chevron") + "</span>" +
      "</div>" +
      medidasResumoHtml(dayMedidas) +
      (expandido
        ? '<div class="medidas-history-list">' + dayMedidas.map(medidaHistoryRowTemplate).join("") + "</div>"
        : ""
      ) +
    "</div>";
}
// Texto da classificação de um registro, já incluindo o "IMC X,X · " na frente quando for peso (mesmo
// prefixo usado no histórico detalhado) -- compartilhado entre medidaHistoryRowTemplate() e
// medidasResumoHtml() pra não duplicar essa regra em dois lugares.
function statusTextoMedida(r, classificacao) {
  return (r.tipo === "peso" ? "IMC " + formatNumber(imcParaExibicao(r), 1) + " · " : "") + esc(classificacao.label);
}
// Resumo das aferições do dia (tipo, resultado e, quando aplicável, a classificação) -- mostrado
// SEMPRE, sem precisar expandir o dia, mesmo espírito do resumo de modalidade+kcal do histórico de
// treinos (ver treinoResumoModalidadesHtml()). Reaproveita as mesmas classes CSS (.history-day-
// modalidades/.history-day-modalidade-item) pra manter a mesma linguagem visual entre os históricos.
function medidasResumoHtml(dayMedidas) {
  return '<div class="history-day-modalidades">' + dayMedidas.map((r) => {
    const meta = medidaTipos[r.tipo] || { label: r.tipo, unidade: "" };
    const classificacao = classificarMedida(r);
    return '<span class="history-day-modalidade-item">' + emojiMedida(r.tipo) + " " + esc(meta.label) + ": " + esc(String(r.valor)) + " " + esc(meta.unidade) +
      (classificacao ? ' <span class="medida-resumo-status" style="color:' + classificacao.cor + '">· ' + statusTextoMedida(r, classificacao) + "</span>" : "") + "</span>";
  }).join("") + "</div>";
}
// Uma linha do histórico de Medidas e Aferições: tipo, horário, observação (e, só pra glicemia, se foi
// em jejum), valor e -- quando aplicável -- uma classificação clínica logo abaixo do valor
// (classificarMedida()) e uma legenda compacta na ÚLTIMA linha do próprio registro com os parâmetros de
// referência e a fonte (legendaMedida()), a pedido do usuário. Pescoço fica sem classificação/legenda.
function medidaHistoryRowTemplate(r) {
  const meta = medidaTipos[r.tipo] || { label: r.tipo, unidade: "" };
  const classificacao = classificarMedida(r);
  const legenda = legendaMedida(r);
  return '' +
    '<div class="medida-history-item">' +
      '<div class="medida-history-row"><div class="medida-history-left"><span class="medida-history-tipo">' + emojiMedida(r.tipo) + " " + esc(meta.label) + "</span>" +
      '<span class="medida-history-meta">' + icon("clock") + " " + esc(r.time) + "</span>" +
      (r.tipo === "glicemia" ? '<span class="medida-history-meta">' + (r.jejum ? "Em jejum" : "Fora do jejum") + "</span>" : "") +
      (r.nota ? '<span class="medida-history-nota">' + icon("help") + " " + esc(r.nota) + "</span>" : "") +
      "</div>" +
      '<div class="medida-history-right"><div class="medida-history-valor-col"><span class="medida-history-valor">' + esc(String(r.valor)) + " " + esc(meta.unidade) + "</span>" +
      (classificacao ? '<span class="medida-history-status" style="color:' + classificacao.cor + '">' + statusTextoMedida(r, classificacao) + "</span>" : "") + "</div>" +
      '<button class="meal-row-delete" aria-label="Remover registro" onclick="acaoRemoverMedida(' + r.id + ')">' + icon("trash") + "</button></div></div>" +
      (legenda ? '<p class="medida-history-legenda">' + icon("help") + " " + esc(legenda) + "</p>" : "") +
    "</div>";
}
// Exclui TODOS os registros de medida daquele dia -- o "registro do dia" no histórico é o agrupamento
// por data, não um registro único -- mesma lógica de acaoRemoverDiaHistorico()/
// acaoRemoverDiaHistoricoTreinos(): remove cada um localmente e sincroniza cada remoção com o backend.
function acaoRemoverDiaHistoricoMedidas(date) {
  const idsDoDia = state.medidas.filter((m) => m.date === date).map((m) => m.id);
  if (!idsDoDia.length) return;
  state.medidas = state.medidas.filter((m) => m.date !== date);
  persistMedidas();
  if (state.account) idsDoDia.forEach((id) => enviarComFila("removerMedidaGoogle", [state.usuario.email, id]));
  if (state.historyDiaExpandidoMedidas === date) state.historyDiaExpandidoMedidas = null;
  render();
}
// Abre/fecha um dia do histórico de medidas (accordion: só um dia expandido de cada vez).
function acaoAlternarDiaHistoricoMedidas(date) {
  state.historyDiaExpandidoMedidas = state.historyDiaExpandidoMedidas === date ? null : date;
  render();
}

/* ===================== filtro do histórico de medidas e aferições ===================== */
// Painel do filtro recolhido/expandido pelo botão "Filtrar registros" -- fica fechado por padrão pra
// não ocupar espaço em quem não precisa filtrar nada.
function acaoAlternarFiltroMedidas() { state.medidasFiltroAberto = !state.medidasFiltroAberto; render(); }
// Muda o conjunto de dias visíveis, então fecha qualquer dia expandido (mesmo espírito de
// acaoAbrirHistoricoMedidas() -- evita ficar com um dia "preso" aberto que talvez nem apareça mais
// depois do filtro mudar).
function acaoAlternarTipoFiltroMedidas(tipo) {
  state.medidasFiltroTipos = state.medidasFiltroTipos.includes(tipo)
    ? state.medidasFiltroTipos.filter((t) => t !== tipo)
    : state.medidasFiltroTipos.concat([tipo]);
  state.historyDiaExpandidoMedidas = null;
  render();
}
function acaoSelecionarTodosTiposFiltroMedidas() {
  state.medidasFiltroTipos = Object.keys(medidaTipos);
  state.historyDiaExpandidoMedidas = null;
  render();
}
function acaoLimparTiposFiltroMedidas() {
  state.medidasFiltroTipos = [];
  state.historyDiaExpandidoMedidas = null;
  render();
}
function acaoFiltrarMedidasPorData(campo, valor) {
  if (campo === "de") state.medidasFiltroDe = valor; else state.medidasFiltroAte = valor;
  state.historyDiaExpandidoMedidas = null;
  render();
}
// Volta o filtro pro padrão (todos os tipos, sem período) -- equivale a "sem filtro".
function acaoLimparFiltrosMedidas() {
  state.medidasFiltroTipos = Object.keys(medidaTipos);
  state.medidasFiltroDe = "";
  state.medidasFiltroAte = "";
  state.historyDiaExpandidoMedidas = null;
  render();
}
// Botão (chip) de um tipo de aferição dentro do painel de filtro -- alterna marcado/desmarcado ao
// clicar, mesma linguagem visual das abas de modo já usadas em outras telas (nutricao-modo-tab etc.).
function medidaFiltroTipoChipTemplate(key) {
  const meta = medidaTipos[key];
  const ativo = state.medidasFiltroTipos.includes(key);
  return '<button type="button" class="medida-filtro-tipo-chip' + (ativo ? " active" : "") + '" aria-pressed="' + ativo + '" onclick="acaoAlternarTipoFiltroMedidas(\'' + key + '\')">' + emojiMedida(key) + " " + esc(meta.label) + "</button>";
}
// Painel do filtro: botão de abrir/fechar (com indicador de "filtro ativo") +, quando aberto, os chips
// de tipo (multi-seleção) e os dois campos de data (De/Até, cada um com o seletor de calendário nativo
// do navegador -- mesmo padrão já usado em treino-data/bio-data, sem precisar de um componente novo).
// Período em aberto de um dos lados = sem limite daquele lado, então dá pra filtrar só "a partir de" ou
// só "até", sem precisar preencher os dois.
function medidasFiltroTemplate() {
  const todosSelecionados = state.medidasFiltroTipos.length === Object.keys(medidaTipos).length;
  const ativo = medidasFiltroAtivo();
  return '' +
    '<div class="medida-filtro">' +
      '<button type="button" class="medida-filtro-toggle" onclick="acaoAlternarFiltroMedidas()">' +
        icon("filter") + " Filtrar registros" +
        (ativo ? '<span class="medida-filtro-badge" aria-label="Filtro ativo"></span>' : "") +
        icon("chevron", "medida-filtro-chevron" + (state.medidasFiltroAberto ? " aberto" : "")) +
      "</button>" +
      (state.medidasFiltroAberto ?
        '<div class="medida-filtro-painel">' +
          '<div><label class="field-label">Tipos de aferição</label>' +
            '<div class="medida-filtro-tipos">' + Object.keys(medidaTipos).map(medidaFiltroTipoChipTemplate).join("") + "</div>" +
            '<button type="button" class="medida-filtro-link" onclick="' + (todosSelecionados ? "acaoLimparTiposFiltroMedidas()" : "acaoSelecionarTodosTiposFiltroMedidas()") + '">' + (todosSelecionados ? "Limpar seleção" : "Selecionar todos") + "</button>" +
          "</div>" +
          '<div class="medida-filtro-periodo">' +
            '<div><label class="field-label">De</label><input type="date" class="field-input" max="' + esc(today()) + '" value="' + esc(state.medidasFiltroDe) + '" onchange="acaoFiltrarMedidasPorData(\'de\', this.value)"/></div>' +
            '<div><label class="field-label">Até</label><input type="date" class="field-input" max="' + esc(today()) + '" value="' + esc(state.medidasFiltroAte) + '" onchange="acaoFiltrarMedidasPorData(\'ate\', this.value)"/></div>' +
          "</div>" +
          (ativo ? '<button type="button" class="medida-filtro-limpar" onclick="acaoLimparFiltrosMedidas()">' + icon("x") + " Limpar filtros</button>" : "") +
        "</div>"
        : ""
      ) +
    "</div>";
}

// Lista "Registros de hoje" do card de Medidas e Aferições, SEMPRE visível junto com o formulário --
// mesmo espírito de mealListTemplate()/treinoListTemplate() (refeições e treinos já mostram os
// registros do dia sem precisar abrir o Histórico; medidas ficava pra trás nisso). Reaproveita
// medidaHistoryRowTemplate() pra cada linha: é a MESMA informação (tipo, horário, jejum/nota,
// classificação e legenda) já mostrada dentro de um dia expandido no Histórico -- só muda o
// agrupamento (aqui é só hoje, direto no card, sem precisar abrir o Histórico nem expandir um dia).
function medidaListTemplate() {
  const medidas = todayMedidas().slice().sort((a, b) => b.id - a.id);
  if (!medidas.length) {
    return '<div class="meal-empty"><div class="meal-empty-icon">' + icon("ruler") + "</div><p>Nenhuma medida registrada hoje</p><p>Escolha o tipo de medição abaixo e registre sua primeira aferição do dia.</p></div>";
  }
  return '<div class="medida-history-list">' + medidas.map(medidaHistoryRowTemplate).join("") + "</div>";
}

function medidasFormTemplate() {
  const tipo = state.medidaTipo;
  const meta = tipo ? medidaTipos[tipo] : null;
  const hoje = todayMedidas();
  return '' +
    '<section class="medidas-section">' +
      '<div class="medidas-section-title-row"><h2 class="medidas-section-title">' + icon("plus") + " Medidas e Aferições</h2>" +
      '<div class="medidas-section-title-actions">' +
        '<button class="bioimpedancia-btn-secundario" onclick="acaoAbrirHistoricoMedidas()">' + icon("history") + " Histórico de registros</button>" +
      "</div></div>" +
      '<div class="medida-form">' +
        '<div><label class="field-label">Tipo de medição</label>' +
        '<select class="field-input" onchange="acaoSelecionarTipoMedida(this.value)">' +
          '<option value="">Selecione...</option>' +
          Object.keys(medidaTipos).map((key) => '<option value="' + key + '"' + (tipo === key ? " selected" : "") + ">" + medidaTipos[key].label + "</option>").join("") +
        "</select></div>" +
        (meta ?
          '<div class="medida-input-row"><div><label class="field-label">' + meta.label + " (" + meta.unidade + ")</label>" +
          '<input id="medida-valor" class="field-input" placeholder="' + meta.placeholder + '" onkeydown="if(event.key===\'Enter\') acaoSalvarMedida();"/>' +
          '<p class="imc-empty" style="margin-top:6px">' + meta.exemplo + "</p></div>" +
          (MEDIDA_TIPOS_COM_JEJUM.includes(tipo) ?
            '<div><label class="field-label">Foi medida em jejum?</label>' +
            '<select id="medida-jejum" class="field-input" onchange="acaoSelecionarJejum(this.value)">' +
              '<option value="">Selecione...</option>' +
              '<option value="sim"' + (state.medidaJejum === "sim" ? " selected" : "") + ">Sim, em jejum</option>" +
              '<option value="nao"' + (state.medidaJejum === "nao" ? " selected" : "") + ">Não, fora do jejum</option>" +
            "</select>" +
            '<p class="imc-empty" style="margin-top:6px">' + (tipo === "glicemia" ? "Usamos essa informação pra avaliar o resultado com o parâmetro de referência correto." : "Usamos essa informação para comparar corretamente seu peso em jejum entre os dias no Diário de Kcal.") + "</p></div>"

// Linha de uma refeição dentro de um registro do Diário de Kcal -- mostra o total DA REFEIÇÃO (já
// calculado na hora do registro, não alimento por alimento) com os alimentos daquela refeição entre
// parênteses, ao lado do nome (ex.: "08:00 · Café da manhã (Pão francês, Ovo frito)").
function diarioKcalRefeicaoTemplate(ref) {
  const alimentos = ref.alimentos && ref.alimentos.length ? " (" + ref.alimentos.map(esc).join(", ") + ")" : "";
  return '<div class="diario-kcal-refeicao">' +
    '<span class="diario-kcal-refeicao-nome">' + icon("clock") + " " + esc(ref.time) + " · " + esc(ref.name) + alimentos + "</span>" +
    '<span class="diario-kcal-refeicao-valores">' + formatNumber(ref.calories) + " kcal · P " + formatNumber(ref.protein, 1) + " · C " + formatNumber(ref.carbs, 1) + " · G " + formatNumber(ref.fat, 1) + "</span>" +
  "</div>";
}
// Um dia encerrado no Diário de Kcal: total de calorias/macro/micronutrientes daquele dia (congelado no
// momento do "Encerrar dia", ver acaoEncerrarDia()) + a lista das refeições daquele dia + o ícone de
// excluir esse registro (ver acaoRemoverDiarioKcal()).
// Texto "Consumido X kcal (Y%) da meta de Z kcal/dia (objetivo)" mostrado logo abaixo do total de kcal
// de cada registro do Diário -- ver diarioKcalRegistroTemplate(). Usa a meta/objetivo CONGELADOS no
// registro (metaCalorias/objetivo, salvos por acaoEncerrarDia() no momento do "Encerrar dia"): um
// registro já salvo não muda se a meta do dia for alterada depois. Só cai pra meta/objetivo ATUAIS
// (state.goals) em registros de ANTES dessa coluna existir, que vêm com metaCalorias null -- não tem
// como saber qual era a meta vigente naquela época, então a atual é a alternativa mais razoável.
function diarioKcalMetaTexto(r) {
  const meta = r.metaCalorias != null ? r.metaCalorias : state.goals.calories;
  const objetivoChave = r.metaCalorias != null ? r.objetivo : state.goals.objetivo;
  const percentual = meta > 0 ? (r.calories / meta) * 100 : 0;
  const objetivo = objetivoChave && OBJETIVOS_META[objetivoChave] ? OBJETIVOS_META[objetivoChave].label : "";
  return "Consumido " + formatNumber(r.calories) + " kcal (" + formatNumber(percentual, 2) + "%) da meta de " + formatNumber(meta) + " kcal/dia" + (objetivo ? " (" + objetivo + ")" : "");
}
// Classe de cor comparando o consumido com a meta -- combinado com o usuário: abaixo da meta em
// vermelho, igual mantém a cor neutra (sem classe extra), acima em verde. Sem meta cadastrada (0 ou
// ausente), não dá pra comparar -- fica neutro também.
function diarioKcalCompararMetaClasse(consumido, meta) {
  if (!(meta > 0)) return "";
  if (consumido < meta) return " diario-kcal-nutriente-abaixo";
  if (consumido > meta) return " diario-kcal-nutriente-acima";
  return "";
}
// Texto "Label consumidoUN/metaUN (percentual%)" de um nutriente, ex.: "Proteína 55,0g/149,9g (36,7%)".
function diarioKcalNutrienteTexto(label, consumido, meta, unidade) {
  const percentual = meta > 0 ? (consumido / meta) * 100 : 0;
  return label + " " + formatNumber(consumido, 1) + unidade + "/" + formatNumber(meta, 1) + unidade + " (" + formatNumber(percentual, 1) + "%)";
}
// Mesma ideia de diarioKcalNutrienteTexto(), só que pra vitamina D -- que também é mostrada em mcg/UI
// (ver formatVitaminaDComUI()) -- em vez do "consumidoUN/metaUN" genérico, usa parênteses pra separar
// claramente o valor em UI do "/" que já compara consumido com a meta: ex. "Vitamina D 5,0 mcg (200
// UI)/15,0 mcg (600 UI) (33,3%)".
function diarioKcalNutrienteTextoVitaminaD(label, consumido, meta) {
  const percentual = meta > 0 ? (consumido / meta) * 100 : 0;
  const comUI = (v) => formatNumber(v, 1) + " mcg (" + formatNumber(v * VITAMINA_D_MCG_PARA_UI, 0) + " UI)";
  return label + " " + comUI(consumido) + "/" + comUI(meta) + " (" + formatNumber(percentual, 1) + "%)";
}
// Macronutrientes (proteína/carboidrato/gordura/fibra) comparados com a meta CONGELADA no registro (ver
// acaoEncerrarDia()) -- mesma lógica de fallback de diarioKcalMetaTexto() pra registros antigos sem meta
// salva.
function diarioKcalMacrosTemplate(r) {
  const temMetaPropria = r.metaCalorias != null;
  const metas = {
    protein: temMetaPropria && r.metaProtein != null ? r.metaProtein : state.goals.protein,
    carbs: temMetaPropria && r.metaCarbs != null ? r.metaCarbs : state.goals.carbs,
    fat: temMetaPropria && r.metaFat != null ? r.metaFat : state.goals.fat,
    fiber: temMetaPropria && r.metaFiber != null ? r.metaFiber : state.goals.fiber,
  };
  return ["protein", "carbs", "fat", "fiber"].map((k) => {
    const meta = metas[k];
    const classe = diarioKcalCompararMetaClasse(r[k] || 0, meta);
    return '<span class="diario-kcal-nutriente' + classe + '">' + diarioKcalNutrienteTexto(nutrientMeta[k].label, r[k] || 0, meta, nutrientMeta[k].unit) + "</span>";
  }).join(" · ");
}

// Seção "Kcal gastos no dia:" -- gasto em repouso (TMB, da Calorimetria mais recente já registrada em

// antes, só mudou de lugar pra cá). O GET é um valor MEDIDO/fisiológico, não uma meta pessoal editável
// (igual TMB e os micronutrientes) -- por isso não é congelado no registro: busca sempre a calorimetria
// mais atual, mesmo em registros antigos do Diário. Quando há GET disponível, soma-se ao gasto em
// atividades pra estimar o gasto total do dia e o saldo (consumido − gasto total): superávit (sobrou
// energia) ou déficit (gastou mais do que consumiu), informações complementares pertinentes pro
// acompanhamento nutricional.
// NOTA -- GET x TMB: chegamos a trocar essa base pra TMB por um tempo, com receio de que o GET do exame
// (TMB x fator de "estilo de vida") já embutisse os treinos e o app contasse o exercício duas vezes.
// Voltamos pro GET a pedido do usuário: com a calculadora de perfil de atividade adicionada ao campo de

// GET (repouso) + atividades/treinos do dia (r.caloriasQueimadas) + gasto total = GET + atividades.
// Função compartilhada entre diarioKcalGastosTemplate() e diarioKcalAnaliseObjetivoTemplate() pra não

function diarioKcalGastoTotalInfo(r) {
  let get = r.get;
  if (get == null) {
    const ultimoCalo = ultimaCalorimetria();
    get = ultimoCalo && ultimoCalo.get ? Number(ultimoCalo.get) : null;

// Se o saldo de kcal do dia "bateu" com o que o objetivo escolhido pede: emagrecimento/definição buscam
// déficit calórico (meta atingida quando saldo <= 0); ganho de peso/massa muscular busca superávit (meta
// atingida quando saldo >= 0); manutenção/performance/saúde geral buscam equilíbrio (meta atingida
// quando o saldo fica dentro de uma pequena faixa de tolerância em torno de zero). Sem objetivo definido
// não dá pra avaliar (retorna null). Mesmo padrão de "objetivo congelado no registro" usado em
// diarioKcalMetaTexto(): usa r.objetivo quando o registro já tem meta própria salva, senão o objetivo
// atual (só acontece em registros de antes dessa coluna existir).
function diarioKcalMetaAtingida(saldo, objetivoChave) {
  if (!objetivoChave || !OBJETIVOS_META[objetivoChave]) return null;
  const TOLERANCIA_EQUILIBRIO = 100; // kcal
  if (objetivoChave === "emagrecimento" || objetivoChave === "definicao") return saldo <= 0;
  if (objetivoChave === "ganho_massa") return saldo >= 0;
  return Math.abs(saldo) <= TOLERANCIA_EQUILIBRIO;
}
// Equivalência clássica entre déficit/superávit calórico e variação de gordura corporal: ~7.700 kcal
// por kg (regra de Wishnofsky, 1958 -- gordura pura tem ~9 kcal/g, mas o tecido adiposo tem água e
// outras estruturas junto, rendendo ~7,7 kcal/g na prática). É uma estimativa de referência, não uma
// previsão exata: no longo prazo ela superestima a perda/ganho real, porque o corpo se adapta (gasto
// energético cai conforme o peso muda e em déficit prolongado) e parte do peso perdido/ganho pode ser
// massa magra, não só gordura -- por isso o texto sempre marca o valor em kg como equivalência do saldo
// do dia, não como uma promessa de quanto a balança vai marcar.
const KCAL_POR_KG_GORDURA = 7700;
// Soma 1 dia a uma data "AAAA-MM-DD" (string local, sem fuso) e devolve no mesmo formato -- usada pra
// comparar o peso em jejum de um dia com o do dia seguinte (ver pesoJejumDoDia()). Monta a data com
// componentes locais (Date(ano, mes-1, dia) + setDate) em vez de mexer na string diretamente, pra lidar
// corretamente com viradas de mês/ano.
function proximoDia(dateStr) {
  const partes = String(dateStr || "").split("-").map(Number);
  if (partes.length !== 3 || partes.some((n) => isNaN(n))) return null;
  const d = new Date(partes[0], partes[1] - 1, partes[2]);
  d.setDate(d.getDate() + 1);
  const ano = d.getFullYear();
  const mes = String(d.getMonth() + 1).padStart(2, "0");
  const dia = String(d.getDate()).padStart(2, "0");
  return ano + "-" + mes + "-" + dia;
}
// Peso em jejum registrado num dia específico (só considera medidas de peso com jejum=true -- ver
// MEDIDA_TIPOS_COM_JEJUM/acaoSalvarMedida()) -- usado pra comparar o peso em jejum de um dia com o do dia
// seguinte na Análise do objetivo do Diário de Kcal (diarioKcalAnaliseObjetivoTemplate()). Quando há mais
// de um registro de peso em jejum no mesmo dia, usa o mais antigo (o primeiro da manhã, cenário mais
// comum de pesagem em jejum), não o mais recente.
function pesoJejumDoDia(date) {
  const registros = state.medidas.filter((m) => m.tipo === "peso" && m.date === date && m.jejum === true).sort((a, b) => a.id - b.id);
  return registros.length ? Number(registros[0].valor) : null;
}
// Seção "Análise do objetivo:" -- resume o dia em relação ao objetivo escolhido: kcal consumidos, kcal
// gastos (mesmo gasto total de diarioKcalGastosTemplate()) e o saldo, dizendo se a meta do dia (déficit,
// superávit ou equilíbrio, dependendo do objetivo -- ver diarioKcalMetaAtingida()) foi atingida ou não.
// Texto combinado com o usuário: "meta (Objetivo) - atingida ✅" em negrito azul, ou "meta (Objetivo) -
// não atingida ❌" em negrito vermelho -- só o trecho do status fica destacado, o resto da linha continua
// na cor neutra. O saldo em kcal também vem seguido de "/ X kg" -- a equivalência em gordura corporal
// (ver KCAL_POR_KG_GORDURA), pra dar uma noção mais concreta do que aquele número de kcal representa.
// Imediatamente abaixo do saldo, quando há peso em jejum registrado (ver pesoJejumDoDia()) pro dia do
// registro e/ou pro dia seguinte, mostra os dois pesos e a diferença entre eles -- pra comparar a
// variação real da balança com a equivalência estimada do saldo calórico do dia (ver a nota logo
// abaixo). Só aparece quando pelo menos um dos dois pesos foi registrado, pra não poluir o card com
// "não registrado" em dias sem pesagem.
// Ícone ao final de "Kcal gastos no dia": mostra de relance se aquele gasto total já inclui algum
// treino/atividade informado pelo usuário naquele dia (r.caloriasQueimadas > 0, ver
// diarioKcalGastoTotalInfo()) ou se é só o gasto em repouso (GET), sem nenhum treino registrado -- a
// pedido do usuário, pra não precisar expandir o card e conferir a linha "Atividades/treinos/esportes"
// (diarioKcalGastosTemplate()) só pra saber se aquele dia teve treino informado.
function treinoIconeGastos(info) {
  return info.atividades > 0 ? " 🏋🏻‍♂️✅️" : " 🏋🏻‍♂️❌️";
}
// Ícone ao final de "Diferença entre os pesos em jejum": mostra se a variação real da balança bateu com
// a direção que o objetivo escolhido busca -- perda de peso pra quem quer emagrecer/definir, ganho pra
// quem quer ganhar peso/massa muscular, e peso estável pra quem busca manutenção/performance/saúde geral
// (mesmo agrupamento de objetivos já usado em diarioKcalMetaAtingida() pro saldo calórico, aqui aplicado
// à balança). ✅ quando a variação bate com o que o objetivo busca, ⚠️ quando o peso ficou exatamente
// igual (sinal neutro -- nem confirma nem contraria o objetivo) OU quando o objetivo é de equilíbrio
// (nesse caso qualquer variação, pra qualquer lado, é só ruído normal da balança, não um "erro" -- por
// isso nunca ❌ aqui), e ❌ quando o peso foi na direção OPOSTA à que o objetivo busca.
function diferencaPesoIcone(diferencaPeso, objetivoChave) {
  if (!objetivoChave || !OBJETIVOS_META[objetivoChave]) return "";
  if (diferencaPeso === 0) return " ⚠️";
  if (objetivoChave === "emagrecimento" || objetivoChave === "definicao") return diferencaPeso < 0 ? " ✅️" : " ❌️";
  if (objetivoChave === "ganho_massa") return diferencaPeso > 0 ? " ✅️" : " ❌️";
  return " ⚠️"; // manutenção/performance/saúde geral -- objetivo de equilíbrio, sem "direção errada"
}
function diarioKcalAnaliseObjetivoTemplate(r) {

  const kgEquiv = (kcal) => formatNumber(Math.abs(kcal) / KCAL_POR_KG_GORDURA, 2) + " kg";
