/* ===================== anexo de exame (bioimpedância/calorimetria) ===================== */
// Fotos são comprimidas (igual à foto de perfil, só que num tamanho maior, pra manter o exame
// legível) antes de virar base64; PDF é enviado como veio, sem como comprimir.
async function prepararConteudoAnexo(file) {
  if (file.type && file.type.startsWith("image/")) {
    const dataUrl = await compressImageDataUrl(file, 1600, 0.75);
    return { base64: dataUrl.split(",")[1], tipoMime: "image/jpeg", nomeArquivo: (file.name || "exame").replace(/\.[^.]+$/, "") + ".jpg" };
  }
  const dataUrl = await new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
  return { base64: dataUrl.split(",")[1], tipoMime: file.type || "application/octet-stream", nomeArquivo: file.name || "exame" };
}

// O anexo pode ter alguns MB em base64 — grande demais pra caber na URL do chamarApi (que usa GET).
// Por isso este envio usa POST de verdade via fetch, mas com o corpo mandado como texto puro (sem
// definir Content-Type: application/json) — isso faz o navegador tratar a chamada como uma
// "requisição simples" de CORS, que não dispara o pedido de verificação prévia (preflight OPTIONS)
// que esse backend (Apps Script) não consegue responder. É esse preflight que bloqueava POST aqui,
// não o POST em si — então a resposta pode ser lida normalmente, do mesmo jeito que no chamarApi.
async function enviarAnexoViaPost(payload) {
  const response = await fetch(API_URL, { method: "POST", body: JSON.stringify(payload) });
  if (!response.ok) throw new Error("Erro de rede (" + response.status + ")");
  return response.json();
}

async function enviarAnexoExame(file) {
  try {
    if (file.size > 15 * 1024 * 1024) return { ok: false, erro: "Arquivo muito grande (máximo 15 MB)." };
    const { base64, tipoMime, nomeArquivo } = await prepararConteudoAnexo(file);
    return await enviarAnexoViaPost({ acao: "enviarAnexoExame", email: state.usuario.email, nomeArquivo, tipoMime, conteudoBase64: base64 });
  } catch (err) {
    return { ok: false, erro: "Não foi possível enviar o anexo. Verifique sua conexão e tente novamente." };
  }
}

// ===== fila de pendências =====
// Toda alteração (salvar/apagar refeição ou medida, editar metas/altura) tenta subir pro servidor na
// hora. Se essa chamada falhar (sem internet, backend fora do ar por um instante, etc.), em vez de
// simplesmente perder essa alteração (como acontecia antes), ela fica guardada aqui no aparelho e a
// gente tenta reenviar sozinho na próxima vez que o app sincronizar — sem precisar que a pessoa refaça
// nada. Isso é o que faz o app se recuperar de qualquer falha passageira, em vez de deixar um dado
// "preso" só num aparelho pra sempre.
function lerFila() { return readStorage(CHAVE_FILA, []); }
function gravarFila(fila) { writeStorage(CHAVE_FILA, fila); }

// Envios que já começaram mas ainda não terminaram (nem com sucesso, nem com falha) — só existe na
// memória (não precisa sobreviver a um recarregamento de página). Numa rede lenta (celular), um envio
// pode legitimamente demorar vários segundos (o backend às vezes precisa de mais de uma chamada ao
// Google por trás); se uma sincronização automática rodar nesse meio-tempo, ela buscaria a lista do
// servidor SEM esse registro ainda (porque ele nem terminou de chegar lá) e o apagaria da tela como se
// tivesse sido excluído em outro aparelho. Guardar aqui o que está "a caminho" evita isso — ver
// mesclarComPendentes logo abaixo, que consulta esta lista além da fila de reenvio.
const enviosEmAndamento = [];

// Envia uma ação ao backend; se falhar, guarda na fila para tentar de novo depois. Quem chama já
// decide quando faz sentido chamar isso (conta conectada ao Google).
// Retorna a promise (sempre resolvida, nunca rejeitada — falha vira fila, não uma exceção) pra quem
// precisar ESPERAR esse envio terminar antes de fazer outra coisa que mexe no mesmo registro no
// servidor (ver processarAnexoBioimpedanciaEmSegundoPlano/processarAnexoCalorimetriaEmSegundoPlano) —
// sem isso, o envio do registro (que faz um "append" na planilha) e a atualização do link do anexo
// (que lê, apaga e reescreve a aba inteira) podiam rodar ao mesmo tempo e um pisar no outro,
// apagando campos que já tinham sido salvos certinho.
function enviarComFila(tipo, args) {
  const item = { tipo, args };
  enviosEmAndamento.push(item);
  return Promise.resolve(authApi[tipo].apply(authApi, args)).then((resposta) => {
    if (!resposta || resposta.ok === false) throw new Error("falha ao sincronizar");
  }).catch(() => {
    const fila = lerFila();
    fila.push({ tipo, args });
    gravarFila(fila);
  }).finally(() => {
    const i = enviosEmAndamento.indexOf(item);
    if (i !== -1) enviosEmAndamento.splice(i, 1);
  });
}

// Tenta reenviar tudo que ficou pendente, na ordem em que foi criado. O que continuar falhando
// permanece na fila para a próxima tentativa.
async function processarFilaPendente() {
  if (!state.account) return;
  const fila = lerFila();
  if (!fila.length) return;
  const restante = [];
  for (const item of fila) {
    try {
      const resposta = await authApi[item.tipo].apply(authApi, item.args);
      if (!resposta || resposta.ok === false) restante.push(item);
    } catch (err) {
      restante.push(item);
    }
  }
  gravarFila(restante);
}

// Uma refeição/medida que ainda está pendente de envio (na fila de reenvio OU ainda a caminho pela
// primeira vez, ver enviosEmAndamento acima) pode não aparecer na resposta autoritativa do servidor
// ainda — sem isso ela sumiria da tela até terminar de sincronizar. Aqui a gente reinclui esses itens
// pendentes na lista vinda do servidor, até que o envio seja confirmado.
// Garante só um registro por data no Diário de Kcal (mantém o de id mais alto = mais recente) -- útil
// depois de mesclar dados vindos de origens diferentes (ex.: ao conectar o Google pela primeira vez com
// dias já encerrados neste aparelho E na planilha), onde poderia sobrar mais de um registro pra mesma
// data com ids diferentes -- o que contraria a regra de "só um registro por data" (ver acaoEncerrarDia()).
function dedupDiarioKcalPorData(lista) {
  const porData = {};
  lista.forEach((r) => { if (!porData[r.date] || r.id > porData[r.date].id) porData[r.date] = r; });
  return Object.values(porData);
}
function mesclarComPendentes(listaServidor, tipoCriacao) {
  const pendentesFila = lerFila().concat(enviosEmAndamento);
  const idsServidor = new Set(listaServidor.map((item) => item.id));
  const pendentes = pendentesFila.filter((item) => item.tipo === tipoCriacao).map((item) => item.args[1]).filter((item) => !idsServidor.has(item.id));
  return listaServidor.concat(pendentes);
}

// Une os exercícios personalizados guardados neste aparelho (ver acaoConfirmarNovoExercicio()) com os
// que vieram do servidor, grupo por grupo -- evita perder um exercício cadastrado localmente que ainda
// não tenha sido confirmado pelo servidor (ex.: sem internet logo depois de cadastrar), e evita duplicar
// quem já existe nos dois lados (comparando por id).
function mesclarExerciciosCustomizados(local, remoto) {
  const resultado = {};
  const grupos = new Set(Object.keys(local || {}).concat(Object.keys(remoto || {})));
  grupos.forEach((grupoId) => {
    const listaRemoto = (remoto && remoto[grupoId]) || [];
    const listaLocal = (local && local[grupoId]) || [];
    const idsRemoto = new Set(listaRemoto.map((ex) => ex.id));
    resultado[grupoId] = listaRemoto.concat(listaLocal.filter((ex) => !idsRemoto.has(ex.id)));
  });
  return resultado;
}

// Mantém nome/foto/data de nascimento/sexo/tipo de pele atualizados em qualquer aparelho logado na
// mesma conta. Esses campos ficam guardados na nossa própria conta de usuário (não dependem do Google
// estar conectado), mas antes só eram buscados no momento do login — por isso um dado editado no
// celular não aparecia no PC (e vice-versa) enquanto o app continuasse aberto e logado lá. Roda sempre
// junto da sincronização normal (abertura do app, volta de segundo plano, foco na janela).
async function sincronizarPerfilDoServidor() {
  try {
    const resposta = await authApi.buscarPerfil(state.usuario.email);
    if (!resposta || !resposta.ok) return;
    const mudou = state.usuario.nome !== resposta.nome || (state.usuario.foto || "") !== (resposta.foto || "") ||
      (state.usuario.dataNascimento || "") !== (resposta.dataNascimento || "") || (state.usuario.sexo || "") !== (resposta.sexo || "") ||
      (state.usuario.tipoPele || "") !== (resposta.tipoPele || "");
    if (!mudou) return;
    state.usuario = Object.assign({}, state.usuario, {
      nome: resposta.nome, foto: resposta.foto || "", dataNascimento: resposta.dataNascimento || "", sexo: resposta.sexo || "", tipoPele: resposta.tipoPele || "",
    });
    persistUsuario();
    render();
  } catch { /* falha de rede — mantém os dados de perfil locais e tenta de novo na próxima abertura */ }
}

// Busca os dados no NOSSO backend (Code.gs) — nunca fala diretamente com o Google. É por isso que
// pode ser chamada sempre que o app abre (ou depois do login) sem nunca abrir nenhuma tela do Google:
// é uma chamada comum ao mesmo servidor que já cuida do login. Se a conta não estiver conectada ao
// Google, o servidor simplesmente responde dizendo isso, e o app continua funcionando só localmente.
// Roda toda vez que o app abre (ou volta a ficar visível) já conectado ao Google. A partir do momento
// em que a conta está conectada, toda alteração (salvar, apagar, editar) já tenta subir pro servidor
// na hora — então o servidor é a fonte da verdade. Por isso aqui SUBSTITUÍMOS a lista local pela que
// vem do servidor, em vez de só somar: é o que garante que uma exclusão feita em outro aparelho
// também desapareça aqui, e não só reapareça depois de sincronizar.
async function sincronizarDoServidor() {
  if (!state.usuario) return;
  await processarFilaPendente();
  await sincronizarPerfilDoServidor();
  try {
    const resposta = await authApi.carregarDadosGoogle(state.usuario.email);
    if (!resposta.ok) {
      if (state.account) { state.account = null; writeStorage(CHAVE_GACCOUNT, null); render(); }
      return;
    }
    state.account = { email: resposta.googleEmail || (state.account && state.account.email) || "" };
    writeStorage(CHAVE_GACCOUNT, state.account);
    state.meals = mesclarComPendentes(resposta.meals || [], "salvarRefeicaoGoogle"); persistMeals();
    if (resposta.goals) { state.goals = resposta.goals; persistGoals(); }
    if (resposta.altura) { state.altura = resposta.altura; persistAltura(); }
    state.medidas = mesclarComPendentes(resposta.medidas || [], "salvarMedidaGoogle"); persistMedidas();
    state.bioimpedancia = mesclarComPendentes(resposta.bioimpedancia || [], "salvarBioimpedanciaGoogle"); persistBioimpedancia();
    state.calorimetria = mesclarComPendentes(resposta.calorimetria || [], "salvarCalorimetriaGoogle"); persistCalorimetria();
    state.treinos = mesclarComPendentes(resposta.treinos || [], "salvarTreinoGoogle"); persistTreinos();
    if (resposta.exerciciosCustomizados) {
      state.exerciciosCustomizados = mesclarExerciciosCustomizados(state.exerciciosCustomizados, resposta.exerciciosCustomizados);
      persistExerciciosCustomizados();
    }
    state.diarioKcal = dedupDiarioKcalPorData(mesclarComPendentes(resposta.diarioKcal || [], "salvarDiarioKcalGoogle")); persistDiarioKcal();
    render();
  } catch { /* falha de rede — mantém os dados locais e tenta de novo na próxima abertura */ }
}
// Ao conectar pela primeira vez (ou reconectar depois de desconectar), pode haver refeições/medidas
// que só existem neste aparelho ainda (registradas antes de conectar, ou feitas offline) — como daqui
// pra frente cada ação já sobe sozinha, essa é a única vez que precisamos empurrar manualmente o que
// ficou pra trás, pra igualar este aparelho com o servidor antes de tratá-lo como fonte da verdade.
function publicarRegistrosLocaisPendentes(remoto) {
  const idsRefeicoes = new Set((remoto.meals || []).map((m) => m.id));
  const idsMedidas = new Set((remoto.medidas || []).map((m) => m.id));
  const idsBioimpedancia = new Set((remoto.bioimpedancia || []).map((b) => b.id));
  const idsCalorimetria = new Set((remoto.calorimetria || []).map((c) => c.id));
  const idsTreinos = new Set((remoto.treinos || []).map((t) => t.id));
  state.meals.filter((m) => !idsRefeicoes.has(m.id)).forEach((m) => enviarComFila("salvarRefeicaoGoogle", [state.usuario.email, m]));
  state.medidas.filter((m) => !idsMedidas.has(m.id)).forEach((m) => enviarComFila("salvarMedidaGoogle", [state.usuario.email, m]));
  state.bioimpedancia.filter((b) => !idsBioimpedancia.has(b.id)).forEach((b) => enviarComFila("salvarBioimpedanciaGoogle", [state.usuario.email, b]));
  state.calorimetria.filter((c) => !idsCalorimetria.has(c.id)).forEach((c) => enviarComFila("salvarCalorimetriaGoogle", [state.usuario.email, c]));
  state.treinos.filter((t) => !idsTreinos.has(t.id)).forEach((t) => enviarComFila("salvarTreinoGoogle", [state.usuario.email, t]));
  const remotoExercicios = remoto.exerciciosCustomizados || {};
  Object.keys(state.exerciciosCustomizados || {}).forEach((grupoId) => {
    const idsRemotoGrupo = new Set((remotoExercicios[grupoId] || []).map((ex) => ex.id));
    (state.exerciciosCustomizados[grupoId] || []).filter((ex) => !idsRemotoGrupo.has(ex.id))
      .forEach((ex) => enviarComFila("salvarExercicioCustomizadoGoogle", [state.usuario.email, { grupoId: grupoId, id: ex.id, label: ex.label }]));
  });
  const idsDiarioKcal = new Set((remoto.diarioKcal || []).map((r) => r.id));
  state.diarioKcal.filter((r) => !idsDiarioKcal.has(r.id)).forEach((r) => enviarComFila("salvarDiarioKcalGoogle", [state.usuario.email, r]));
  if (!remoto.goals) enviarComFila("atualizarMetasGoogle", [state.usuario.email, state.goals, state.altura]);
}
// Única função que efetivamente abre algo do Google — e só roda quando a pessoa clica no botão
// "Conectar Google" na barra lateral. Pede um código de autorização com access_type "offline", manda
// para o back-end trocar por uma conexão permanente (guardada junto da conta, como a senha), e nunca
// mais precisa repetir esse processo neste ou em outro aparelho.
async function acaoConectarGoogle() {
  state.syncing = true; render();
  try {
    const code = await solicitarCodigoGoogle();
    const resposta = await authApi.conectarGoogle(state.usuario.email, code);
    if (!resposta.ok) { toastError(resposta.erro || "Não foi possível conectar com o Google."); return; }
    publicarRegistrosLocaisPendentes(resposta);
    state.account = { email: resposta.googleEmail || "" };
    writeStorage(CHAVE_GACCOUNT, state.account);
    state.meals = mergeMeals(state.meals, resposta.meals || []); persistMeals();
    if (resposta.goals) { state.goals = resposta.goals; persistGoals(); }
    if (resposta.altura) { state.altura = resposta.altura; persistAltura(); }
    state.medidas = mergeMedidas(state.medidas, resposta.medidas || []); persistMedidas();
    state.bioimpedancia = mergeMedidas(state.bioimpedancia, resposta.bioimpedancia || []); persistBioimpedancia();
    state.calorimetria = mergeMedidas(state.calorimetria, resposta.calorimetria || []); persistCalorimetria();
    state.treinos = mergeMedidas(state.treinos, resposta.treinos || []); persistTreinos();
    state.exerciciosCustomizados = mesclarExerciciosCustomizados(state.exerciciosCustomizados, resposta.exerciciosCustomizados || {}); persistExerciciosCustomizados();
    state.diarioKcal = dedupDiarioKcalPorData(mergeMedidas(state.diarioKcal, resposta.diarioKcal || [])); persistDiarioKcal();
    toastSuccess("Conectado como " + state.account.email + ". Seus dados agora sincronizam entre aparelhos — sem precisar conectar de novo.");
  } catch (err) { toastError((err && err.message) || "Falha ao conectar com o Google. Tente novamente."); }
  finally { state.syncing = false; render(); }
}
function acaoDesconectarGoogle() {
  if (state.usuario) authApi.desconectarGoogle(state.usuario.email).catch(() => {});
  state.account = null;
  writeStorage(CHAVE_GACCOUNT, null);
  toastSuccess("Desconectado do Google. Conecte de novo quando quiser voltar a sincronizar.");
  render();
}

function acaoAnalisar() {
  const description = document.getElementById("meal-description").value;
  if (!description.trim()) { toastError("Descreva o que você comeu para eu calcular."); return; }
  const found = detectFoods(description);
  state.preview = found;

}
/* ===================== cadastrar produto no cardápio ===================== */
// Deixa a pessoa cadastrar um produto/receita PRÓPRIO (ex.: "Pastel de Camarão") a partir dos
// ingredientes que o compõem, reaproveitando o MESMO reconhecedor de alimentos já usado pra descrever
// uma refeição (detectFoods()) -- em vez de inventar outra forma de entrada, a pessoa digita os
// ingredientes exatamente como já digitaria numa refeição normal (ex.: "100g de camarão, 50g de trigo,
// 10g de molho de tomate"), e o app soma os nutrientes e o peso de cada ingrediente identificado. O
// produto cadastrado passa a ser reconhecido em QUALQUER refeição futura, junto com os alimentos da
// biblioteca embutida (ver a mudança em detectFoods()).
function acaoAbrirCadastrarProduto() {
  state.showCadastrarProduto = true;
  state.produtoNome = "";
  state.produtoIngredientes = "";
  state.produtoPreview = [];
  state.produtoModoCadastro = "ingredientes";
  state.produtoManualValores = {};
  state.produtoManualPorcao = "";
  state.produtoRotuloLendo = false;
  produtoRotuloArquivo = null;
  render();
}
function acaoFecharCadastrarProduto() { state.showCadastrarProduto = false; render(); }
// Alterna entre descrever ingredientes (estimativa via detectFoods(), como já existia) e digitar/ler os
// valores exatos de um rótulo impresso (ver cadastrarProdutoModalTemplate()) -- pedido do usuário.
function acaoTrocarModoCadastroProduto(modo) { state.produtoModoCadastro = modo === "manual" ? "manual" : "ingredientes"; render(); }
function acaoAnalisarIngredientesProduto() {
  const el = document.getElementById("produto-ingredientes");
  const descricao = el ? el.value : "";
  if (!descricao.trim()) { toastError("Descreva os ingredientes do produto."); return; }
  const found = detectFoods(descricao);
  state.produtoPreview = found;
  if (!found.length) toastError("Não identifiquei ingredientes conhecidos nessa descrição.");
  else toastSuccess(found.length + " ingrediente" + (found.length > 1 ? "s" : "") + " identificado" + (found.length > 1 ? "s" : "") + ".");
  render();
}
// Soma os nutrientes e o peso estimado (gramsEstimadosParaItem()) de todos os ingredientes já
// identificados, e registra o produto em state.produtosCustomizados -- a partir daí ele é só mais uma
// entrada reconhecida por detectFoods(), no mesmo formato de qualquer alimento da biblioteca embutida
// (terms/label/baseAmount/values/grams).
function acaoCadastrarProduto() {
  const nomeEl = document.getElementById("produto-nome");
  const nome = nomeEl ? nomeEl.value.trim() : "";
  if (!nome) { toastError("Informe o nome do produto."); return; }
  if (!state.produtoPreview.length) { toastError("Analise os ingredientes antes de cadastrar o produto."); return; }
  const termoNormalizado = normalizeText(nome);
  if (state.produtosCustomizados.some((p) => normalizeText(p.label) === termoNormalizado)) {
    toastError("Já existe um produto cadastrado com esse nome."); return;
  }
  const totalValues = state.produtoPreview.reduce((sum, item) => addNutrients(sum, item.values), emptyNutrients);
  // Sem nenhum ingrediente com peso estimável (caso raro -- só suplementos, por exemplo), cai pra 100g
  // como peso padrão, só pra não deixar o produto com peso zero (o que quebraria a conversão de gramas
  // quando alguém digitar uma quantidade desse produto numa refeição futura).
  const pesoTotal = Math.round(state.produtoPreview.reduce((soma, item) => soma + (item.gramsEstimados || 0), 0)) || 100;
  const novoProduto = { terms: [termoNormalizado], label: nome, baseAmount: pesoTotal + " g", values: totalValues, grams: pesoTotal };
  state.produtosCustomizados = state.produtosCustomizados.concat([novoProduto]);
  persistProdutosCustomizados();
  toastSuccess('Produto "' + nome + '" cadastrado no cardápio! Agora você pode usá-lo em qualquer refeição.');
  state.showCadastrarProduto = false;
  render();
}
function acaoRemoverProdutoCustomizado(index) {
  state.produtosCustomizados = state.produtosCustomizados.filter((_, i) => i !== index);
  persistProdutosCustomizados();
  toastSuccess("Produto removido do cardápio.");
  render();
}

  render();

function acaoRemoverRotuloProdutoSelecionado() { produtoRotuloArquivo = null; render(); }
// Carrega a biblioteca de leitura de imagem (Tesseract.js, OCR que roda no próprio navegador, sem
// enviar a foto pra nenhum servidor e sem custo -- opção escolhida pelo usuário) só quando ela for
// realmente usada pela primeira vez (nunca no carregamento inicial do app, pra não pesar a maioria das
// pessoas que nunca vai usar essa função). Promessa cacheada: cliques repetidos não recarregam o script.
let promessaTesseractCarregado = null;
function carregarTesseract() {
  if (window.Tesseract) return Promise.resolve();
  if (promessaTesseractCarregado) return promessaTesseractCarregado;
  promessaTesseractCarregado = new Promise((resolve, reject) => {
    const script = document.createElement("script");
    script.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";
    script.onload = () => resolve();
    script.onerror = () => { promessaTesseractCarregado = null; reject(new Error("Não foi possível carregar a biblioteca de leitura de imagem.")); };
    document.head.appendChild(script);
  });
  return promessaTesseractCarregado;
}
// Palavras-chave (já sem acento/minúsculas -- comparadas com normalizeText()) que identificam cada
// nutriente numa linha do texto reconhecido pelo OCR num rótulo brasileiro. Cobre só os nutrientes que
// esse app já rastreia E que normalmente aparecem impressos (calorias, carboidratos, proteínas,
// gorduras totais, fibras, sódio, cálcio, ferro) -- vitaminas e os demais minerais (magnésio, potássio,
// zinco) quase nunca vêm no rótulo, então ficam de fora do formulário manual e entram como 0.
const ROTULO_NUTRIENTES_OCR = [
  { chave: "calories", aliases: ["valor energetico", "valor calorico"] },
  { chave: "carbs", aliases: ["carboidratos"] },
  { chave: "protein", aliases: ["proteinas"] },
  { chave: "fat", aliases: ["gorduras totais", "gordura total"] },
  { chave: "fiber", aliases: ["fibras alimentares", "fibra alimentar"] },
  { chave: "sodio", aliases: ["sodio"] },
  { chave: "calcio", aliases: ["calcio"] },
  { chave: "ferro", aliases: ["ferro"] },
];
// A tabela nutricional brasileira costuma trazer, em cada linha, até 3 números: valor por 100 g/ml,
// valor pela PORÇÃO (a mesma base do campo "Porção" do formulário -- é esse que interessa) e o %VD.
// Com 3 números, o do meio é o da porção; com 2 (algumas linhas não têm %VD, ex.: açúcares
// adicionados), o segundo também é o da porção; com 1 só, o rótulo tem uma única coluna e já é esse
// valor. Isso é só uma aproximação -- o texto reconhecido pelo OCR não preserva colunas, por isso a
// pessoa sempre precisa conferir os valores antes de salvar (ver aviso em cadastrarProdutoModalTemplate()).
function escolherValorDaLinhaRotulo(numeros) {
  if (numeros.length >= 2) return numeros[1];
  if (numeros.length === 1) return numeros[0];
  return null;
}
function extrairValoresRotulo(textoOcr) {
  const linhas = String(textoOcr || "").split(/\n+/);
  const nutrientes = {};
  for (const linha of linhas) {
    const linhaNormalizada = normalizeText(linha);
    for (const config of ROTULO_NUTRIENTES_OCR) {
      if (nutrientes[config.chave] != null) continue; // já achado numa linha anterior (não sobrescreve)
      if (!config.aliases.some((a) => linhaNormalizada.indexOf(a) !== -1)) continue;
      const numeros = (linha.match(/\d+(?:[.,]\d+)?/g) || []).map((n) => Number(n.replace(",", ".")));
      const valor = escolherValorDaLinhaRotulo(numeros);
      if (valor != null && !isNaN(valor)) nutrientes[config.chave] = valor;
    }
  }
  // "Porção: 250 ml (1 unidade)" -- pega o número logo antes de "g"/"ml" na linha da porção.
  let porcao = null;
  const linhaPorcao = linhas.find((l) => normalizeText(l).indexOf("porcao") !== -1);
  if (linhaPorcao) {
    const m = linhaPorcao.match(/(\d+(?:[.,]\d+)?)\s*(g|ml)\b/i);
    if (m) porcao = m[1].replace(",", ".");
  }
  return { nutrientes, porcao };
}
// IMPORTANTE: não chama render() em nenhum momento -- mesmo motivo de
// acaoAtualizarConclusaoIdadeMetabolica() (ver comentário lá): a leitura do rótulo é assíncrona e pode
// levar alguns segundos, e um render() no meio reconstruiria o HTML do formulário inteiro a partir de
// "state" -- como captureFormState() roda no INÍCIO de todo render() pra preservar o que já estava
// digitado, ele capturaria os campos ainda em branco (a leitura ainda não tinha terminado) e apagaria
// esse resultado assim que ele chegasse. Por isso os valores lidos são escritos DIRETO nos campos do
// DOM (e em "state", só pra acompanhar um possível render() futuro por outro motivo).
async function acaoLerRotuloOCR() {
  if (!produtoRotuloArquivo) { toastError("Escolha uma foto do rótulo primeiro."); return; }
  const botao = document.getElementById("produto-rotulo-ler-btn");
  state.produtoRotuloLendo = true;
  if (botao) { botao.disabled = true; botao.innerHTML = icon("sparkles") + " Lendo rótulo..."; }
  try {
    await carregarTesseract();
    const resultado = await Tesseract.recognize(produtoRotuloArquivo, "por");
    const extraido = extrairValoresRotulo(resultado.data.text);
    if (!Object.keys(extraido.nutrientes).length) {
      toastError("Não consegui identificar valores nutricionais nessa foto. Tente uma foto mais nítida, bem enquadrada, ou digite os valores manualmente.");
    } else {
      state.produtoManualValores = Object.assign({}, state.produtoManualValores, extraido.nutrientes);
      if (extraido.porcao) state.produtoManualPorcao = extraido.porcao;
      Object.keys(extraido.nutrientes).forEach((chave) => {
        const el = document.getElementById("produto-manual-" + chave);
        if (el) el.value = extraido.nutrientes[chave];
      });
      if (extraido.porcao) {
        const porcaoEl = document.getElementById("produto-manual-porcao");
        if (porcaoEl) porcaoEl.value = extraido.porcao;
      }
      toastSuccess("Leitura concluída — confira os valores abaixo antes de salvar, a leitura automática pode errar.");
    }
  } catch (e) {
    toastError("Não foi possível ler o rótulo automaticamente agora. Digite os valores manualmente.");
  }
  state.produtoRotuloLendo = false;
  if (botao) { botao.disabled = false; botao.innerHTML = icon("sparkles") + " Ler rótulo automaticamente"; }
}
// Cadastra o produto a partir de valores digitados (ou lidos automaticamente do rótulo, ver
// acaoLerRotuloOCR() acima) em vez de estimados a partir de uma descrição de ingredientes -- pro caso
// comum de produtos industrializados, que já vêm com a tabela nutricional impressa (valores exatos, sem
// precisar de estimativa). Mesmo formato final de produto customizado que acaoCadastrarProduto() já usa
// (terms/label/baseAmount/values/grams), pra participar do reconhecimento em detectFoods() do mesmo jeito.
function acaoCadastrarProdutoManual() {
  const nomeEl = document.getElementById("produto-nome");
  const nome = nomeEl ? nomeEl.value.trim() : "";
  if (!nome) { toastError("Informe o nome do produto."); return; }
  const termoNormalizado = normalizeText(nome);
  if (state.produtosCustomizados.some((p) => normalizeText(p.label) === termoNormalizado)) {
    toastError("Já existe um produto cadastrado com esse nome."); return;
  }
  const porcaoEl = document.getElementById("produto-manual-porcao");
  const porcao = porcaoEl ? Number(String(porcaoEl.value).trim().replace(",", ".")) : 0;
  if (!porcao) { toastError("Informe o peso ou volume da porção (em g ou ml), igual aparece no rótulo."); return; }
  const campo = (id) => {
    const el = document.getElementById("produto-manual-" + id);
    if (!el || !el.value.trim()) return 0;
    const valor = Number(String(el.value).trim().replace(",", "."));
    return isNaN(valor) ? 0 : valor;
  };
  const values = Object.assign({}, emptyNutrients, {

  });

  const novoProduto = { terms: [termoNormalizado], label: nome, baseAmount: formatNumber(porcao, 0) + " g", values, grams: porcao };

function acaoSelecionarTipoRefeicao(tipo) {
  // Trocar de/para "Exposição Solar" invalida o que já estava calculado -- o preview de "Exposição

  // itens, com kcal/macros), e vice-versa. Trocar entre dois tipos de refeição "normais" continua
  // preservando o preview de alimentos já calculado, como sempre foi.
  if (tipo === "Exposição Solar" || state.mealTipo === "Exposição Solar") { state.preview = []; state.mealDescription = ""; }
  state.mealTipo = tipo;
  if (tipo !== "Outro") state.mealNomeCustom = "";

  // um clique extra) -- só na primeira vez (status "idle"), pra não ficar pedindo de novo toda hora que
  // a pessoa troca de tipo de refeição e volta.
  if (tipo === "Exposição Solar" && state.exposicaoLocalizacaoStatus === "idle") {

    return;
  }
  render();

// Pede a localização do dispositivo (API padrão do navegador, sem custo) e busca o índice UV real do
// local/dia (buscarIndiceUVAtual()) -- é o que deixa o cálculo de vitamina D mais preciso, usando dados
// reais de radiação em vez de só uma curva estimada pela hora do relógio. Se a localização for negada,
// indisponível, ou a busca do índice UV falhar (sem internet, API fora do ar), cai automaticamente pro
// modo manual (seleção do céu) sem travar o registro -- ver exposicaoSolarCamposTemplate().
function acaoObterLocalizacaoExposicao() {
  if (!navigator.geolocation) { state.exposicaoLocalizacaoStatus = "indisponivel"; render(); return; }
  state.exposicaoLocalizacaoStatus = "buscando";
  render();
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      buscarIndiceUVAtual(pos.coords.latitude, pos.coords.longitude).then((dados) => {
        state.exposicaoUVHorario = dados;
        state.exposicaoLocalizacaoStatus = "ok";
        render();
      }).catch(() => { state.exposicaoLocalizacaoStatus = "erro"; render(); });
    },
    (erro) => { state.exposicaoLocalizacaoStatus = (erro && erro.code === 1) ? "negado" : "indisponivel"; render(); },
    { enableHighAccuracy: false, timeout: 10000, maximumAge: 600000 }
  );
}
// Deixa a pessoa pular a localização de propósito (ou voltar pro modo manual mesmo já tendo o índice UV

function acaoUsarCeuManual() { state.exposicaoLocalizacaoStatus = "manual"; render(); }

// e monta um item de preview no MESMO formato de um alimento identificado ({label, amount, values}) --
// é o que permite reaproveitar mealTotal()/acaoSalvarRefeicao() sem duplicar lógica de salvar refeição.
function acaoCalcularExposicaoSolar() {
  const inicioEl = document.getElementById("exposicao-inicio");
  const fimEl = document.getElementById("exposicao-fim");
  const inicio = inicioEl ? inicioEl.value : "";
  const fim = fimEl ? fimEl.value : "";
  state.exposicaoInicio = inicio;
  state.exposicaoFim = fim;
  const tipoPele = state.usuario && state.usuario.tipoPele;
  if (!tipoPele) { toastError("Cadastre seu tipo de pele no perfil antes de calcular."); return; }
  if (!inicio || !fim) { toastError("Informe o horário de início e fim da exposição."); return; }

  // Caminho preferido: já temos o índice UV real da localização (ver acaoObterLocalizacaoExposicao()).
  // Só cai pro modo manual (seleção do céu) quando isso não foi possível.
  const usandoUV = state.exposicaoLocalizacaoStatus === "ok" && state.exposicaoUVHorario;
  let resultado, detalheFonte;
  if (usandoUV) {
    resultado = calcularVitaminaDSolPorUV(inicio, fim, state.exposicaoUVHorario, tipoPele);
    // O sistema informa sozinho a condição do tempo detectada (a partir da cobertura de nuvens do
    // mesmo local/horário) -- não precisa perguntar pro usuário como estava o céu.
    detalheFonte = "índice UV real da sua localização" + (resultado && resultado.condicaoTempo ? " · " + resultado.condicaoTempo : "");
  } else {
    const ceuEl = document.getElementById("exposicao-ceu");
    const ceu = ceuEl ? ceuEl.value : "";
    state.exposicaoCeu = ceu;
    if (!ceu) { toastError("Selecione como estava o céu (ou tente obter sua localização novamente)."); return; }
    resultado = calcularVitaminaDSol(inicio, fim, ceu, tipoPele);
    detalheFonte = CEU_LABEL[ceu] + " (informado manualmente)";
  }
  if (!resultado) { toastError("O horário de término precisa ser depois do horário de início."); return; }
  state.preview = [{
    label: "Exposição solar",
    amount: inicio + "–" + fim + " (" + resultado.minutos + " min) · " + detalheFonte,
    values: Object.assign({}, emptyNutrients, { vitD: resultado.mcg }),
  }];
  state.mealDescription = "Exposição solar de " + inicio + " às " + fim + " (" + resultado.minutos + " minutos) · " + detalheFonte;
  toastSuccess("Vitamina D estimada: " + formatVitaminaDComUI(resultado.mcg, 1) + ".");
  render();
}
function acaoSalvarRefeicao() {
  const descInput = document.getElementById("meal-description");
  const customInput = document.getElementById("meal-nome-custom");
  const mealName = state.mealTipo === "Outro" ? (customInput ? customInput.value.trim() : "") : state.mealTipo;
  if (!state.mealTipo) { toastError("Selecione a refeição."); return; }
  if (!mealName) { toastError("Informe o nome da refeição."); return; }
  if (!state.preview.length) { toastError("Analise a descrição antes de salvar a refeição."); return; }
  // Data da refeição -- normalmente "hoje", mas pode ser um dia passado pra registrar algo esquecido
  // (ver campo #meal-data em nutricaoTabTemplate()/state.mealData). Mesmo padrão já usado pro treino
  // (#treino-data).
  const dataEl = document.getElementById("meal-data");
  const dataRefeicao = dataEl && dataEl.value ? dataEl.value : today();
  if (dataRefeicao > today()) { toastError("A data da refeição não pode ser no futuro."); return; }
  const now = new Date();
  const total = mealTotal();
  // Sem textarea de descrição no modo "Exposição Solar" (ver exposicaoSolarCamposTemplate()) -- a
  // descrição, nesse caso, já foi montada automaticamente em acaoCalcularExposicaoSolar() e guardada
  // direto em state.mealDescription, sem precisar de um campo de texto na tela.
  const description = descInput ? descInput.value.trim() : state.mealDescription;
  const novaRefeicao = Object.assign({}, total, {
    id: Date.now(), date: dataRefeicao, name: mealName, description: description,
    detected: state.preview.map((f) => f.label), time: now.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }),
    // Guarda o detalhamento por alimento (nome, quantidade e todos os nutrientes daquele alimento
    // específico) — é o que permite abrir uma refeição no histórico e ver o que cada alimento
    // individualmente contribuiu, e não só o total da refeição.
    alimentos: state.preview.map((f) => ({ label: f.label, amount: f.amount, values: f.values })),
  });
  state.meals = state.meals.concat([novaRefeicao]);
  persistMeals();
  state.preview = [];
  state.mealTipo = ""; state.mealNomeCustom = ""; state.mealDescription = ""; state.mealData = "";
  state.exposicaoInicio = ""; state.exposicaoFim = ""; state.exposicaoCeu = "";
  state.exposicaoLocalizacaoStatus = "idle"; state.exposicaoUVHorario = null;
  if (descInput) descInput.value = "";
  if (dataEl) dataEl.value = "";
  toastSuccess(dataRefeicao === today() ? "Refeição registrada no histórico." : "Refeição registrada em " + dateLabel(dataRefeicao) + ".");
  if (state.account) enviarComFila("salvarRefeicaoGoogle", [state.usuario.email, novaRefeicao]);
  // Se esse dia já tinha sido encerrado no Diário de Kcal (ex.: registrando uma refeição esquecida de
  // um dia que já virou -- ver comentário em state.mealData), ressincroniza esse registro fechado pra
  // já incluir a refeição recém-adicionada, sem precisar clicar manualmente em "Recalcular".
  sincronizarDiarioKcalDoDia(dataRefeicao);
  render();
}

// Corrige a data de uma refeição já salva -- pensado pro caso em que a refeição foi registrada com a
// data errada (ex.: o aparelho estava com o relógio no dia errado no momento de salvar) e por isso
// aparece em "Refeições de hoje"/no histórico do dia errado. Não existe endpoint de "atualizar" no
// backend (só salvar/remover -- ver salvarRefeicaoGoogle()/removerRefeicaoGoogle() no Code.gs), então a
// correção é feita como remover o registro antigo e recriar um novo, idêntico, só que com a data certa
// e um id novo -- reaproveita os dois endpoints que já existem, sem precisar mexer na planilha/backend.
function acaoEditarDataRefeicao(id, novaData) {
  if (!novaData) { toastError("Selecione uma data."); return; }
  if (novaData > today()) { toastError("A data não pode ser no futuro."); return; }
  const m = state.meals.find((meal) => meal.id === id);
  if (!m) return;
  if (m.date === novaData) { state.mealDetalheEditandoData = false; render(); return; }
  const corrigida = Object.assign({}, m, { id: Date.now(), date: novaData });
  state.meals = state.meals.filter((meal) => meal.id !== id).concat([corrigida]);
  persistMeals();
  if (state.account) {
    enviarComFila("removerRefeicaoGoogle", [state.usuario.email, id]);
    enviarComFila("salvarRefeicaoGoogle", [state.usuario.email, corrigida]);
  }
  state.mealDetalheId = corrigida.id;
  state.mealDetalheEditandoData = false;
  toastSuccess("Data da refeição corrigida para " + dateLabel(novaData) + ".");
  // Se o dia antigo e/ou o dia novo já estiverem encerrados no Diário de Kcal, ressincroniza os dois --
  // mesmo padrão de acaoSalvarTreino() ao mudar a data de um treino já salvo.
  sincronizarDiarioKcalDoDia(m.date);
  sincronizarDiarioKcalDoDia(novaData);
  render();

function acaoRemoverRefeicao(id) {

function acaoTrocarAbaNutricao(aba) { state.nutricaoAba = aba; render(); }
// Guarda no Diário de Kcal um resumo do dia de hoje: total de calorias/macro/micronutrientes consumidos
// e a lista das refeições (nome, horário e valores DA REFEIÇÃO -- não alimento por alimento, ver
// diarioKcalRefeicaoTemplate()). Só existe um registro por data: clicar de novo no mesmo dia substitui o
// registro anterior (ex.: a pessoa lembrou de registrar mais uma refeição e quer atualizar o resumo).
function acaoEncerrarDia() {
  // Usa o MESMO conjunto que os cards (consumedToday()) somam -- ver mealsDesdeUltimoEncerramento(),
  // sempre só as refeições de HOJE -- assim o resumo salvo aqui sempre bate exatamente com o que os
  // cards mostravam no instante do clique.
  const meals = ordenarPorTipoDeRefeicao(mealsDesdeUltimoEncerramento());
  if (!meals.length) { toastError("Registre ao menos uma refeição antes de encerrar o dia."); return; }
  const t = today();
  const totais = meals.reduce((sum, m) => addNutrients(sum, m), emptyNutrients);
  const refeicoes = meals.map((m) => {
    const r = { name: m.name, time: m.time, alimentos: m.detected || [] };
    NUTRIENT_KEYS.forEach((k) => { r[k] = m[k] || 0; });
    return r;
  });
  // Calorias queimadas nos treinos do dia (ver estimarCaloriasQueimadas()) -- entram como informação
  // separada no registro, ao lado das calorias consumidas; não afeta a meta/saldo de consumo.
  const caloriasQueimadas = todayTreinos().reduce((soma, tr) => soma + (tr.caloriasQueimadas || 0), 0);
  // corteId: o MAIOR id de refeição já incluído neste "Encerrar dia" -- é isso que corteDiaAberto() usa
  // daqui pra frente como corte dos cards (não mais o id do PRÓPRIO registro, que é só um timestamp do
  // instante do clique). Bug corrigido: usar o id do registro (Date.now() no momento do clique) como
  // corte pressupõe que o relógio do aparelho que clicou "Encerrar dia" está sempre à frente dos ids de
  // QUALQUER refeição registrada depois, em QUALQUER aparelho -- o que quebra se os relógios de dois
  // aparelhos (ex.: PC e celular) estiverem dessincronizados: um clique feito num aparelho com o relógio
  // adiantado gera um id maior que o de refeições registradas depois num aparelho com o relógio certo,
  // fazendo os cards (consumedToday()) ficarem travados em zero/incompletos pra sempre (a lista de hoje,
  // que é por DATA e não por id, continua mostrando as refeições certinho -- só os cards que somem
  // errado, exatamente o sintoma relatado). Usando o maior id das refeições REALMENTE incluídas nesse
  // fechamento (todas com id > corte anterior, por construção), o corte fica ancorado nos ids reais das
  // refeições, nunca no relógio de quem clicou. corteId != null trata registros antigos (ver
  // corteDiaAberto()).
  const corteId = meals.reduce((maior, m) => Math.max(maior, m.id), 0);
  // Congela a meta de calorias/macro e o objetivo escolhidos AGORA, no momento do "Encerrar dia" -- ver
  // diarioKcalMetaTexto()/diarioKcalMacrosTemplate(). Combinado com o usuário: um registro já salvo não
  // pode mudar se a meta do dia for alterada depois, então salvamos os valores junto com o resto do
  // resumo em vez de recalcular sempre a partir de state.goals (que reflete só o valor ATUAL). Os
  // micronutrientes não entram aqui porque a referência deles (MICRO_GOALS) é fixa, não uma meta
  // pessoal editável -- não muda com o tempo, então não precisa congelar.
  // Mesmo raciocínio pro GET: congela o GET (repouso) da calorimetria mais recente NESTE momento -- outro
  // pedido do usuário, pra um TMB/GET novo, informado depois numa calorimetria, não alterar o que já
  // ficou salvo/registrado aqui (ver diarioKcalGastoTotalInfo()).
  const ultimoCaloAoEncerrar = ultimaCalorimetria();
  const registro = Object.assign({
    id: Date.now(), date: t, refeicoes: refeicoes, caloriasQueimadas: caloriasQueimadas, corteId: corteId,
    metaCalorias: state.goals.calories, metaProtein: state.goals.protein, metaCarbs: state.goals.carbs,
    metaFat: state.goals.fat, metaFiber: state.goals.fiber, objetivo: state.goals.objetivo || "",
    get: ultimoCaloAoEncerrar && ultimoCaloAoEncerrar.get ? Number(ultimoCaloAoEncerrar.get) : null,
  }, totais);
  state.diarioKcal = state.diarioKcal.filter((r) => r.date !== t).concat([registro]);
  persistDiarioKcal();
  // NÃO apaga as refeições -- elas continuam em "Refeições de hoje" (se forem de hoje) e no Histórico
  // normalmente. Só zera os CARDS de consumo (kcal/macro/micronutrientes) e o resumo do topo: eles são
  // calculados por consumedToday(), que passa a ignorar (só pra esses cards) as refeições registradas
  // até agora, usando o id deste próprio registro do Diário como corte -- e esse registro sincroniza com
  // o Google, então o corte vale em qualquer aparelho conectado à mesma conta, não só neste. Uma
  // refeição registrada depois deste clique volta a contar normalmente nos cards, e o corte só muda de
  // novo no próximo "Encerrar dia" -- OU sozinho, na próxima virada de meia-noite (ver
  // processarViradaDeDia()/fecharDiaAutomaticamente()), o que vier primeiro. Esse botão continua
  // servindo pra quem quiser fechar o dia mais cedo (ex.: antes de dormir); quem não clicar tem o dia
  // fechado automaticamente à meia-noite mesmo assim.
  toastSuccess("Dia encerrado — resumo guardado no Diário de Kcal em " + dateLabel(t) + ". Os cards de consumo foram zerados.");
  if (state.account) enviarComFila("salvarDiarioKcalGoogle", [state.usuario.email, registro]);
  render();
}
// Fecha (ou confirma, se a pessoa já tinha fechado esse dia manualmente antes da meia-noite) o
// registro do Diário de Kcal de UM dia específico que já virou -- chamada por processarViradaDeDia()
// pra cada dia de calendário que passou desde a última verificação. Ao contrário do corte por id do
// "Encerrar dia" manual (mealsDesdeUltimoEncerramento(), que pode juntar vários dias atrasados no
// mesmo resumo se a pessoa esquecer de clicar -- bug já relatado, ver comentário de
// recalcularDiarioKcalRegistro() logo abaixo), aqui o corte é sempre por DATA: cada dia gera (ou
// confirma) o SEU PRÓPRIO registro, nunca misturando refeições de dias diferentes, mesmo que o app
// fique dias fechado. Sem nenhuma refeição/treino registrado nesse dia e sem registro já existente,
// não cria nada (nada pra resumir). Congela a meta/objetivo vigente NO MOMENTO do fechamento
// automático, exceto quando o dia já tinha sido fechado manualmente antes -- aí preserva a meta já
// congelada naquele momento, só atualizando o corteId (pra cobrir qualquer refeição registrada depois
// do clique manual mas ainda no mesmo dia).
function fecharDiaAutomaticamente(date) {
  const mealsDoDia = ordenarPorTipoDeRefeicao(state.meals.filter((m) => m.date === date));
  const treinosDoDia = state.treinos.filter((tr) => tr.date === date);
  const existente = state.diarioKcal.find((r) => r.date === date);
  if (!mealsDoDia.length && !existente) return; // nada registrado nesse dia -- nada a fechar
  const totais = mealsDoDia.reduce((sum, m) => addNutrients(sum, m), emptyNutrients);
  const refeicoes = mealsDoDia.map((m) => {
    const r = { name: m.name, time: m.time, alimentos: m.detected || [] };
    NUTRIENT_KEYS.forEach((k) => { r[k] = m[k] || 0; });
    return r;
  });
  const caloriasQueimadas = treinosDoDia.reduce((soma, tr) => soma + (tr.caloriasQueimadas || 0), 0);
  const corteId = mealsDoDia.reduce((maior, m) => Math.max(maior, m.id), existente && existente.corteId != null ? existente.corteId : 0);
  // get: mesmo padrão de "congelar no momento do fechamento" já usado pra meta/objetivo acima -- um dia
  // que já tinha sido fechado (existente) preserva o GET que já estava congelado nele (mesmo que essa
  // coluna ainda não existisse quando esse registro foi criado, ver diarioKcalGastoTotalInfo()); só um
  // dia novo (sem existente) busca o GET vigente agora, no momento deste fechamento.
  const ultimoCaloAoFechar = existente ? null : ultimaCalorimetria();
  const registro = Object.assign({
    id: existente ? existente.id : Date.now(), date: date, refeicoes: refeicoes, caloriasQueimadas: caloriasQueimadas, corteId: corteId,
    metaCalorias: existente ? existente.metaCalorias : state.goals.calories,
    metaProtein: existente ? existente.metaProtein : state.goals.protein,
    metaCarbs: existente ? existente.metaCarbs : state.goals.carbs,
    metaFat: existente ? existente.metaFat : state.goals.fat,
    metaFiber: existente ? existente.metaFiber : state.goals.fiber,
    objetivo: existente ? existente.objetivo : (state.goals.objetivo || ""),
    get: existente ? existente.get : (ultimoCaloAoFechar && ultimoCaloAoFechar.get ? Number(ultimoCaloAoFechar.get) : null),
  }, totais);
  state.diarioKcal = state.diarioKcal.filter((r) => r.date !== date).concat([registro]);
  persistDiarioKcal();
  if (state.account) enviarComFila("salvarDiarioKcalGoogle", [state.usuario.email, registro]);
}
// Virada automática de dia: às 0h (no relógio do APARELHO -- não existe nada rodando no servidor com o
// app fechado, então a virada só é detectada quando o app está aberto, ver os pontos que chamam essa
// função mais abaixo), cada dia de calendário que passou desde a última verificação vira, sozinho, um
// registro no Diário de Kcal (fecharDiaAutomaticamente()) -- e os cards de consumo do novo dia
// começam do zero automaticamente, já que corteDiaAberto() passa a considerar esse novo corteId. As
// listas "de hoje" de refeições/treinos/medidas também esvaziam sozinhas nesse momento, sem precisar
// de nenhuma lógica extra: elas já filtram por state.X.date === today(), e today() reflete a data real
// do aparelho -- uma vez que o dia vira, os registros de ontem simplesmente deixam de bater com
// today() e passam a aparecer só no Histórico (ver historyDays()/historyDaysTreinos()/
// historyDaysMedidas(), que agora excluem o dia de hoje de propósito). Se o app ficar fechado vários
// dias, cada dia perdido no meio vira seu PRÓPRIO registro de histórico (nunca junta dois dias num
// só). Devolve true se algum dia foi processado (pra quem chamou saber se precisa re-renderizar).
// BUG CORRIGIDO (relatado pelo usuário: virada de meia-noite moveu refeições/treinos/medidas pro
// Histórico normalmente, mas os cards de consumo não zeraram e o Diário de Kcal do dia anterior não
// apareceu sozinho): o cursor começava em proximoDia(ultimo) em vez de no próprio "ultimo". Como
// state.ultimoDiaProcessado é resalvo como "hoje" a CADA checagem (mesmo sem nenhum dia ter virado --
// ver o final desta função), no caso mais comum (app checado uma vez por dia, então "ultimo" é sempre
// exatamente o dia anterior a "hoje" na primeira checagem depois da meia-noite) isso fazia
// cursor === hoje de cara, e o laço (que só roda enquanto cursor < hoje) nunca executava nem uma vez --
// ou seja, fecharDiaAutomaticamente() nunca era chamada no dia a dia normal, só quando o app ficava
// fechado 2+ dias corridos (gap maior que um dia entre checagens). É por isso que os testes antigos
// (que sempre simulavam "app fechado vários dias") passavam sem pegar esse bug.
// Rede de segurança: fecha (cria o registro do zero) qualquer dia PASSADO que tenha refeição/treino
// registrado mas ainda não tenha nenhum registro no Diário de Kcal -- não só os dias no intervalo entre
// a última checagem e hoje (isso já é coberto pelo laço de processarViradaDeDia() logo abaixo), mas
// QUALQUER data passada "órfã", de qualquer origem: um dia que ficou assim por causa de uma versão
// antiga do app com bug (ex.: antes desta correção, uma refeição retroativa pra um dia em branco não
// chegava a criar o registro do Diário -- ver sincronizarDiarioKcalDoDia()), um dado importado/restaurado
// de outro lugar, ou qualquer outra causa que a gente ainda não previu. Roda toda vez que o app checa a
// virada de dia (não só quando um dia realmente vira), então mesmo quem já tinha ficado com um "buraco"
// no Diário de Kcal de antes dessa correção existir tem ele preenchido sozinho na próxima vez que abrir
// o app -- sem precisar refazer nada manualmente. Devolve true se corrigiu algum dia (pra quem chamou
// saber se precisa re-renderizar).
function reconciliarDiasPassadosSemRegistro() {
  const hoje = today();
  const datasComRegistro = new Set(state.diarioKcal.map((r) => r.date));
  const datasOrfas = new Set(
    state.meals.filter((m) => m.date < hoje && !datasComRegistro.has(m.date)).map((m) => m.date)
  );
  datasOrfas.forEach((date) => fecharDiaAutomaticamente(date));
  return datasOrfas.size > 0;
}
function processarViradaDeDia() {
  const hoje = today();
  const ultimo = state.ultimoDiaProcessado || hoje;
  let processouAlgum = false;
  if (ultimo < hoje) {
    let cursor = ultimo; // começa no próprio "ultimo" (o primeiro dia ainda não fechado), não no dia seguinte
    // Guarda de segurança: nunca deveria rodar mais que uns poucos milhares de iterações (isso
    // representaria anos de app fechado), mas evita loop infinito caso proximoDia() devolva null por
    // algum motivo inesperado (data corrompida no storage, por exemplo).
    let seguranca = 0;
    while (cursor && cursor < hoje && seguranca < 3650) {
      fecharDiaAutomaticamente(cursor);
      processouAlgum = true;
      cursor = proximoDia(cursor);
      seguranca++;
    }
    state.ultimoDiaProcessado = hoje;
    writeStorage(CHAVE_ULTIMO_DIA_PROCESSADO, hoje);
  }
  if (reconciliarDiasPassadosSemRegistro()) processouAlgum = true;
  return processouAlgum;
}
// Chamada ao abrir o app, ao voltar pra aba/foco (visibilitychange/focus) e periodicamente enquanto o
// app fica aberto (ver verificarViradaDeDiaPeriodicamente()) -- roda processarViradaDeDia() e só
// re-renderiza se algo realmente mudou (evita re-render à toa a cada verificação, a maioria das quais
// não encontra nenhum dia novo pra fechar).
function verificarViradaDeDia() {
  if (processarViradaDeDia()) render();
}
// Corrige um registro já fechado no Diário de Kcal pra refletir só as refeições REALMENTE daquele dia
// (comparando por DATA). Hoje em dia (mealsDesdeUltimoEncerramento() já filtra só refeições de HOJE) um
// "Encerrar dia" novo nunca mais junta refeições de datas diferentes -- mas essa função continua útil
// pra corrigir registros ANTIGOS que já tinham ficado "poluídos" antes dessa correção existir (relatado
// pelo usuário: um fechamento em 17/09 trouxe junto refeições registradas em 11/09 e 13/09, porque o
// corte era só por id, sem checar a data -- ver histórico de mealsDesdeUltimoEncerramento()), e também
// depois de editar/mover a data de uma refeição ou treino de um dia já encerrado (ver
// sincronizarDiarioKcalDoDia()). Recalcula os totais, a lista de refeições exibida e as calorias
// queimadas usando só state.meals/state.treinos daquela DATA específica. NÃO mexe no corteId.
// Recalcula totais/refeições/calorias queimadas de um registro do Diário de Kcal a partir de
// state.meals/state.treinos DAQUELA DATA (registro.date) -- usado tanto pelo botão "Recalcular" quanto,
// automaticamente, depois de corrigir a data do registro (ver acaoEditarDataDiarioKcal()), já que nos
// dois casos o objetivo é o mesmo: fazer o registro refletir de fato as refeições e treinos do dia que
// ele diz representar.
function recalcularDiarioKcalRegistro(registro) {
  const mealsDoDia = ordenarPorTipoDeRefeicao(state.meals.filter((m) => m.date === registro.date));
  const totais = mealsDoDia.reduce((sum, m) => addNutrients(sum, m), emptyNutrients);
  const refeicoes = mealsDoDia.map((m) => {
    const linha = { name: m.name, time: m.time, alimentos: m.detected || [] };
    NUTRIENT_KEYS.forEach((k) => { linha[k] = m[k] || 0; });
    return linha;
  });
  const caloriasQueimadas = state.treinos.filter((tr) => tr.date === registro.date).reduce((soma, tr) => soma + (tr.caloriasQueimadas || 0), 0);
  return Object.assign({}, registro, totais, { refeicoes, caloriasQueimadas });
}
// Ressincroniza o Diário de Kcal de uma data específica depois de criar/editar/remover uma refeição ou
// treino daquele dia (ver acaoSalvarRefeicao()/acaoSalvarTreino()/etc.) -- pra ele sempre refletir o que
// realmente está registrado naquela data, mesmo quando a alteração foi feita bem depois (ex.: campo de
// data retroativa em #meal-data).
// Dia PASSADO (antes de hoje): usa fecharDiaAutomaticamente(), que cria o registro do zero se ainda não
// existir nenhum (ex.: um dia que ficou totalmente em branco, sem nada registrado, nunca chegou a ser
// fechado sozinho pela virada -- ver fecharDiaAutomaticamente()) ou atualiza o que já existir. BUG
// CORRIGIDO (relatado pelo usuário: registrar retroativamente a refeição de um dia que tinha ficado
// totalmente em branco fazia o Diário de Kcal daquele dia nunca aparecer, porque essa função só sabia
// ATUALIZAR um registro já existente, nunca criar um novo).
// Dia de HOJE: hoje ainda está "aberto" -- só corrige um registro que a pessoa já tinha fechado
// manualmente mais cedo hoje (ver acaoEncerrarDia()); nunca cria um registro novo sozinho pra hoje, já
// que isso só deve acontecer quando o dia realmente virar (fecharDiaAutomaticamente(), via
// processarViradaDeDia()) ou a pessoa clicar em "Encerrar dia".
function sincronizarDiarioKcalDoDia(date) {
  if (date !== today()) { fecharDiaAutomaticamente(date); return; }
  const registro = state.diarioKcal.find((r) => r.date === date);
  if (!registro) return;
  const corrigido = recalcularDiarioKcalRegistro(registro);
  state.diarioKcal = state.diarioKcal.map((r) => (r.id === registro.id ? corrigido : r));
  persistDiarioKcal();
  if (state.account) enviarComFila("salvarDiarioKcalGoogle", [state.usuario.email, corrigido]);
}
function acaoRecalcularDiarioKcal(id) {
  const registro = state.diarioKcal.find((r) => r.id === id);
  if (!registro) return;
  const corrigido = recalcularDiarioKcalRegistro(registro);
  state.diarioKcal = state.diarioKcal.map((r) => (r.id === id ? corrigido : r));
  persistDiarioKcal();
  if (state.account) enviarComFila("salvarDiarioKcalGoogle", [state.usuario.email, corrigido]);
  toastSuccess("Registro de " + dateLabel(registro.date) + " recalculado com as refeições e treinos daquele dia.");
  render();
}
function acaoAbrirEdicaoDataDiarioKcal(id) { state.diarioKcalEditandoDataId = id; render(); }
function acaoCancelarEdicaoDataDiarioKcal() { state.diarioKcalEditandoDataId = null; render(); }
// Corrige a data de um registro já encerrado no Diário de Kcal -- pensado pro caso em que a pessoa
// esqueceu de clicar em "Encerrar dia" no dia certo e só encerrou depois, fazendo o resumo ser salvo com
// a data do clique em vez da data real das refeições (ex.: esqueceu de encerrar 18/09 e só encerrou em
// 19/09 -- o resumo nasce com date=19/09). Não existe endpoint de "atualizar" no backend (só
// salvar/remover -- ver salvarDiarioKcalGoogle()/removerDiarioKcalGoogle() no Code.gs), então a correção
// é feita como remover o registro antigo e recriar um novo, idêntico, só que com a data certa e um id
// novo -- mesmo padrão usado em acaoEditarDataRefeicao(). Logo depois, já recalcula o registro (ver
// recalcularDiarioKcalRegistro()) com as refeições e treinos da data corrigida, pra também resolver de
// uma vez o caso comum de o resumo ter sido calculado com os treinos do dia errado.
function acaoEditarDataDiarioKcal(id, novaData) {
  if (!novaData) { toastError("Selecione uma data."); return; }
  if (novaData > today()) { toastError("A data não pode ser no futuro."); return; }
  const registro = state.diarioKcal.find((r) => r.id === id);
  if (!registro) return;
  if (registro.date === novaData) { state.diarioKcalEditandoDataId = null; render(); return; }
  if (state.diarioKcal.some((r) => r.id !== id && r.date === novaData)) {
    toastError("Já existe um registro encerrado em " + dateLabel(novaData) + ". Remova-o antes de mover este registro para essa data.");
    return;
  }
  const movido = Object.assign({}, registro, { id: Date.now(), date: novaData });
  const corrigido = recalcularDiarioKcalRegistro(movido);
  state.diarioKcal = state.diarioKcal.filter((r) => r.id !== id).concat([corrigido]);
  persistDiarioKcal();
  if (state.account) {
    enviarComFila("removerDiarioKcalGoogle", [state.usuario.email, id]);
    enviarComFila("salvarDiarioKcalGoogle", [state.usuario.email, corrigido]);
  }
  state.diarioKcalEditandoDataId = null;
  toastSuccess("Data corrigida para " + dateLabel(novaData) + " -- refeições e treinos daquele dia recalculados.");
  render();
}
// Remove um registro (dia) já encerrado no Diário de Kcal -- ver diarioKcalRegistroTemplate().
function acaoRemoverDiarioKcal(id) {
  state.diarioKcal = state.diarioKcal.filter((r) => r.id !== id);
  persistDiarioKcal();
  if (state.account) enviarComFila("removerDiarioKcalGoogle", [state.usuario.email, id]);
  render();
}
function acaoAtualizarMeta(key, value) {
  state.goals = Object.assign({}, state.goals, { [key]: Math.max(0, Number(value) || 0) });
  persistGoals();
  if (state.account) enviarComFila("atualizarMetasGoogle", [state.usuario.email, state.goals, state.altura]);
  render();
}
// Só guarda o objetivo escolhido -- quem realmente usa esse valor pra sugerir calorias e proteína é o
// botão "Calcular macros automaticamente" (acaoCalcularMacrosAutomaticos()), não essa função.
function acaoAtualizarObjetivo(value) {
  state.goals = Object.assign({}, state.goals, { objetivo: value });
  persistGoals();
  if (state.account) enviarComFila("atualizarMetasGoogle", [state.usuario.email, state.goals, state.altura]);
  render();
}
function acaoCalcularMacrosAutomaticos() {
  // Lê o valor direto do campo de calorias no DOM, em vez de confiar só em state.goals.calories: o
  // botão usa onmousedown com preventDefault (ver comentário no template) pra não perder o clique
  // quando a pessoa acabou de digitar a meta de kcal e clica em "Calcular" sem clicar em outro lugar
  // antes -- mas isso também significa que o campo de calorias pode ainda não ter disparado seu
  // onchange (que só roda ao perder o foco), então o valor mais atual só existe no próprio input.
  const inputCalorias = document.getElementById("goal-input-calories");
  let calorias = inputCalorias && inputCalorias.value !== "" ? Number(inputCalorias.value) : state.goals.calories;
  const objetivo = state.goals.objetivo || "";
  const ultimoCalo = ultimaCalorimetria();
  // Quando a pessoa tem um objetivo escolhido E uma calorimetria (TMB/GET) registrada, a meta de
  // calorias sugerida vem do objetivo (ver OBJETIVOS_META), substituindo o valor do campo -- é assim
  // que o objetivo "também influencia os cálculos" (não só a proteína). Sem objetivo ou sem
  // calorimetria, mantemos o comportamento anterior: usa o valor que já está no campo de calorias.
  const caloriasSugeridasPorObjetivo = (objetivo && ultimoCalo && ultimoCalo.get)
    ? sugerirCaloriasPorObjetivo(ultimoCalo.get, objetivo, ultimoCalo.tmb)
    : null;
  if (caloriasSugeridasPorObjetivo) calorias = caloriasSugeridasPorObjetivo;
  if (!calorias) { toastError("Informe a meta de calorias antes de calcular os macronutrientes."); return; }
  // Se o campo de calorias ainda estiver focado (a pessoa digitou e clicou direto em "Calcular", sem
  // clicar em outro lugar antes), tiramos o foco dele aqui, de propósito, ANTES de qualquer render()
  // nosso. Se não fizermos isso, é o próprio render() logo abaixo (via innerHTML) que acaba removendo
  // esse input focado da tela -- e remover um elemento focado dispara um blur "por conta própria" bem
  // no meio da reconstrução do innerHTML, o que dispara o onchange dele (acaoAtualizarMeta) e chama um
  // SEGUNDO render() encaixado dentro do primeiro, ainda em andamento. Dois innerHTML acontecendo um
  // dentro do outro deixa o navegador confuso sobre quais nós ainda existem, e ele lança o erro "The
  // node to be removed is no longer a child of this node". Chamando blur() manualmente agora, o
  // onchange roda (e o render() dele termina) antes da gente sequer começar a montar os macros --
  // então o nosso próprio render(), lá embaixo, já não está mais aninhado dentro de nenhum outro.
  if (inputCalorias) inputCalorias.blur();
  const ultimoBio = ultimaBioimpedancia();
  const pesoKg = ultimoBio && ultimoBio.peso ? Number(ultimoBio.peso) : null;
  const macros = calcularMacrosAutomaticos(calorias, pesoKg, objetivo);
  if (!macros) return;
  // Também grava a própria meta de calorias (lida do input, ou sugerida a partir do objetivo) -- não
  // só os macros calculados a partir dela -- senão, se a pessoa não tiver saído do campo antes de
  // clicar, o valor digitado ficaria só visível no input, sem entrar de fato em state.goals.calories
  // nem ser sincronizado.
  state.goals = Object.assign({}, state.goals, { calories: calorias }, macros);
  persistGoals();
  if (state.account) enviarComFila("atualizarMetasGoogle", [state.usuario.email, state.goals, state.altura]);
  const origemCalorias = caloriasSugeridasPorObjetivo
    ? " A meta de " + formatNumber(calorias) + " kcal foi sugerida a partir do seu GET e do objetivo escolhido (" + OBJETIVOS_META[objetivo].label + ")."
    : "";
  toastSuccess((pesoKg
    ? "Macros calculados com base na meta de " + formatNumber(calorias) + " kcal e no seu peso de " + formatNumber(pesoKg, 1) + " kg."
    : "Macros calculados com base na meta de " + formatNumber(calorias) + " kcal (sem peso registrado na Bioimpedância, usamos 20% das calorias pra proteína).")
    + origemCalorias + " Você ainda pode ajustar cada valor manualmente.");
  render();
}

function getOtpValue() {
  return ["otp-0", "otp-1", "otp-2", "otp-3", "otp-4", "otp-5"].map((id) => (document.getElementById(id) || {}).value || "").join("");
}
function submitConfirmar() { acaoConfirmarEmail(getOtpValue()); }
function otpInput(el, index) {
  el.value = el.value.replace(/[^0-9]/g, "").slice(-1);
  if (el.value && index < 5) { const next = document.getElementById("otp-" + (index + 1)); if (next) next.focus(); }
  if (getOtpValue().length === 6) submitConfirmar();
}
function otpKeydown(event, index) {
  if (event.key === "Backspace" && !event.target.value && index > 0) { const prev = document.getElementById("otp-" + (index - 1)); if (prev) prev.focus(); }
  if (event.key === "Enter") submitConfirmar();
}

  const novaSenhaEl = document.getElementById("perfil-nova-senha");

}

// Cards da aba "Macronutrientes" -- calorias NÃO entra aqui: calorias é a unidade de energia, não um
// macronutriente (proteína, carboidrato, gordura e fibra são os macronutrientes de fato). O consumo/
// meta de calorias já aparece no card "Seu resumo de hoje", no topo da aba Nutrição -- a pedido do
// usuário, não duplicado aqui. nutrientMeta.calories continua existindo (usado em outros lugares: Metas
// do dia, chips de detalhamento da refeição), só não entra neste grid.
function nutrientCardsTemplate() {
  const consumed = consumedToday();
  return Object.keys(nutrientMeta).filter((key) => key !== "calories").map((key) => {
    const meta = nutrientMeta[key];
    const over = consumed[key] > state.goals[key];
    const digits = 1;
    return '' +
      '<div class="nutrient-card"><div class="nutrient-card-head">' +
        '<div class="nutrient-card-left"><div class="nutrient-icon" style="background:' + meta.soft + ";color:" + meta.color + '">' + icon(meta.icon) + "</div>" +
        '<span class="nutrient-name">' + meta.label + "</span>" + nutrientInfoBtnTemplate(key, meta.label) + "</div>" +
        '<span class="nutrient-unit">' + meta.unit + "</span>" +
      "</div>" +
      '<div class="nutrient-stats"><div><div class="stat-label">Consumido</div><div class="stat-value-row"><span class="stat-value">' + formatNumber(consumed[key], digits) + '</span><span class="stat-unit">' + meta.unit + "</span></div></div>" +
      '<div class="stat-goal"><div class="stat-label">Meta diária</div><div class="stat-goal-value">' + formatNumber(state.goals[key], digits) + " " + meta.unit + "</div></div></div>" +
      '<div class="progress-track"><div class="progress-fill" style="width:' + pct(consumed[key], state.goals[key]) + "%;background:" + (over ? "#d76c54" : meta.color) + '"></div></div>' +
      '<div class="nutrient-delta" style="color:' + (over ? "#c35e4b" : "#789087") + '">' + icon(over ? "arrowup" : "arrowdown") + " " +
      (over ? formatNumber(consumed[key] - state.goals[key], digits) + " " + meta.unit + " acima da meta" : formatNumber(Math.max(0, remainingToday()[key]), digits) + " " + meta.unit + " restantes") +
      "</div></div>";
  }).join("");
}

function micronutrientCardsTemplate() {
  const consumed = consumedToday();
  return Object.keys(micronutrientMeta).map((key) => {
    const meta = micronutrientMeta[key];
    const goal = MICRO_GOALS[key];
    const valor = consumed[key] || 0;
    const over = valor > goal;
    const digits = meta.unit === "mg" && goal >= 100 ? 0 : 1;
    // Vitamina D é a única exibida em mcg/UI ao mesmo tempo (ver formatVitaminaDComUI()) -- as demais
    // continuam só no seu "unit" normal (mg/mcg).
    const ehVitD = key === "vitD";
    const textoConsumido = ehVitD ? formatVitaminaDComUI(valor, digits) : formatNumber(valor, digits) + " " + meta.unit;
    const textoGoal = ehVitD ? formatVitaminaDComUI(goal, digits) : formatNumber(goal, digits) + " " + meta.unit;
    const textoDelta = over
      ? (ehVitD ? formatVitaminaDComUI(valor - goal, digits) : formatNumber(valor - goal, digits) + " " + meta.unit) + " acima da referência"
      : (ehVitD ? formatVitaminaDComUI(Math.max(0, goal - valor), digits) : formatNumber(Math.max(0, goal - valor), digits) + " " + meta.unit) + " restantes";
    return '' +
      '<div class="nutrient-card"><div class="nutrient-card-head">' +
        '<div class="nutrient-card-left"><div class="nutrient-icon" style="background:' + meta.soft + ";color:" + meta.color + '">' + icon(meta.icon) + "</div>" +
        '<span class="nutrient-name">' + meta.label + "</span>" + nutrientInfoBtnTemplate(key, meta.label) + "</div>" +
        '<span class="nutrient-unit">' + meta.unit + (ehVitD ? " / UI" : "") + "</span>" +
      "</div>" +
      '<div class="nutrient-stats"><div><div class="stat-label">Consumido</div><div class="stat-value-row"><span class="stat-value">' +
        (ehVitD ? textoConsumido + "</span>" : formatNumber(valor, digits) + '</span><span class="stat-unit">' + meta.unit + "</span>") +
      "</div></div>" +
      '<div class="stat-goal"><div class="stat-label">Referência diária</div><div class="stat-goal-value">' + textoGoal + "</div></div></div>" +
      '<div class="progress-track"><div class="progress-fill" style="width:' + pct(valor, goal) + "%;background:" + (over ? "#d76c54" : meta.color) + '"></div></div>' +
      '<div class="nutrient-delta" style="color:' + (over ? "#c35e4b" : "#789087") + '">' + icon(over ? "arrowup" : "arrowdown") + " " + textoDelta +
      "</div></div>";
  }).join("");
}

// Campos do formulário de "Exposição Solar" -- substitui a textarea de descrição + "Calcular refeição"
// quando state.mealTipo === "Exposição Solar" (ver a montagem condicional em nutricaoTabTemplate()).
// Exige tipo de pele cadastrado no perfil (ver TIPOS_PELE) porque é o fator isolado mais importante pra
// estimar a produção de vitamina D -- sem ele, o botão de calcular fica desabilitado e mostra um aviso
// com atalho direto pra tela de editar perfil.
function exposicaoSolarCamposTemplate() {
  const semTipoPele = !(state.usuario && state.usuario.tipoPele);
  const status = state.exposicaoLocalizacaoStatus;
  const usandoUV = status === "ok" && state.exposicaoUVHorario;
  const buscando = status === "buscando";

  let blocoLocalizacao;
  if (buscando) {
    blocoLocalizacao = '<p class="exposicao-solar-localizacao exposicao-solar-localizacao-buscando">' + icon("sun") + " Obtendo sua localização e o índice UV de hoje...</p>";
  } else if (usandoUV) {
    blocoLocalizacao = '<p class="exposicao-solar-localizacao exposicao-solar-localizacao-ok">' + icon("check") + ' Usando o índice UV real e a condição do tempo (nuvens) da sua localização de hoje -- detectados automaticamente. <button type="button" class="exposicao-solar-link" onclick="acaoUsarCeuManual()">Prefiro informar o céu manualmente</button></p>';
  } else {
    const avisos = { negado: "Localização não autorizada.", indisponivel: "Localização indisponível neste dispositivo.", erro: "Não consegui buscar o índice UV agora (sem internet?)." };
    const aviso = avisos[status] || "";
    blocoLocalizacao = '<p class="exposicao-solar-localizacao' + (aviso ? " exposicao-solar-localizacao-aviso" : "") + '">' +
      (aviso ? icon("help") + " " + aviso + " Informe o céu manualmente abaixo, ou " : "") +
      '<button type="button" class="exposicao-solar-link" onclick="acaoObterLocalizacaoExposicao()">' + (aviso ? "tente de novo" : "usar minha localização pra um cálculo mais preciso") + "</button>." +
      "</p>";
  }

  return '' +
    (semTipoPele ?
      '<p class="exposicao-solar-aviso">' + icon("help") + ' Cadastre seu <button type="button" class="exposicao-solar-link" onclick="acaoAbrirEditarPerfil()">tipo de pele no perfil</button> pra calcular -- é o que mais influencia a velocidade de produção de vitamina D pela pele.</p>'
      : "") +
    '<div class="meal-form-row">' +
      '<div><label class="meal-form-label">Início da exposição</label><input id="exposicao-inicio" type="time" class="meal-input" value="' + esc(state.exposicaoInicio) + '"/></div>' +
      '<div><label class="meal-form-label">Fim da exposição</label><input id="exposicao-fim" type="time" class="meal-input" value="' + esc(state.exposicaoFim) + '"/></div>' +
    "</div>" +
    blocoLocalizacao +
    (!usandoUV && !buscando ?
      '<div><label class="meal-form-label">Como estava o céu?</label>' +
        '<select id="exposicao-ceu" class="meal-select">' +
          '<option value="">Selecione...</option>' +
          Object.keys(CEU_LABEL).map((c) => '<option value="' + c + '"' + (state.exposicaoCeu === c ? " selected" : "") + ">" + esc(CEU_LABEL[c]) + "</option>").join("") +
        "</select></div>"
      : "") +
    '<button class="btn-ghost-light" ' + (semTipoPele || buscando ? "disabled" : "") + ' onclick="acaoCalcularExposicaoSolar()">' + icon("sun") + " Calcular exposição solar</button>";
}
// Resultado do cálculo de vitamina D por exposição solar -- no lugar do preview genérico de alimentos
// (mealPreviewTemplate()), que é focado em kcal/macros, algo que não existe numa exposição solar (só a
// vitamina D estimada).
function exposicaoSolarPreviewTemplate() {
  if (!state.preview.length) return "";

    '<div class="meal-preview"><div class="meal-preview-head"><span>Vitamina D estimada</span>' + icon("check") + "</div>" +
    '<div class="exposicao-solar-resultado"><span class="exposicao-solar-valor">' + formatNumber(item.values.vitD, 1) + '</span> <span class="exposicao-solar-unidade">mcg / ' + formatNumber(item.values.vitD * VITAMINA_D_MCG_PARA_UI, 0) + ' UI de vitamina D</span></div>' +
    '<p class="exposicao-solar-detalhe">' + esc(item.amount) + "</p>" +
