<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<meta name="theme-color" content="#1c4d3e" />
<meta name="description" content="Acompanhe suas metas diárias de calorias e nutrientes com o NutriTrack." />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="NutriTrack" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" href="./icon-192.png" type="image/png" />
<link rel="apple-touch-icon" href="./icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet" />
<script src="https://accounts.google.com/gsi/client" async defer></script>
<title>NutriTrack — seu dia, no seu ritmo</title>
<style>
:root{
  --radius: 0.75rem;
  --bg: #f8f7f2;
  --fg: #18352d;
  --card: #ffffff;
  --primary: #1c4d3e;
  --primary-dark: #28634f;
  --primary-foreground: #ffffff;
  --muted: #71857e;
  --border: #e2e9df;
  --accent: #d3e9b9;
}
*{ box-sizing: border-box; }
html{ min-width: 320px; background: var(--bg); }
body{
  margin: 0; min-width: 320px; background: var(--bg); color: var(--fg);
  font-family: 'DM Sans', 'Segoe UI', Arial, sans-serif; -webkit-font-smoothing: antialiased;
  line-height: 1.45;
}
button, input, textarea{ font: inherit; color: inherit; }
button{ cursor: pointer; border: none; background: none; padding: 0; }
input, textarea{ border-radius: var(--radius); }
.font-display{ font-family: 'Fraunces', Georgia, serif; }
a{ color: inherit; }
svg{ display: block; }
.icon{ width: 1em; height: 1em; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
.spin{ animation: spin 0.9s linear infinite; }
@keyframes spin{ to{ transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce){ *,*::before,*::after{ animation-duration: 1ms !important; transition-duration: 1ms !important; } }

/* ---------- telas de autenticação (login / cadastro / confirmar) ---------- */
.auth-page{ display:flex; min-height:100vh; align-items:center; justify-content:center; background:var(--bg); padding:40px 20px; color:var(--fg); }
.auth-box{ width:100%; max-width:400px; }
.brand-row{ margin-bottom:32px; display:flex; align-items:center; justify-content:center; gap:12px; }
.brand-icon{ display:flex; height:44px; width:44px; align-items:center; justify-content:center; border-radius:16px; background:var(--primary); color:#e7f5c7; box-shadow:0 8px 24px rgba(28,77,62,0.18); font-size:21px; }
.brand-title{ font-size:20px; font-weight:600; letter-spacing:-0.03em; }
.brand-title span{ color:#78a55b; }
.brand-sub{ font-size:11px; font-weight:500; text-transform:uppercase; letter-spacing:0.16em; color:#779087; }
.auth-card{ border-radius:28px; border:1px solid var(--border); background:var(--card); padding:28px; box-shadow:0 10px 28px rgba(43,73,53,0.06); }
.auth-card h1{ margin:0; font-size:24px; font-weight:600; color:#1b3f34; }
.auth-card .sub{ margin:4px 0 0; font-size:14px; color:var(--muted); }
.form-stack{ margin-top:24px; display:flex; flex-direction:column; gap:12px; }
.field-label{ display:block; margin-bottom:6px; font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:0.1em; color:#9aa9a1; }
.field-input{ width:100%; border-radius:12px; border:1px solid #dce5db; background:#f7f9f5; padding:12px 14px; font-size:14px; color:#18352d; outline:none; }
.medida-nota-textarea{ resize:none; line-height:1.5; font-family:inherit; }
.field-input::placeholder{ color:#9aa9a1; }
.field-input:focus{ border-color:#8fbf78; }
.btn-primary{ margin-top:8px; display:flex; width:100%; align-items:center; justify-content:center; gap:8px; border-radius:12px; background:var(--primary); padding:12px 16px; font-size:14px; font-weight:600; color:#fff; box-shadow:0 8px 20px rgba(28,77,62,0.15); transition:transform .15s, opacity .15s; }
.btn-primary:hover:not(:disabled){ transform:translateY(-2px); }
.btn-primary:disabled{ opacity:0.6; cursor:default; }
.auth-footer{ margin-top:20px; text-align:center; font-size:14px; color:var(--muted); }
.link-btn{ font-weight:600; color:#3d6355; text-decoration:underline; text-underline-offset:2px; }
.link-btn:hover{ color:var(--primary); }
.link-btn-block{ display:block; width:100%; margin-top:12px; text-align:center; font-size:14px; font-weight:500; color:#557268; text-decoration:underline; text-underline-offset:2px; }
.link-btn-block:hover{ color:var(--primary); }
.link-btn-block:disabled{ opacity:0.6; }
.otp-row{ margin-top:24px; display:flex; justify-content:center; gap:8px; }
.otp-box{ height:48px; width:42px; border-radius:12px; border:1px solid #dce5db; background:#f7f9f5; text-align:center; font-size:18px; font-weight:600; color:#18352d; outline:none; }
.otp-box:focus{ border-color:#8fbf78; box-shadow:0 0 0 3px #c5dfa9; }

/* ---------- sidebar ---------- */
.app-shell{ display:flex; min-height:100vh; flex-direction:column; background:var(--bg); color:var(--fg); }
.hamburger-btn{ position:fixed; top:16px; left:16px; z-index:250; display:flex; height:40px; width:40px; align-items:center; justify-content:center; border-radius:999px; border:1px solid var(--border); background:#fff; box-shadow:0 8px 20px rgba(43,73,53,0.1); cursor:pointer; }
.hamburger-btn span{ display:block; width:18px; height:2px; background:#31564a; position:relative; }
.hamburger-btn span::before, .hamburger-btn span::after{ content:''; position:absolute; left:0; width:18px; height:2px; background:#31564a; }
.hamburger-btn span::before{ top:-6px; }
.hamburger-btn span::after{ top:6px; }

.sidebar-overlay{ position:fixed; inset:0; background:rgba(15,32,26,.45); z-index:300; display:none; }
.sidebar-overlay.open{ display:block; }
.sidebar-panel{ position:fixed; top:0; left:0; bottom:0; width:84%; max-width:320px; background:#fff; box-shadow:6px 0 24px rgba(0,0,0,.18); padding:26px 22px; transform:translateX(-100%); transition:transform .22s ease-out; display:flex; flex-direction:column; gap:20px; overflow-y:auto; }
.sidebar-overlay.open .sidebar-panel{ transform:translateX(0); }
.sidebar-panel .brand-row{ margin-bottom:0; justify-content:flex-start; }
.sidebar-close{ align-self:flex-end; background:none; border:none; font-size:0; color:var(--muted); cursor:pointer; padding:4px; margin:-4px -4px 0 0; }
.sidebar-close .icon{ width:20px; height:20px; }

.avatar-wrap{ display:flex; flex-direction:column; align-items:center; margin-top:4px; }
.avatar-circle{ width:84px; height:84px; border-radius:50%; background:#eef6e4; border:2px dashed var(--primary); display:flex; align-items:center; justify-content:center; color:var(--primary); font-size:28px; font-weight:700; overflow:hidden; cursor:pointer; position:relative; flex-shrink:0; }
.avatar-circle img{ width:100%; height:100%; object-fit:cover; }
.sidebar-greeting{ margin-top:12px; text-align:center; }
.sidebar-greeting-ola{ margin:0; font-family:'Fraunces',serif; font-size:17px; font-weight:600; color:#1b3f34; }
.sidebar-greeting-idade{ margin:4px 0 0; font-size:12px; color:#7c8c86; }
.avatar-cam-badge{ position:absolute; bottom:0; right:0; background:var(--primary); color:#fff; width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; border:2px solid #fff; }
.avatar-cam-badge .icon{ width:13px; height:13px; }
.side-card{ border-radius:16px; background:#f7f9f5; padding:16px; }
.side-card-border{ border-radius:16px; border:1px solid #dce8dc; padding:16px; }
.side-label{ font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:0.14em; color:#9aa9a1; }
.side-name{ margin-top:4px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:14px; font-weight:600; color:#31564a; }
.side-email{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:12px; color:#7c8c86; }
.side-text{ margin-top:8px; font-size:12px; color:#7c8c86; }
.btn-outline{ margin-top:12px; display:flex; width:100%; align-items:center; justify-content:center; gap:8px; border-radius:999px; border:1px solid #dce5db; background:#fff; padding:8px 12px; font-size:12px; font-weight:600; color:#557268; transition:background .15s; }
.btn-outline:hover{ background:#f0f3ee; }
.btn-primary-pill{ margin-top:12px; display:flex; width:100%; align-items:center; justify-content:center; gap:8px; border-radius:999px; background:var(--primary); padding:10px 12px; font-size:12px; font-weight:600; color:#fff; box-shadow:0 8px 20px rgba(28,77,62,0.15); transition:transform .15s, opacity .15s; }
.btn-primary-pill:hover:not(:disabled){ transform:translateY(-2px); }
.btn-primary-pill:disabled{ opacity:0.6; }
.google-connected{ margin-top:8px; display:flex; align-items:center; gap:8px; font-size:14px; font-weight:500; color:#4b7048; }
.google-connected span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.btn-danger-outline{ margin-top:auto; display:flex; align-items:center; justify-content:center; gap:8px; border-radius:999px; border:1px solid #f0d9d2; background:#fdf4f1; padding:10px 12px; font-size:12px; font-weight:600; color:#c35e4b; transition:background .15s; }
.btn-danger-outline:hover{ background:#fbe9e3; }

/* ---------- tela bloqueada (sem Google) ---------- */
.locked-page{ display:flex; min-height:100vh; flex-direction:column; align-items:center; justify-content:center; padding:16px; text-align:center; }
.locked-icon{ margin-bottom:20px; display:flex; height:56px; width:56px; align-items:center; justify-content:center; border-radius:999px; background:#eef6e4; color:#4b7048; font-size:24px; }
.locked-title{ margin:0; font-size:26px; font-weight:600; color:#1b3f34; }
.locked-desc{ margin-top:12px; max-width:380px; font-size:14px; line-height:1.7; color:var(--muted); }
.btn-primary-lg{ margin-top:24px; display:flex; align-items:center; gap:8px; border-radius:999px; background:var(--primary); padding:12px 20px; font-size:14px; font-weight:600; color:#fff; box-shadow:0 8px 20px rgba(28,77,62,0.15); transition:transform .15s, opacity .15s; }
.btn-primary-lg:hover:not(:disabled){ transform:translateY(-2px); }
.btn-primary-lg:disabled{ opacity:0.6; }

/* ---------- home ---------- */
.home-content{ flex:1; min-width:0; }
.home-inner{ margin:0 auto; max-width:1200px; padding:0 20px 56px; }
@media (min-width: 640px){ .home-inner{ padding-left:32px; padding-right:32px; } }
@media (min-width: 1024px){ .home-inner{ padding-left:48px; padding-right:48px; } }
.home-header{ display:flex; align-items:center; justify-content:flex-end; gap:8px; padding:24px 0; }
@media (min-width: 640px){ .home-header{ gap:12px; } }
@media (min-width: 1024px){ .home-header{ padding:32px 0; } }
.btn-outline-pill{ display:none; align-items:center; gap:8px; border-radius:999px; border:1px solid #dce5db; background:rgba(255,255,255,.7); padding:10px 16px; font-size:14px; font-weight:500; color:#557268; transition:background .15s; }
.btn-outline-pill:hover{ background:#fff; }
@media (min-width: 640px){ .btn-outline-pill{ display:flex; } }
.icon-btn-outline{ display:flex; height:40px; width:40px; align-items:center; justify-content:center; border-radius:999px; border:1px solid #dce5db; background:rgba(255,255,255,.7); color:#557268; }
@media (min-width: 640px){ .icon-btn-outline{ display:none; } }
.btn-primary-pill-lg{ display:flex; align-items:center; gap:8px; border-radius:999px; background:var(--primary); padding:10px 16px; font-size:14px; font-weight:600; color:#fff; box-shadow:0 8px 20px rgba(28,77,62,0.15); transition:transform .15s; }
.btn-primary-pill-lg:hover{ transform:translateY(-2px); }
.btn-primary-pill-lg .label{ display:none; }
@media (min-width: 640px){ .btn-primary-pill-lg .label{ display:inline; } }

.hero{ margin-bottom:32px; display:grid; gap:28px; }
@media (min-width: 1024px){ .hero{ grid-template-columns:1.2fr 0.8fr; align-items:end; } }
.hero-date{ margin-bottom:16px; display:flex; align-items:center; gap:8px; font-size:14px; font-weight:500; color:#789087; }
.hero-title{ margin:0; max-width:640px; font-family:'Fraunces',serif; font-size:clamp(2.4rem,6vw,5.3rem); font-weight:500; line-height:0.96; letter-spacing:-0.065em; color:#1b3f34; }
.hero-title em{ font-style:italic; color:#77a45c; }
.hero-sub{ margin-top:20px; max-width:480px; font-size:15px; line-height:1.75; color:var(--muted); }
.summary-card{ position:relative; overflow:hidden; border-radius:28px; background:#e6f1dc; padding:24px; }
@media (min-width: 640px){ .summary-card{ padding:28px; } }
.summary-ring{ position:absolute; right:-32px; top:-40px; height:144px; width:144px; border-radius:999px; border:18px solid rgba(205,228,189,.8); }
.summary-edit-btn{ position:absolute; top:16px; right:16px; z-index:1; display:flex; height:34px; width:34px; align-items:center; justify-content:center; border-radius:999px; background:rgba(255,255,255,.75); color:#4b7048; transition:background .15s; }
.summary-edit-btn:hover{ background:#fff; }
@media (min-width: 640px){ .summary-edit-btn{ top:20px; right:20px; } }
.summary-inner{ position:relative; }
.summary-label{ display:flex; align-items:center; gap:8px; font-size:14px; font-weight:600; color:#587a50; }
.summary-stats{ margin-top:20px; display:flex; align-items:flex-end; justify-content:space-between; gap:20px; }
.summary-remaining-value{ font-family:'Fraunces',serif; font-size:36px; font-weight:600; letter-spacing:-0.06em; color:#1d4b3d; }
.summary-remaining-label{ margin-top:4px; font-size:14px; color:#6f8d67; }
.summary-consumed{ text-align:right; }
.summary-consumed-value{ font-size:24px; font-weight:600; letter-spacing:-0.04em; color:#1d4b3d; }
.summary-consumed-label{ margin-top:4px; font-size:14px; color:#6f8d67; }
.progress-track-light{ margin-top:20px; height:8px; overflow:hidden; border-radius:999px; background:rgba(255,255,255,.7); }
.progress-fill-light{ height:100%; border-radius:999px; background:#6f9b59; transition:width .3s; }

.goals-panel{ margin-bottom:28px; border-radius:24px; border:1px solid #dce8dc; background:#fff; padding:20px; box-shadow:0 12px 35px rgba(43,73,53,0.06); }
.goals-panel-head{ margin-bottom:16px; display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
.goals-panel-head h2{ margin:0; font-family:'Fraunces',serif; font-size:20px; font-weight:600; }
.goals-panel-head p{ margin:4px 0 0; font-size:14px; color:#7c8c86; }
.icon-btn-ghost{ border-radius:999px; padding:8px; color:#81918a; }
.icon-btn-ghost:hover{ background:#f3f6f1; }
.goals-calorimetria-ref{ margin-bottom:16px; display:flex; align-items:flex-start; gap:10px; border-radius:16px; background:#fff3ec; padding:14px 16px; font-size:13px; line-height:1.6; color:#7a5a45; }
.goals-calorimetria-ref .icon{ margin-top:2px; flex-shrink:0; color:#d5824f; }
.goals-calorimetria-ref p{ margin:0; }
.goals-calorimetria-ref strong{ color:#5c4634; }
.goals-calorimetria-ref-data{ color:#9c8067; }
.goals-calorimetria-ref-vazio{ background:#f7f9f5; color:#5c6b62; }
.goals-calorimetria-ref-vazio .icon{ color:#8a9c93; }
.goals-calorimetria-ref-link{ font-weight:600; color:#4b7048; text-decoration:underline; text-underline-offset:2px; }
.goals-auto-calc{ margin-bottom:16px; }
.goals-auto-calc-btn{ display:flex; width:100%; align-items:center; justify-content:center; gap:8px; border-radius:12px; background:var(--primary); padding:12px 16px; font-size:14px; font-weight:600; color:#fff; transition:opacity .15s; }
.goals-auto-calc-btn:hover{ opacity:.9; }
.goals-auto-calc-note{ margin:8px 0 0; font-size:12px; line-height:1.6; color:#8a9c93; }
.goals-auto-calc-detalhes{ margin-top:8px; }
.goals-auto-calc-detalhes summary{ cursor:pointer; font-size:12px; font-weight:600; color:#4b7048; list-style:none; }
.goals-auto-calc-detalhes summary::-webkit-details-marker{ display:none; }
.goals-auto-calc-detalhes summary::before{ content:"▸ "; }
.goals-auto-calc-detalhes[open] summary::before{ content:"▾ "; }
.goals-auto-calc-detalhes-corpo{ margin-top:10px; border-radius:14px; background:#f7f9f5; padding:14px 16px; font-size:12px; line-height:1.7; color:#5c6b62; }
.goals-auto-calc-detalhes-corpo p{ margin:0 0 8px; }
.goals-auto-calc-detalhes-corpo p:last-child{ margin-bottom:0; }
.goals-auto-calc-detalhes-corpo strong{ color:#31564a; }
.goals-auto-calc-fontes-titulo{ margin-top:12px !important; font-weight:600; color:#31564a; }
.goals-auto-calc-detalhes-corpo ul{ margin:0 0 8px; padding-left:18px; }
.goals-auto-calc-detalhes-corpo li{ margin-bottom:8px; }
.goals-auto-calc-detalhes-corpo li:last-child{ margin-bottom:0; }
.goals-auto-calc-detalhes-corpo a{ color:#4b7048; text-decoration:underline; text-underline-offset:2px; }
.goals-auto-calc-aviso{ font-style:italic; color:#8a9c93; }
.goals-grid{ display:grid; gap:12px; grid-template-columns:1fr; }
@media (min-width: 640px){ .goals-grid{ grid-template-columns:repeat(2,1fr); } }
@media (min-width: 1024px){ .goals-grid{ grid-template-columns:repeat(5,1fr); } }
.goal-field{ border-radius:16px; background:#f7f9f5; padding:14px; }
.goal-field-head{ margin-bottom:8px; display:flex; justify-content:space-between; font-size:12px; font-weight:600; color:#688077; }
.goal-field-input{ width:100%; background:transparent; border:none; font-family:'Fraunces',serif; font-size:24px; font-weight:600; color:#214c3d; outline:none; }

.nutrient-tabs{ margin-bottom:16px; display:flex; gap:8px; border-bottom:1px solid #e5e9e1; }
.nutrient-tab{ padding:10px 4px; margin-bottom:-1px; border-bottom:2px solid transparent; font-size:14px; font-weight:600; color:#9aa9a1; }
.nutrient-tab.active{ color:#1b3f34; border-bottom-color:var(--primary); }
.nutrient-grid{ margin-bottom:32px; display:grid; gap:16px; grid-template-columns:1fr; }
@media (min-width: 640px){ .nutrient-grid{ grid-template-columns:repeat(2,1fr); } }
@media (min-width: 1280px){ .nutrient-grid{ grid-template-columns:repeat(5,1fr); } }
.nutrient-grid-micro{ grid-template-columns:1fr; }
@media (min-width: 640px){ .nutrient-grid-micro{ grid-template-columns:repeat(2,1fr); } }
@media (min-width: 1280px){ .nutrient-grid-micro{ grid-template-columns:repeat(4,1fr); } }
.nutrient-card{ border-radius:22px; border:1px solid #e5e9e1; background:#fff; padding:20px; box-shadow:0 10px 28px rgba(43,73,53,0.045); }
.nutrient-card-head{ display:flex; align-items:center; justify-content:space-between; }
.nutrient-card-left{ display:flex; align-items:center; gap:10px; }
.nutrient-icon{ display:flex; height:36px; width:36px; align-items:center; justify-content:center; border-radius:12px; font-size:17px; }
.nutrient-name{ font-size:14px; font-weight:600; color:#31564a; }
.nutrient-unit{ font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:0.14em; color:#9aa9a1; }
.nutrient-stats{ margin-top:16px; display:flex; align-items:flex-end; justify-content:space-between; gap:8px; }
.stat-label{ font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:0.14em; color:#9aa9a1; }
.stat-value-row{ margin-top:2px; display:flex; align-items:baseline; gap:4px; }
.stat-value{ font-family:'Fraunces',serif; font-size:28px; font-weight:600; color:#214c3d; }
.stat-unit{ font-size:12px; color:#93a199; }
.stat-goal{ text-align:right; }
.stat-goal-value{ margin-top:4px; font-size:14px; font-weight:600; color:#6e857c; }
.progress-track{ margin-top:12px; height:6px; overflow:hidden; border-radius:999px; background:#edf1ec; }
.progress-fill{ height:100%; border-radius:999px; transition:width .3s; }
.nutrient-delta{ margin-top:8px; display:flex; align-items:center; gap:4px; font-size:12px; font-weight:500; }

.dashboard-grid{ display:grid; gap:24px; grid-template-columns:1fr; }
@media (min-width: 1280px){ .dashboard-grid{ grid-template-columns:minmax(0,1fr) 410px; } }
.meal-card{ border-radius:26px; background:var(--primary); padding:20px; color:#fff; box-shadow:0 18px 40px rgba(28,77,62,0.16); }
@media (min-width: 640px){ .meal-card{ padding:28px; } }
.meal-card-eyebrow{ display:flex; align-items:center; gap:8px; font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:0.15em; color:#a9c9a1; }
.meal-card h2{ margin:8px 0 0; font-family:'Fraunces',serif; font-size:24px; font-weight:600; }
.meal-card-desc{ margin-top:8px; font-size:14px; line-height:1.4; color:#b5cfc1; }
.meal-form{ margin-top:24px; display:flex; flex-direction:column; gap:12px; }
.meal-input, .meal-textarea, .meal-select{ width:100%; border-radius:12px; border:1px solid rgba(255,255,255,.1); background:rgba(255,255,255,.09); padding:12px 14px; font-size:14px; color:#fff; outline:none; }
.meal-input::placeholder, .meal-textarea::placeholder{ color:#9fb5aa; }

async function chamarApi(acao, dados) {
  // Usamos GET (dados na própria URL) em vez de POST: o Apps Script devolve a resposta de um jeito

  const payload = JSON.stringify(Object.assign({ acao }, dados || {}));

  if (!response.ok) throw new Error("Erro de rede (" + response.status + ")");
  return response.json();
}

/* ===================== conexão com Google (Google Identity Services) ===================== */

// salvo junto da conta, do mesmo jeito que já guardamos a senha). Isso significa que o navegador NUNCA
// mais precisa pedir nada ao Google sozinho — a única vez que a tela do Google aparece é quando a
// pessoa clica no botão "Conectar Google" (ver acaoConectarGoogle). Reabrir o app, trocar de aparelho
// ou fazer login de novo NUNCA aciona o Google: eles apenas perguntam ao nosso próprio servidor

// O Client ID de app Web NÃO é segredo — é protegido pelas "Origens JavaScript autorizadas"
// configuradas no Google Cloud Console, por isso pode ficar direto no código do front-end.
const GOOGLE_CLIENT_ID = "324458100746-em71t2toc30d96up3adov613eljubt6h.apps.googleusercontent.com";
const GOOGLE_SCOPES = ["openid", "email", "profile", "https://www.googleapis.com/auth/spreadsheets", "https://www.googleapis.com/auth/drive.file"].join(" ");

function waitForGis() {
  return new Promise((resolve) => {
    (function check() {
      if (window.google && window.google.accounts && window.google.accounts.oauth2) resolve();
      else setTimeout(check, 150);
    })();
  });
}
// Só é chamada dentro de acaoConectarGoogle, ou seja, só a partir de um clique explícito da pessoa —
// nunca automaticamente. Pede um "código de autorização" (não um token) para o back-end trocar por um
// acesso permanente.
async function solicitarCodigoGoogle() {
  await waitForGis();
  return new Promise((resolve, reject) => {
    const client = window.google.accounts.oauth2.initCodeClient({
      client_id: GOOGLE_CLIENT_ID,
      scope: GOOGLE_SCOPES,
      ux_mode: "popup",
      access_type: "offline",
      prompt: "consent",
      callback: (resposta) => {
        if (resposta && resposta.code) resolve(resposta.code);
        else reject(new Error("Conexão cancelada."));
      },
      error_callback: () => reject(new Error("Não foi possível conectar ao Google.")),
    });
    client.requestCode();
  });
}

// Calcula proteína/carboidrato/gordura/fibra a partir só da meta de calorias (e, se disponível, do
// peso da última bioimpedância) usando os parâmetros de referência das Dietary Reference Intakes e
// das Dietary Guidelines for Americans 2025-2030:
// - Proteína: 1,4 g/kg (meio da faixa de 1,2-1,6 g/kg recomendada pelas DGA 2025-2030 pra controle de
//   peso) quando o peso é conhecido; senão, 20% das calorias (dentro do AMDR de 10-35%).
// - Carboidrato: pelo menos 130 g/dia (RDA baseada no uso mínimo de glicose pelo cérebro) ou 45% das
//   calorias (piso do AMDR), o que for maior.
// - Gordura: o restante das calorias, nunca abaixo de 20% (piso do AMDR, necessário pros ácidos graxos
//   essenciais e pra absorção das vitaminas lipossolúveis) — se sobrar menos que isso, tira a diferença
//   do carboidrato (nunca da proteína), respeitando o piso de 130 g.
// - Fibra: 14 g a cada 1.000 kcal (Ingestão Adequada).
// Esses são valores de referência gerais, não substituem orientação profissional individualizada.
function calcularMacrosAutomaticos(calorias, pesoKg) {
  calorias = Math.max(0, Number(calorias) || 0);
  if (!calorias) return null;

  let proteinKcal = pesoKg ? pesoKg * 1.4 * 4 : calorias * 0.20;
  proteinKcal = Math.min(proteinKcal, calorias * 0.35); // nunca ultrapassa o teto do AMDR (35%)

  const carbFloorKcal = 130 * 4;
  let carbKcal = Math.max(calorias * 0.45, carbFloorKcal);

  let fatKcal = calorias - proteinKcal - carbKcal;
  const fatFloorKcal = calorias * 0.20;
  if (fatKcal < fatFloorKcal) {
    const falta = fatFloorKcal - fatKcal;
    carbKcal = Math.max(carbFloorKcal, carbKcal - falta);
    fatKcal = calorias - proteinKcal - carbKcal;
  }
  fatKcal = Math.max(0, fatKcal);

  return {
    protein: Math.round(proteinKcal / 4 * 10) / 10,
    carbs: Math.round(carbKcal / 4 * 10) / 10,
    fat: Math.round(fatKcal / 9 * 10) / 10,
    fiber: Math.round(calorias / 1000 * 14),
  };
}

const ESPORTE_EMOJI = {
  "Boxe": "\ud83e\udd4a", "Caminhada": "\ud83d\udeb6", "Ciclismo": "\ud83d\udeb4", "Corrida": "\ud83c\udfc3", "Futebol": "\u26bd",
  "Jiu-jitsu": "\ud83e\udd4b", "Muay Thai": "\ud83e\uddb5", "Muscula\u00e7\u00e3o": "\ud83c\udfcb\ufe0f", "Nata\u00e7\u00e3o": "\ud83c\udfca", "T\u00eanis": "\ud83c\udfbe",
};
function emojiEsporte(esporte) { return ESPORTE_EMOJI[esporte] || "\ud83c\udfc5"; }

function normalizeText(value) { return value.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, ""); }

function amountForFood(text, position, food) {
  const before = text.slice(Math.max(0, position - 38), position);
  const grams = before.match(/(\d+(?:[.,]\d+)?)\s*(?:g|gramas?|gramos?)\s*(?:de\s*)?$/i);
  const ml = before.match(/(\d+(?:[.,]\d+)?)\s*(?:ml|mililitros?)\s*(?:de\s*)?$/i);
  const units = before.match(/(\d+(?:[.,]\d+)?)\s*(?:unidades?|unid\.?|ovos?|pães?|paes?)\s*(?:de\s*)?$/i);
  const numberOnly = before.match(/(?:^|[\s,;])(?:um|uma|um copo de)?\s*(\d+(?:[.,]\d+)?)\s*$/i);
  const numberWord = /(?:^|[\s,;])(um|uma)\s*$/.test(before);
  const number = (match) => (match ? Number(match[1].replace(",", ".")) : null);
  if (food.grams && grams) { const value = number(grams); return { multiplier: value / food.grams, amount: formatNumber(value, 0) + " g" }; }
  if (food.ml && ml) { const value = number(ml); return { multiplier: value / food.ml, amount: formatNumber(value, 0) + " ml" }; }
  if (units) { const value = number(units); return { multiplier: value / (food.count || 1), amount: formatNumber(value, 0) + " unidade" + (value > 1 ? "s" : "") }; }
  // Um número solto do lado do alimento, sem "g"/"ml"/"unidades" (ex.: "1 pão francês", "2 bananas",
  // "3 ovos") quase sempre significa "N porções" na fala natural — não "N gramas". Antes isso era
  // dividido por food.grams/food.ml, então "1 pão francês" virava "1 grama de pão" (135 kcal → 3 kcal,
  // visível de forma bem clara no detalhamento por alimento). Trata como múltiplo da porção padrão,
  // igual ao caminho de "unidades" explícitas — quem quiser um valor preciso em gramas/ml usa "g"/"ml".
  if (numberOnly) { const value = number(numberOnly); return { multiplier: value / (food.count || 1), amount: formatNumber(value, 0) + " unidade" + (value > 1 ? "s" : "") }; }
  if (numberWord || /\bum\b|\buma\b/.test(before)) return { multiplier: 1, amount: food.baseAmount };
  return { multiplier: 1, amount: food.baseAmount };
}

function detectFoods(description) {
  const text = normalizeText(description);
  // Junta todos os termos de todos os alimentos que aparecem no texto, em vez de resolver um alimento
  // de cada vez na ordem em que aparecem na biblioteca. Isso importa porque vários termos mais
  // específicos contêm um termo mais curto de OUTRO alimento (ex.: "suco de uva" contém "uva", que
  // também é o termo da fruta "Uva" sozinha) — resolver na ordem da biblioteca dependeria de qual dos
  // dois vem primeiro no array, o que é frágil. Ordenando todos os candidatos pelo tamanho do termo
  // (do mais longo pro mais curto) e aceitando de forma gulosa sem sobreposição de intervalos, o termo
  // mais específico (mais longo) sempre vence — não importa a ordem em que foi declarado.
  const candidates = [];
  for (const food of foodLibrary) {
    for (const term of food.terms) {
      const normalizedTerm = normalizeText(term);
      const position = text.indexOf(normalizedTerm);
      if (position !== -1) candidates.push({ food, position, length: normalizedTerm.length });
    }
  }
  candidates.sort((a, b) => b.length - a.length || a.position - b.position);
  const found = [];
  const usedFoods = new Set();
  const occupied = [];
  for (const c of candidates) {
    if (usedFoods.has(c.food)) continue; // já identificamos esse alimento por um termo mais específico
    const overlaps = occupied.some((range) => c.position < range.end && c.position + c.length > range.start);
    if (overlaps) continue;
    const r = amountForFood(text, c.position, c.food);
    found.push({ label: c.food.label, amount: r.amount, values: scale(c.food.values, r.multiplier) });
    usedFoods.add(c.food);
    occupied.push({ start: c.position, end: c.position + c.length });
  }
  return found;
}

/* ===================== helpers de derivação ===================== */
function today() { return todayKey(); }
function todayMeals() { const t = today(); return state.meals.filter((m) => m.date === t); }
function consumedToday() { return todayMeals().reduce((sum, m) => addNutrients(sum, m), emptyNutrients); }
function remainingToday() { const consumed = consumedToday(); const out = {}; for (const k of Object.keys(state.goals)) out[k] = state.goals[k] - consumed[k]; return out; }
function mealTotal() { return state.preview.reduce((sum, f) => addNutrients(sum, f.values), emptyNutrients); }
function historyDays() { return Array.from(new Set(state.meals.map((m) => m.date))).sort().reverse(); }
function dateLabel(date) { return new Intl.DateTimeFormat("pt-BR", { weekday: "long", day: "numeric", month: "long" }).format(new Date(date + "T12:00:00")); }
function todayTreinos() { const t = today(); return state.treinos.filter((tr) => tr.date === t); }
function historyDaysTreinos() { return Array.from(new Set(state.treinos.map((tr) => tr.date))).sort().reverse(); }
// Duração em minutos entre dois horários "HH:MM" do mesmo dia (não trata treino que passa da meia-noite).
function duracaoMinutos(inicio, fim) {
  const [hi, mi] = inicio.split(":").map(Number);
  const [hf, mf] = fim.split(":").map(Number);
  return (hf * 60 + mf) - (hi * 60 + mi);
}
function formatarDuracao(min) {
  if (min == null || isNaN(min) || min < 0) return "";
  if (min === 0) return "< 1 min";
  const h = Math.floor(min / 60);
  const m = min % 60;
  if (h > 0) return h + "h" + (m > 0 ? String(m).padStart(2, "0") + "min" : "");
  return m + " min";
}
// Tempo ativo (em ms) do treino em andamento — soma dos trechos já concluídos com o trecho atual (se
// não estiver pausado). Usado tanto pro cronômetro na tela quanto pra duração final salva.
function treinoAtivoElapsedMs() {
  if (!state.treinoAtivo) return 0;
  const extra = state.treinoAtivo.pausado ? 0 : (Date.now() - state.treinoAtivo.segmentoAtualInicio);
  return state.treinoAtivo.acumuladoMs + extra;
}
function formatarCronometro(ms) {
  const totalSeg = Math.max(0, Math.floor(ms / 1000));
  const h = Math.floor(totalSeg / 3600);
  const m = Math.floor((totalSeg % 3600) / 60);
  const s = totalSeg % 60;
  const pad = (n) => String(n).padStart(2, "0");
  return h > 0 ? h + ":" + pad(m) + ":" + pad(s) : pad(m) + ":" + pad(s);
}
// Calcula a idade exata (anos, meses e dias) a partir da data de nascimento (string "YYYY-MM-DD").
function calcularIdadeExata(dataNascimento) {
  if (!dataNascimento) return null;
  const nasc = new Date(dataNascimento + "T00:00:00");
  if (isNaN(nasc.getTime())) return null;
  const hoje = new Date();
  let anos = hoje.getFullYear() - nasc.getFullYear();
  let meses = hoje.getMonth() - nasc.getMonth();
  let dias = hoje.getDate() - nasc.getDate();
  if (dias < 0) {
    meses -= 1;
    dias += new Date(hoje.getFullYear(), hoje.getMonth(), 0).getDate();
  }
  if (meses < 0) { anos -= 1; meses += 12; }
  if (anos < 0) return null; // data de nascimento no futuro
  return { anos, meses, dias };
}
function formatarIdadeExata(idade) {
  const anos = idade.anos + (idade.anos === 1 ? " ano" : " anos");
  const meses = String(idade.meses).padStart(2, "0") + (idade.meses === 1 ? " mês" : " meses");
  const dias = String(idade.dias).padStart(2, "0") + (idade.dias === 1 ? " dia" : " dias");
  return anos + ", " + meses + " e " + dias;
}
function ultimoRegistroMedida(tipo) {
  const registros = state.medidas.filter((m) => m.tipo === tipo).sort((a, b) => b.id - a.id);
  return registros.length ? registros[0] : null;
}
// A altura agora vem do registro mais recente de Bioimpedância e Calorimetria (não é mais um campo
// avulso) — é lá que a pessoa informa a altura junto com o resto dos dados do exame/balança.
function ultimaBioimpedancia() {
  const registros = state.bioimpedancia.slice().sort((a, b) => b.id - a.id);
  return registros.length ? registros[0] : null;
}
function ultimaCalorimetria() {
  const registros = state.calorimetria.slice().sort((a, b) => b.id - a.id);
  return registros.length ? registros[0] : null;
}
function calcularImc() {
  const registro = ultimoRegistroMedida("peso");
  const bio = ultimaBioimpedancia();
  const alturaM = Number(bio && bio.altura) / 100;
  if (!registro || !alturaM) return null;
  const peso = Number(registro.valor);
  if (!peso) return null;
  return peso / (alturaM * alturaM);
}
const IMC_FAIXAS = [
  { ate: 18.5, label: "Abaixo do peso", cor: "#6fb3d9", corSuave: "#e7f3fa" },
  { ate: 25, label: "Peso normal", cor: "#4b9350", corSuave: "#e9f5e9" },
  { ate: 30, label: "Sobrepeso", cor: "#d9a92e", corSuave: "#faf2dc" },
  { ate: 35, label: "Obesidade grau I", cor: "#dd8636", corSuave: "#fbecdb" },
  { ate: 40, label: "Obesidade grau II", cor: "#d1652f", corSuave: "#f9e4d8" },
  { ate: Infinity, label: "Obesidade grau III", cor: "#c13f34", corSuave: "#f7ddd9" },
];
function faixaImc(imc) { return IMC_FAIXAS.find((f) => imc < f.ate); }
function classificarImc(imc) { return faixaImc(imc).label; }
/* Limites (em kg/m²) usados para desenhar as faixas coloridas do gráfico de IMC. */
const IMC_ESCALA_MIN = 15;
const IMC_ESCALA_MAX = 45;
const IMC_ESCALA_CORTES = [18.5, 25, 30, 35, 40];
function imcChartTemplate(imc) {
  const pct = (v) => Math.min(100, Math.max(0, ((v - IMC_ESCALA_MIN) / (IMC_ESCALA_MAX - IMC_ESCALA_MIN) * 100)));
  const cores = IMC_FAIXAS.map((f) => f.cor);
  const cortesPct = IMC_ESCALA_CORTES.map(pct);
  const stops = [];
  stops.push(cores[0] + " 0%");
  for (let i = 0; i < cortesPct.length; i++) {
    stops.push(cores[i] + " " + cortesPct[i].toFixed(1) + "%");
    stops.push(cores[i + 1] + " " + cortesPct[i].toFixed(1) + "%");
  }
  stops.push(cores[cores.length - 1] + " 100%");
  const gradient = "linear-gradient(to right," + stops.join(",") + ")";
  const marcadorPct = imc == null ? null : Math.min(97, Math.max(3, pct(imc)));
  return '' +
    '<div class="imc-chart">' +
      '<div class="imc-chart-marker-wrap">' +
        (marcadorPct == null ? "" :
          '<div class="imc-chart-marker" style="left:' + marcadorPct.toFixed(1) + '%">' +
            '<div class="imc-chart-marker-value">' + formatNumber(imc, 1) + "</div>" +
            '<div class="imc-chart-marker-pin"></div>' +
          "</div>"
        ) +
      "</div>" +
      '<div class="imc-chart-track" style="background:' + gradient + '"></div>' +
      '<div class="imc-chart-ticks">' + IMC_ESCALA_CORTES.map((t, i) => '<span class="imc-chart-tick" style="left:' + cortesPct[i].toFixed(1) + '%">' + t + "</span>").join("") + "</div>" +
    "</div>";
}

function compressImageDataUrl(file, maxSize, quality) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        const scale = Math.min(1, maxSize / Math.max(width, height));
        width = Math.round(width * scale);
        height = Math.round(height * scale);
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", quality || 0.7));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
async function onAvatarSelected(event) {

  event.target.value = "";

/* ===================== anexo de exame (bioimpedância/calorimetria) ===================== */
// Fotos são comprimidas (igual à foto de perfil, só que num tamanho maior, pra manter o exame
// legível) antes de virar base64; PDF é enviado como veio, sem como comprimir.
async function prepararConteudoAnexo(file) {
  if (file.type && file.type.startsWith("image/")) {
    const dataUrl = await compressImageDataUrl(file, 1600, 0.75);
    return { base64: dataUrl.split(",")[1], tipoMime: "image/jpeg", nomeArquivo: (file.name || "exame").replace(/\.[^.]+$/, "") + ".jpg" };
  }
  const dataUrl = await new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
  return { base64: dataUrl.split(",")[1], tipoMime: file.type || "application/octet-stream", nomeArquivo: file.name || "exame" };
}

// O anexo pode ter alguns MB em base64 — grande demais pra caber na URL do chamarApi (que usa GET).
// Por isso este envio usa POST de verdade via fetch, mas com o corpo mandado como texto puro (sem
// definir Content-Type: application/json) — isso faz o navegador tratar a chamada como uma
// "requisição simples" de CORS, que não dispara o pedido de verificação prévia (preflight OPTIONS)
// que esse backend (Apps Script) não consegue responder. É esse preflight que bloqueava POST aqui,
// não o POST em si — então a resposta pode ser lida normalmente, do mesmo jeito que no chamarApi.
async function enviarAnexoViaPost(payload) {
  const response = await fetch(API_URL, { method: "POST", body: JSON.stringify(payload) });
  if (!response.ok) throw new Error("Erro de rede (" + response.status + ")");
  return response.json();
}

async function enviarAnexoExame(file) {
  try {
    if (file.size > 15 * 1024 * 1024) return { ok: false, erro: "Arquivo muito grande (máximo 15 MB)." };
    const { base64, tipoMime, nomeArquivo } = await prepararConteudoAnexo(file);
    return await enviarAnexoViaPost({ acao: "enviarAnexoExame", email: state.usuario.email, nomeArquivo, tipoMime, conteudoBase64: base64 });
  } catch (err) {
    return { ok: false, erro: "Não foi possível enviar o anexo. Verifique sua conexão e tente novamente." };
  }
}

// ===== fila de pendências =====
// Toda alteração (salvar/apagar refeição ou medida, editar metas/altura) tenta subir pro servidor na
// hora. Se essa chamada falhar (sem internet, backend fora do ar por um instante, etc.), em vez de
// simplesmente perder essa alteração (como acontecia antes), ela fica guardada aqui no aparelho e a
// gente tenta reenviar sozinho na próxima vez que o app sincronizar — sem precisar que a pessoa refaça
// nada. Isso é o que faz o app se recuperar de qualquer falha passageira, em vez de deixar um dado
// "preso" só num aparelho pra sempre.
function lerFila() { return readStorage(CHAVE_FILA, []); }
function gravarFila(fila) { writeStorage(CHAVE_FILA, fila); }

// Envios que já começaram mas ainda não terminaram (nem com sucesso, nem com falha) — só existe na
// memória (não precisa sobreviver a um recarregamento de página). Numa rede lenta (celular), um envio
// pode legitimamente demorar vários segundos (o backend às vezes precisa de mais de uma chamada ao
// Google por trás); se uma sincronização automática rodar nesse meio-tempo, ela buscaria a lista do
// servidor SEM esse registro ainda (porque ele nem terminou de chegar lá) e o apagaria da tela como se
// tivesse sido excluído em outro aparelho. Guardar aqui o que está "a caminho" evita isso — ver
// mesclarComPendentes logo abaixo, que consulta esta lista além da fila de reenvio.
const enviosEmAndamento = [];

// Envia uma ação ao backend; se falhar, guarda na fila para tentar de novo depois. Quem chama já
// decide quando faz sentido chamar isso (conta conectada ao Google).
// Retorna a promise (sempre resolvida, nunca rejeitada — falha vira fila, não uma exceção) pra quem
// precisar ESPERAR esse envio terminar antes de fazer outra coisa que mexe no mesmo registro no
// servidor (ver processarAnexoBioimpedanciaEmSegundoPlano/processarAnexoCalorimetriaEmSegundoPlano) —
// sem isso, o envio do registro (que faz um "append" na planilha) e a atualização do link do anexo
// (que lê, apaga e reescreve a aba inteira) podiam rodar ao mesmo tempo e um pisar no outro,
// apagando campos que já tinham sido salvos certinho.
function enviarComFila(tipo, args) {
  const item = { tipo, args };
  enviosEmAndamento.push(item);
  return Promise.resolve(authApi[tipo].apply(authApi, args)).then((resposta) => {
    if (!resposta || resposta.ok === false) throw new Error("falha ao sincronizar");
  }).catch(() => {
    const fila = lerFila();
    fila.push({ tipo, args });
    gravarFila(fila);
  }).finally(() => {
    const i = enviosEmAndamento.indexOf(item);
    if (i !== -1) enviosEmAndamento.splice(i, 1);
  });
}

// Tenta reenviar tudo que ficou pendente, na ordem em que foi criado. O que continuar falhando
// permanece na fila para a próxima tentativa.
async function processarFilaPendente() {
  if (!state.account) return;
  const fila = lerFila();
  if (!fila.length) return;
  const restante = [];
  for (const item of fila) {
    try {
      const resposta = await authApi[item.tipo].apply(authApi, item.args);
      if (!resposta || resposta.ok === false) restante.push(item);
    } catch (err) {
      restante.push(item);
    }
  }
  gravarFila(restante);
}

// Uma refeição/medida que ainda está pendente de envio (na fila de reenvio OU ainda a caminho pela
// primeira vez, ver enviosEmAndamento acima) pode não aparecer na resposta autoritativa do servidor
// ainda — sem isso ela sumiria da tela até terminar de sincronizar. Aqui a gente reinclui esses itens
// pendentes na lista vinda do servidor, até que o envio seja confirmado.
function mesclarComPendentes(listaServidor, tipoCriacao) {
  const pendentesFila = lerFila().concat(enviosEmAndamento);
  const idsServidor = new Set(listaServidor.map((item) => item.id));
  const pendentes = pendentesFila.filter((item) => item.tipo === tipoCriacao).map((item) => item.args[1]).filter((item) => !idsServidor.has(item.id));
  return listaServidor.concat(pendentes);
}

// Mantém nome/foto/data de nascimento/sexo atualizados em qualquer aparelho logado na mesma conta.
// Esses campos ficam guardados na nossa própria conta de usuário (não dependem do Google estar
// conectado), mas antes só eram buscados no momento do login — por isso um dado editado no celular
// não aparecia no PC (e vice-versa) enquanto o app continuasse aberto e logado lá. Roda sempre junto
// da sincronização normal (abertura do app, volta de segundo plano, foco na janela).
async function sincronizarPerfilDoServidor() {
  try {
    const resposta = await authApi.buscarPerfil(state.usuario.email);
    if (!resposta || !resposta.ok) return;
    const mudou = state.usuario.nome !== resposta.nome || (state.usuario.foto || "") !== (resposta.foto || "") ||
      (state.usuario.dataNascimento || "") !== (resposta.dataNascimento || "") || (state.usuario.sexo || "") !== (resposta.sexo || "");
    if (!mudou) return;
    state.usuario = Object.assign({}, state.usuario, {
      nome: resposta.nome, foto: resposta.foto || "", dataNascimento: resposta.dataNascimento || "", sexo: resposta.sexo || "",
    });
    persistUsuario();
    render();
  } catch { /* falha de rede — mantém os dados de perfil locais e tenta de novo na próxima abertura */ }
}

// Busca os dados no NOSSO backend (Code.gs) — nunca fala diretamente com o Google. É por isso que
// pode ser chamada sempre que o app abre (ou depois do login) sem nunca abrir nenhuma tela do Google:
// é uma chamada comum ao mesmo servidor que já cuida do login. Se a conta não estiver conectada ao
// Google, o servidor simplesmente responde dizendo isso, e o app continua funcionando só localmente.
// Roda toda vez que o app abre (ou volta a ficar visível) já conectado ao Google. A partir do momento
// em que a conta está conectada, toda alteração (salvar, apagar, editar) já tenta subir pro servidor
// na hora — então o servidor é a fonte da verdade. Por isso aqui SUBSTITUÍMOS a lista local pela que
// vem do servidor, em vez de só somar: é o que garante que uma exclusão feita em outro aparelho
// também desapareça aqui, e não só reapareça depois de sincronizar.
async function sincronizarDoServidor() {
  if (!state.usuario) return;
  await processarFilaPendente();
  await sincronizarPerfilDoServidor();
  try {
    const resposta = await authApi.carregarDadosGoogle(state.usuario.email);
    if (!resposta.ok) {
      if (state.account) { state.account = null; writeStorage(CHAVE_GACCOUNT, null); render(); }
      return;
    }
    state.account = { email: resposta.googleEmail || (state.account && state.account.email) || "" };
    writeStorage(CHAVE_GACCOUNT, state.account);
    state.meals = mesclarComPendentes(resposta.meals || [], "salvarRefeicaoGoogle"); persistMeals();
    if (resposta.goals) { state.goals = resposta.goals; persistGoals(); }
    if (resposta.altura) { state.altura = resposta.altura; persistAltura(); }
    state.medidas = mesclarComPendentes(resposta.medidas || [], "salvarMedidaGoogle"); persistMedidas();
    state.bioimpedancia = mesclarComPendentes(resposta.bioimpedancia || [], "salvarBioimpedanciaGoogle"); persistBioimpedancia();
    state.calorimetria = mesclarComPendentes(resposta.calorimetria || [], "salvarCalorimetriaGoogle"); persistCalorimetria();
    state.treinos = mesclarComPendentes(resposta.treinos || [], "salvarTreinoGoogle"); persistTreinos();
    render();
  } catch { /* falha de rede — mantém os dados locais e tenta de novo na próxima abertura */ }
}
// Ao conectar pela primeira vez (ou reconectar depois de desconectar), pode haver refeições/medidas
// que só existem neste aparelho ainda (registradas antes de conectar, ou feitas offline) — como daqui
// pra frente cada ação já sobe sozinha, essa é a única vez que precisamos empurrar manualmente o que
// ficou pra trás, pra igualar este aparelho com o servidor antes de tratá-lo como fonte da verdade.
function publicarRegistrosLocaisPendentes(remoto) {
  const idsRefeicoes = new Set((remoto.meals || []).map((m) => m.id));
  const idsMedidas = new Set((remoto.medidas || []).map((m) => m.id));
  const idsBioimpedancia = new Set((remoto.bioimpedancia || []).map((b) => b.id));
  const idsCalorimetria = new Set((remoto.calorimetria || []).map((c) => c.id));
  const idsTreinos = new Set((remoto.treinos || []).map((t) => t.id));
  state.meals.filter((m) => !idsRefeicoes.has(m.id)).forEach((m) => enviarComFila("salvarRefeicaoGoogle", [state.usuario.email, m]));
  state.medidas.filter((m) => !idsMedidas.has(m.id)).forEach((m) => enviarComFila("salvarMedidaGoogle", [state.usuario.email, m]));
  state.bioimpedancia.filter((b) => !idsBioimpedancia.has(b.id)).forEach((b) => enviarComFila("salvarBioimpedanciaGoogle", [state.usuario.email, b]));
  state.calorimetria.filter((c) => !idsCalorimetria.has(c.id)).forEach((c) => enviarComFila("salvarCalorimetriaGoogle", [state.usuario.email, c]));
  state.treinos.filter((t) => !idsTreinos.has(t.id)).forEach((t) => enviarComFila("salvarTreinoGoogle", [state.usuario.email, t]));
  if (!remoto.goals) enviarComFila("atualizarMetasGoogle", [state.usuario.email, state.goals, state.altura]);
}
// Única função que efetivamente abre algo do Google — e só roda quando a pessoa clica no botão
// "Conectar Google" na barra lateral. Pede um código de autorização com access_type "offline", manda
// para o back-end trocar por uma conexão permanente (guardada junto da conta, como a senha), e nunca
// mais precisa repetir esse processo neste ou em outro aparelho.
async function acaoConectarGoogle() {
  state.syncing = true; render();
  try {
    const code = await solicitarCodigoGoogle();
    const resposta = await authApi.conectarGoogle(state.usuario.email, code);
    if (!resposta.ok) { toastError(resposta.erro || "Não foi possível conectar com o Google."); return; }
    publicarRegistrosLocaisPendentes(resposta);
    state.account = { email: resposta.googleEmail || "" };
    writeStorage(CHAVE_GACCOUNT, state.account);
    state.meals = mergeMeals(state.meals, resposta.meals || []); persistMeals();
    if (resposta.goals) { state.goals = resposta.goals; persistGoals(); }
    if (resposta.altura) { state.altura = resposta.altura; persistAltura(); }
    state.medidas = mergeMedidas(state.medidas, resposta.medidas || []); persistMedidas();
    state.bioimpedancia = mergeMedidas(state.bioimpedancia, resposta.bioimpedancia || []); persistBioimpedancia();
    state.calorimetria = mergeMedidas(state.calorimetria, resposta.calorimetria || []); persistCalorimetria();
    state.treinos = mergeMedidas(state.treinos, resposta.treinos || []); persistTreinos();
    toastSuccess("Conectado como " + state.account.email + ". Seus dados agora sincronizam entre aparelhos — sem precisar conectar de novo.");
  } catch (err) { toastError((err && err.message) || "Falha ao conectar com o Google. Tente novamente."); }
  finally { state.syncing = false; render(); }
}
function acaoDesconectarGoogle() {
  if (state.usuario) authApi.desconectarGoogle(state.usuario.email).catch(() => {});
  state.account = null;
  writeStorage(CHAVE_GACCOUNT, null);
  toastSuccess("Desconectado do Google. Conecte de novo quando quiser voltar a sincronizar.");
  render();
}

function acaoCalcularMacrosAutomaticos() {
  // Lê o valor direto do campo de calorias no DOM, em vez de confiar só em state.goals.calories: o
  // botão usa onmousedown com preventDefault (ver comentário no template) pra não perder o clique
  // quando a pessoa acabou de digitar a meta de kcal e clica em "Calcular" sem clicar em outro lugar
  // antes -- mas isso também significa que o campo de calorias pode ainda não ter disparado seu
  // onchange (que só roda ao perder o foco), então o valor mais atual só existe no próprio input.
  const inputCalorias = document.getElementById("goal-input-calories");
  const calorias = inputCalorias && inputCalorias.value !== "" ? Number(inputCalorias.value) : state.goals.calories;
  if (!calorias) { toastError("Informe a meta de calorias antes de calcular os macronutrientes."); return; }
  // Se o campo de calorias ainda estiver focado (a pessoa digitou e clicou direto em "Calcular", sem
  // clicar em outro lugar antes), tiramos o foco dele aqui, de propósito, ANTES de qualquer render()
  // nosso. Se não fizermos isso, é o próprio render() logo abaixo (via innerHTML) que acaba removendo
  // esse input focado da tela -- e remover um elemento focado dispara um blur "por conta própria" bem
  // no meio da reconstrução do innerHTML, o que dispara o onchange dele (acaoAtualizarMeta) e chama um
  // SEGUNDO render() encaixado dentro do primeiro, ainda em andamento. Dois innerHTML acontecendo um
  // dentro do outro deixa o navegador confuso sobre quais nós ainda existem, e ele lança o erro "The
  // node to be removed is no longer a child of this node". Chamando blur() manualmente agora, o
  // onchange roda (e o render() dele termina) antes da gente sequer começar a montar os macros --
  // então o nosso próprio render(), lá embaixo, já não está mais aninhado dentro de nenhum outro.
  if (inputCalorias) inputCalorias.blur();
  const ultimoBio = ultimaBioimpedancia();
  const pesoKg = ultimoBio && ultimoBio.peso ? Number(ultimoBio.peso) : null;
  const macros = calcularMacrosAutomaticos(calorias, pesoKg);
  if (!macros) return;
  // Também grava a própria meta de calorias lida do input (não só os macros calculados a partir
  // dela) -- senão, se a pessoa não tiver saído do campo antes de clicar, o valor digitado ficaria só
  // visível no input, sem entrar de fato em state.goals.calories nem ser sincronizado.
  state.goals = Object.assign({}, state.goals, { calories: calorias }, macros);
  persistGoals();
  if (state.account) enviarComFila("atualizarMetasGoogle", [state.usuario.email, state.goals, state.altura]);
  toastSuccess(pesoKg
    ? "Macros calculados com base na meta de " + formatNumber(calorias) + " kcal e no seu peso de " + formatNumber(pesoKg, 1) + " kg. Você ainda pode ajustar cada valor manualmente."
    : "Macros calculados com base na meta de " + formatNumber(calorias) + " kcal (sem peso registrado na Bioimpedância, usamos 20% das calorias pra proteína). Você ainda pode ajustar cada valor manualmente.");
  render();
}

/* ===================== treinos/esportes ===================== */
function acaoSelecionarEsporte(valor) { state.treinoEsporte = valor; render(); }
// Troca de modo também descarta uma foto já selecionada — evita uma foto escolhida num modo "vazar"
// silenciosamente pro outro.
function acaoAlternarModoTreino(modo) { state.treinoModo = modo; limparFotoTreinoSelecionada(); render(); }

// Intervalo que atualiza o cronômetro na tela a cada segundo enquanto um treino está rodando (não
// fica no state porque é só uma questão de UI — não precisa ser persistido nem disparar sincronização).
let treinoTickIntervalId = null;
function iniciarTickTreinoSeNecessario() {
  pararTickTreino();
  if (state.treinoAtivo && !state.treinoAtivo.pausado) {
    treinoTickIntervalId = setInterval(render, 1000);
  }
}
function pararTickTreino() {
  if (treinoTickIntervalId) { clearInterval(treinoTickIntervalId); treinoTickIntervalId = null; }
}

function acaoIniciarTreino() {
  const esporte = state.treinoEsporte;
  if (!esporte) { toastError("Selecione o esporte."); return; }
  const now = new Date();
  state.treinoAtivo = {
    esporte, date: today(),
    horaInicioClock: now.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }),
    segmentoAtualInicio: Date.now(),
    acumuladoMs: 0,
    pausado: false,
  };
  persistTreinoAtivo();
  iniciarTickTreinoSeNecessario();
  render();
}

function acaoPausarTreino() {
  if (!state.treinoAtivo || state.treinoAtivo.pausado) return;
  state.treinoAtivo.acumuladoMs += Date.now() - state.treinoAtivo.segmentoAtualInicio;
  state.treinoAtivo.segmentoAtualInicio = null;
  state.treinoAtivo.pausado = true;
  persistTreinoAtivo();
  pararTickTreino();
  render();
}

function acaoRetomarTreino() {
  if (!state.treinoAtivo || !state.treinoAtivo.pausado) return;
  state.treinoAtivo.segmentoAtualInicio = Date.now();
  state.treinoAtivo.pausado = false;
  persistTreinoAtivo();
  iniciarTickTreinoSeNecessario();
  render();
}

function acaoEncerrarTreino() {
  if (!state.treinoAtivo) return;
  if (treinoFotoSelecionada && !state.account) { toastError("Conecte sua conta do Google para anexar fotos."); return; }
  const duracaoMin = Math.round(treinoAtivoElapsedMs() / 60000);
  const now = new Date();
  const notaEl = document.getElementById("treino-nota");
  const nota = notaEl ? notaEl.value : "";
  const novoTreino = {
    id: Date.now(), date: state.treinoAtivo.date, esporte: state.treinoAtivo.esporte,
    horaInicio: state.treinoAtivo.horaInicioClock, horaFim: now.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }),
    duracaoMin, fotoUrl: "", nota,
  };
  // Mesmo padrão "salva primeiro, anexo depois" já usado nos exames de bioimpedância/calorimetria
  // (ver processarAnexoBioimpedanciaEmSegundoPlano): o treino nunca fica refém do envio da foto.
  const arquivoFoto = treinoFotoSelecionada;
  state.treinos = state.treinos.concat([novoTreino]);
  persistTreinos();
  state.treinoAtivo = null;
  persistTreinoAtivo();
  pararTickTreino();
  state.treinoEsporte = "";
  state.treinoNota = "";
  if (notaEl) notaEl.value = ""; // ver comentário em acaoSalvarTreino sobre limpar o DOM diretamente
  limparFotoTreinoSelecionada();
  toastSuccess(arquivoFoto ? "Treino registrado. Enviando a foto em segundo plano..." : "Treino registrado.");
  const promessaRegistroBase = state.account ? enviarComFila("salvarTreinoGoogle", [state.usuario.email, novoTreino]) : Promise.resolve();
  render();
  if (arquivoFoto) processarFotoTreinoEmSegundoPlano(novoTreino.id, arquivoFoto, promessaRegistroBase);
}

// Ver comentário equivalente em processarAnexoBioimpedanciaEmSegundoPlano: espera o envio do registro
// em si terminar antes de mandar a atualização da foto, pra essas duas escritas nunca se cruzarem.
async function processarFotoTreinoEmSegundoPlano(idTreino, file, promessaRegistroBase) {
  const [resultado] = await Promise.all([enviarAnexoExame(file), promessaRegistroBase]);
  if (!resultado.ok) {
    toastError((resultado.erro || "Não foi possível enviar a foto") + " — o treino foi salvo, só sem a foto.");
    return;
  }
  const registro = state.treinos.find((t) => t.id === idTreino);
  if (!registro) return; // treino foi removido enquanto a foto ainda enviava
  registro.fotoUrl = resultado.url;
  persistTreinos();
  toastSuccess("Foto anexada ao treino.");
  if (state.account) enviarComFila("atualizarFotoTreinoGoogle", [state.usuario.email, idTreino, resultado.url]);
  render();
}

// Descarta o treino em andamento sem salvar (ex.: a pessoa iniciou por engano).
function acaoCancelarTreinoAtivo() {
  state.treinoAtivo = null;
  persistTreinoAtivo();
  pararTickTreino();
  limparFotoTreinoSelecionada();
  render();
}

function acaoSalvarTreino() {
  const esporte = state.treinoEsporte;
  if (!esporte) { toastError("Selecione o esporte."); return; }
  const inicioEl = document.getElementById("treino-hora-inicio");
  const fimEl = document.getElementById("treino-hora-fim");
  const horaInicio = inicioEl ? inicioEl.value : "";
  const horaFim = fimEl ? fimEl.value : "";
  if (!horaInicio || !horaFim) { toastError("Informe os horários de início e término."); return; }
  const duracaoMin = duracaoMinutos(horaInicio, horaFim);
  if (duracaoMin <= 0) { toastError("O horário de término deve ser depois do horário de início."); return; }
  if (treinoFotoSelecionada && !state.account) { toastError("Conecte sua conta do Google para anexar fotos."); return; }
  const notaEl = document.getElementById("treino-nota");
  const nota = notaEl ? notaEl.value : "";

  const novoTreino = { id: Date.now(), date: today(), esporte, horaInicio, horaFim, duracaoMin, fotoUrl: "", nota };
  const arquivoFoto = treinoFotoSelecionada;
  state.treinos = state.treinos.concat([novoTreino]);
  persistTreinos();
  state.treinoEsporte = "";
  state.treinoNota = "";
  // Limpa os campos no DOM diretamente (não só no state) — como os inputs continuam montados na
  // tela após salvar, o captureFormState() chamado no início do próximo render() ia recapturar o
  // valor antigo ainda presente nos inputs e desfazer a limpeza do state.
  inicioEl.value = "";
  fimEl.value = "";
  if (notaEl) notaEl.value = "";
  limparFotoTreinoSelecionada();
  toastSuccess(arquivoFoto ? "Treino registrado. Enviando a foto em segundo plano..." : "Treino registrado.");
  const promessaRegistroBase = state.account ? enviarComFila("salvarTreinoGoogle", [state.usuario.email, novoTreino]) : Promise.resolve();
  render();
  if (arquivoFoto) processarFotoTreinoEmSegundoPlano(novoTreino.id, arquivoFoto, promessaRegistroBase);
}

function acaoRemoverTreino(id) {
  state.treinos = state.treinos.filter((t) => t.id !== id);
  persistTreinos();
  if (state.account) enviarComFila("removerTreinoGoogle", [state.usuario.email, id]);
  render();
}

// Arquivo escolhido (mas ainda não enviado/salvo) em cada aba de cadastro. Fica fora de "state" de
// propósito: um File não dá pra guardar no localStorage, e não faz sentido sobreviver a um reload —
// se a pessoa recarregar a página no meio do cadastro, é razoável que precise escolher o arquivo de novo.
let anexoSelecionadoBio = null;
let anexoSelecionadoCalo = null;
// Mesma lógica acima, para a foto do treino. treinoFotoPreviewUrl é a URL local (blob:) gerada pra
// mostrar a miniatura antes de enviar — precisa ser revogada explicitamente quando trocada/removida,
// senão o navegador mantém o blob na memória para sempre.
let treinoFotoSelecionada = null;
let treinoFotoPreviewUrl = null;
function limparFotoTreinoSelecionada() {
  if (treinoFotoPreviewUrl) URL.revokeObjectURL(treinoFotoPreviewUrl);
  treinoFotoSelecionada = null;
  treinoFotoPreviewUrl = null;
}
function onFotoTreinoSelecionada(event) {
  const file = (event.target.files && event.target.files[0]) || null;
  limparFotoTreinoSelecionada();
  treinoFotoSelecionada = file;
  treinoFotoPreviewUrl = file ? URL.createObjectURL(file) : null;
  render();
}

// Abre o formulário já preenchido com os dados de um registro existente (clicado no histórico),

const BIOIMPEDANCIA_CAMPOS = ["altura", "peso", "gordura", "massaMagra", "massaMuscular", "aguaCorporal", "gorduraVisceral", "idadeMetabolica"];
const CALORIMETRIA_CAMPOS = ["tmb", "get"];

function acaoSalvarBioimpedancia() {
  const dataEl = document.getElementById("bio-data");
  const data = dataEl ? dataEl.value : "";
  if (!data) { toastError("Informe a data da medição."); return; }
  const valores = {};
  BIOIMPEDANCIA_CAMPOS.forEach((c) => {
    const el = document.getElementById("bio-" + c);
    valores[c] = el ? el.value.trim().replace(",", ".") : "";
  });
  if (!valores.altura || isNaN(Number(valores.altura))) { toastError("Informe a altura."); return; }
  if (anexoSelecionadoBio && !state.account) { toastError("Conecte sua conta do Google para anexar arquivos."); return; }

  const arquivoAnexo = anexoSelecionadoBio;
  const editandoId = state.bioimpedanciaEditandoId;

  // Modo edição (usuário clicou no ícone de editar de um registro já existente no histórico):
  // atualiza o registro em vez de criar um novo, preservando id e mantendo o anexo já existente a
  // menos que um novo arquivo tenha sido escolhido.
  if (editandoId != null) {
    const registro = state.bioimpedancia.find((r) => r.id === editandoId);
    if (!registro) { toastError("Registro não encontrado."); return; }
    registro.date = data;
    BIOIMPEDANCIA_CAMPOS.forEach((c) => { registro[c] = valores[c] ? Number(valores[c]) : null; });
    if (arquivoAnexo) registro.anexoUrl = ""; // preenchido de novo quando o anexo terminar de enviar
    persistBioimpedancia();
    state.showFormBioimpedancia = false;
    anexoSelecionadoBio = null;
    state.bioFormValores = {};
    state.bioimpedanciaEditandoId = null;
    toastSuccess(arquivoAnexo ? "Registro atualizado. Enviando o anexo em segundo plano..." : "Registro de bioimpedância atualizado.");
    const promessaEdicao = state.account ? enviarComFila("atualizarBioimpedanciaGoogle", [state.usuario.email, registro]) : Promise.resolve();
    render();
    if (arquivoAnexo) processarAnexoBioimpedanciaEmSegundoPlano(registro.id, arquivoAnexo, promessaEdicao);
    return;
  }

  // O registro é salvo AGORA MESMO (dado nunca depende do anexo terminar de enviar — evita perder a
  // medição inteira se o envio do arquivo for interrompido, ex.: celular bloqueia a tela no meio de
  // uma rede mais lenta). O anexo, quando selecionado, é enviado depois, em segundo plano, e só
  // "gruda" no registro já salvo quando terminar (ver processarAnexoBioimpedanciaEmSegundoPlano).
  const now = new Date();
  const novoRegistro = Object.assign(
    { id: Date.now(), date: data, time: now.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }), anexoUrl: "" },
    BIOIMPEDANCIA_CAMPOS.reduce((acc, c) => { acc[c] = valores[c] ? Number(valores[c]) : null; return acc; }, {})
  );
  state.bioimpedancia = state.bioimpedancia.concat([novoRegistro]);
  persistBioimpedancia();
  state.showFormBioimpedancia = false;
  anexoSelecionadoBio = null;
  state.bioFormValores = {};
  toastSuccess(arquivoAnexo ? "Registro salvo. Enviando o anexo em segundo plano..." : "Registro de bioimpedância salvo.");
  const promessaRegistroBase = state.account ? enviarComFila("salvarBioimpedanciaGoogle", [state.usuario.email, novoRegistro]) : Promise.resolve();
  render();
  if (arquivoAnexo) processarAnexoBioimpedanciaEmSegundoPlano(novoRegistro.id, arquivoAnexo, promessaRegistroBase);
}

// Envia o anexo depois que o registro já está salvo (ver comentário acima). Se der certo, atualiza o
// registro (local e no servidor) com o link do arquivo; se falhar, o registro continua salvo do
// mesmo jeito — só sem o anexo — e a pessoa é avisada para tentar anexar de novo mais tarde.
// IMPORTANTE: espera "promessaRegistroBase" (o envio do registro em si) terminar antes de mandar a
// atualização do anexo pro servidor — sem isso, os dois podiam chegar ao mesmo tempo (o primeiro
// criando a linha, o segundo lendo/reescrevendo a aba inteira pra colar o link) e um apagar campos que
// o outro tinha acabado de salvar.
async function processarAnexoBioimpedanciaEmSegundoPlano(idRegistro, file, promessaRegistroBase) {
  const [resultado] = await Promise.all([enviarAnexoExame(file), promessaRegistroBase]);
  if (!resultado.ok) {
    toastError((resultado.erro || "Não foi possível enviar o anexo") + " — o registro de bioimpedância foi salvo, só sem o exame anexado.");
    return;
  }
  const registro = state.bioimpedancia.find((r) => r.id === idRegistro);
  if (!registro) return; // registro foi removido enquanto o anexo ainda enviava
  registro.anexoUrl = resultado.url;
  persistBioimpedancia();
  toastSuccess("Exame anexado ao registro de bioimpedância.");
  if (state.account) enviarComFila("atualizarAnexoBioimpedanciaGoogle", [state.usuario.email, idRegistro, resultado.url]);
  render();
}
function acaoRemoverBioimpedancia(id) {
  state.bioimpedancia = state.bioimpedancia.filter((r) => r.id !== id);
  persistBioimpedancia();
  if (state.account) enviarComFila("removerBioimpedanciaGoogle", [state.usuario.email, id]);
  render();
}
function acaoSalvarCalorimetria() {
  const dataEl = document.getElementById("calo-data");
  const data = dataEl ? dataEl.value : "";
  if (!data) { toastError("Informe a data do exame."); return; }
  const valores = {};
  CALORIMETRIA_CAMPOS.forEach((c) => {
    const el = document.getElementById("calo-" + c);
    valores[c] = el ? el.value.trim().replace(",", ".") : "";
  });
  if (!valores.tmb || isNaN(Number(valores.tmb))) { toastError("Informe a Taxa Metabólica Basal (TMB)."); return; }
  if (!valores.get || isNaN(Number(valores.get))) { toastError("Informe o Gasto Energético Total (GET)."); return; }
  if (anexoSelecionadoCalo && !state.account) { toastError("Conecte sua conta do Google para anexar arquivos."); return; }

  const arquivoAnexo = anexoSelecionadoCalo;
  const editandoId = state.calorimetriaEditandoId;

  // Modo edição — mesma lógica usada em acaoSalvarBioimpedancia (ver comentário lá).
  if (editandoId != null) {
    const registro = state.calorimetria.find((r) => r.id === editandoId);
    if (!registro) { toastError("Registro não encontrado."); return; }
    registro.date = data;
    registro.tmb = Number(valores.tmb);
    registro.get = Number(valores.get);
    if (arquivoAnexo) registro.anexoUrl = "";
    persistCalorimetria();
    state.showFormBioimpedancia = false;
    anexoSelecionadoCalo = null;
    state.caloFormValores = {};
    state.calorimetriaEditandoId = null;
    toastSuccess(arquivoAnexo ? "Registro atualizado. Enviando o anexo em segundo plano..." : "Registro de calorimetria atualizado.");
    const promessaEdicao = state.account ? enviarComFila("atualizarCalorimetriaGoogle", [state.usuario.email, registro]) : Promise.resolve();
    render();
    if (arquivoAnexo) processarAnexoCalorimetriaEmSegundoPlano(registro.id, arquivoAnexo, promessaEdicao);
    return;
  }

  // Mesma lógica da bioimpedância (ver comentário lá): o registro é salvo já, o anexo vai depois em
  // segundo plano e só é "colado" ao registro quando (e se) terminar de enviar.
  const now = new Date();
  const novoRegistro = {
    id: Date.now(), date: data, time: now.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }),
    tmb: Number(valores.tmb), get: Number(valores.get), anexoUrl: "",
  };
  state.calorimetria = state.calorimetria.concat([novoRegistro]);
  persistCalorimetria();
  state.showFormBioimpedancia = false;
  anexoSelecionadoCalo = null;
  state.caloFormValores = {};
  toastSuccess(arquivoAnexo ? "Registro salvo. Enviando o anexo em segundo plano..." : "Registro de calorimetria salvo.");
  const promessaRegistroBase = state.account ? enviarComFila("salvarCalorimetriaGoogle", [state.usuario.email, novoRegistro]) : Promise.resolve();
  render();
  if (arquivoAnexo) processarAnexoCalorimetriaEmSegundoPlano(novoRegistro.id, arquivoAnexo, promessaRegistroBase);
}

// Ver comentário equivalente em processarAnexoBioimpedanciaEmSegundoPlano: espera o envio do registro
// em si terminar antes de mandar a atualização do anexo, pra essas duas escritas nunca se cruzarem.
async function processarAnexoCalorimetriaEmSegundoPlano(idRegistro, file, promessaRegistroBase) {
  const [resultado] = await Promise.all([enviarAnexoExame(file), promessaRegistroBase]);
  if (!resultado.ok) {
    toastError((resultado.erro || "Não foi possível enviar o anexo") + " — o registro de calorimetria foi salvo, só sem o exame anexado.");
    return;
  }
  const registro = state.calorimetria.find((r) => r.id === idRegistro);
  if (!registro) return;
  registro.anexoUrl = resultado.url;
  persistCalorimetria();
  toastSuccess("Exame anexado ao registro de calorimetria.");
  if (state.account) enviarComFila("atualizarAnexoCalorimetriaGoogle", [state.usuario.email, idRegistro, resultado.url]);
  render();
}

// Formata "AAAA-MM-DD" como "DD/MM/AAAA", pro formato pedido no histórico (diferente do dateLabel()
// por extenso usado no resto do app).
function dataCurta(dateStr) {
  const partes = String(dateStr || "").split("-");
  if (partes.length !== 3) return dateStr || "";
  return partes[2] + "/" + partes[1] + "/" + partes[0];
}

    '<div class="medida-history-row"><div class="medida-history-left"><span class="medida-history-tipo">' + tipoLabel + " registrada em " + dataCurta(r.date) + "</span>" +
    (r.anexoUrl

/* ===================== render ===================== */
function captureFormState() {
  const customEl = document.getElementById("meal-nome-custom");
  const descEl = document.getElementById("meal-description");
  if (customEl) state.mealNomeCustom = customEl.value;
  if (descEl) state.mealDescription = descEl.value;

  // O formulário de bioimpedância/calorimetria também precisa sobreviver a um render() no meio do
  // preenchimento (ex.: ao escolher um anexo, que atualiza a prévia do arquivo chamando render()) —
  // sem isso, o render() reconstrói o HTML do zero e os campos já digitados voltavam em branco.
  const bioDataEl = document.getElementById("bio-data");
  if (bioDataEl) {
    const valores = { data: bioDataEl.value };
    BIOIMPEDANCIA_CAMPOS.forEach((c) => {
      const el = document.getElementById("bio-" + c);
      if (el) valores[c] = el.value;
    });
    state.bioFormValores = valores;
  }
  const caloDataEl = document.getElementById("calo-data");
  if (caloDataEl) {
    const valores = { data: caloDataEl.value };
    CALORIMETRIA_CAMPOS.forEach((c) => {
      const el = document.getElementById("calo-" + c);
      if (el) valores[c] = el.value;
    });
    state.caloFormValores = valores;
  }

  const treinoInicioEl = document.getElementById("treino-hora-inicio");
  if (treinoInicioEl) state.treinoHoraInicio = treinoInicioEl.value;
  const treinoFimEl = document.getElementById("treino-hora-fim");
  if (treinoFimEl) state.treinoHoraFim = treinoFimEl.value;
  const treinoNotaEl = document.getElementById("treino-nota");
  if (treinoNotaEl) state.treinoNota = treinoNotaEl.value;
}
function render() {
  captureFormState();
  document.getElementById("app").innerHTML = state.usuario ? homeTemplate() : authTemplate();
}

/* ===================== instalar como app (PWA) ===================== */
let installPromptEvent = null;
function initInstallPrompt() {
  window.addEventListener("beforeinstallprompt", (event) => {
    event.preventDefault();
    installPromptEvent = event;
    const banner = document.createElement("div");
    banner.className = "install-banner";
    banner.id = "install-banner";
    banner.innerHTML = '<div class="install-icon">' + icon("download") + '</div>' +
      '<div class="install-text"><div class="title">Instalar o NutriTrack</div><div class="sub">Use como app, direto pelo Chrome.</div></div>' +
      '<button class="install-btn" onclick="doInstall()">Instalar</button>' +
      '<button class="install-close" aria-label="Fechar aviso de instalação" onclick="document.getElementById(\'install-banner\').remove()">' + icon("x") + "</button>";
    document.body.appendChild(banner);
  });
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(() => {});
}
async function doInstall() {
  if (!installPromptEvent) return;
  await installPromptEvent.prompt();
  installPromptEvent = null;
  const banner = document.getElementById("install-banner");
  if (banner) banner.remove();
}

/* ===================== inicialização ===================== */
render();
initInstallPrompt();
if (state.usuario) sincronizarDoServidor();
// Se havia um treino em andamento quando o app foi fechado/recarregado, retoma o cronômetro na tela
// (o tempo decorrido é sempre recalculado a partir do timestamp salvo, então não se perde nada).
iniciarTickTreinoSeNecessario();

// Em celular, abrir um seletor nativo (ex.: o calendário do campo de data) costuma disparar um
// "visibilitychange" no navegador (a página é considerada momentaneamente escondida enquanto o
// seletor do sistema fica por cima) — sem essa checagem, isso re-sincronizava e reconstruía o
// formulário bem no meio da escolha da data, fazendo o valor escolhido às vezes não "pegar" de
// primeira. Por isso, enquanto um formulário de edição estiver aberto, a sincronização espera —
// mexer nos dados de outro aparelho pode esperar até a pessoa terminar de editar.
function formularioDeEdicaoAberto() {
  return state.showFormBioimpedancia || state.showEditarPerfil || state.showGoals;
}

// Ao trocar de app/aba e voltar (ex.: usar o celular depois do PC), busca de novo os dados no nosso
// próprio backend — nunca no Google diretamente — para refletir o que foi salvo em outro aparelho
// enquanto este ficava parado em segundo plano. Sem isso, o app só atualizava na abertura (boot), e
// ficava com dados desatualizados até ser fechado e reaberto de verdade.
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && !formularioDeEdicaoAberto()) sincronizarDoServidor();
});
window.addEventListener("focus", () => { if (!formularioDeEdicaoAberto()) sincronizarDoServidor(); });
</script>
