        '<p class="micro-fonte-nota">' + icon("help") + " Valores de referência (Ingestão Diária de Referência) para a população em geral, conforme a ANVISA — Instrução Normativa nº 75/2020 (Anexo II), a norma vigente para rotulagem nutricional de alimentos no Brasil.</p>"
        :
        '<section class="nutrient-grid">' + nutrientCardsTemplate() + "</section>" +
        macroFonteNotaTemplate()
      ) +
      '<section class="dashboard-grid">' +
        '<aside class="meal-card"><div class="meal-card-eyebrow">' + icon(state.mealTipo === "Exposição Solar" ? "sun" : "sparkles") + (state.mealTipo === "Exposição Solar" ? " Exposição solar" : " Nova refeição") + "</div>" +
        "<h2>" + (state.mealTipo === "Exposição Solar" ? "Quanto tempo você ficou no sol?" : "O que você vai comer?") + "</h2>" +
        '<p class="meal-card-desc">' + (state.mealTipo === "Exposição Solar"
          ? "Informe o horário de início e fim da exposição e como estava o céu — calculamos uma estimativa da vitamina D sintetizada pela pele."
          : "Escreva naturalmente. Ex.: “1 pão francês, 1 ovo frito e 300 ml de suco de laranja”.") + "</p>" +
        (state.mealTipo === "Exposição Solar" ? "" :
          '<button type="button" class="produto-cadastrar-btn" onclick="acaoAbrirCadastrarProduto()">' + icon("plus") + " Cadastrar produto no cardápio</button>") +
        '<div class="meal-form">' +
          '<select id="meal-tipo-select" class="meal-select" onchange="acaoSelecionarTipoRefeicao(this.value)">' +
            '<option value="">Selecione a refeição...</option>' +
            MEAL_TIPOS.map((t) => '<option value="' + esc(t) + '"' + (state.mealTipo === t ? " selected" : "") + ">" + esc(t) + "</option>").join("") +
          "</select>" +
          (state.mealTipo === "Outro" ? '<input id="meal-nome-custom" class="meal-input" placeholder="Nome da refeição" value="' + esc(state.mealNomeCustom) + '"/>' : "") +
          '<div><label class="meal-form-label">Data</label><input id="meal-data" type="date" class="meal-input" max="' + esc(today()) + '" value="' + esc(state.mealData || today()) + '"/></div>' +
          (state.mealTipo === "Exposição Solar"
            ? exposicaoSolarCamposTemplate()
            : '<textarea id="meal-description" class="meal-textarea" placeholder="Descreva os alimentos e quantidades..." rows="4">' + esc(state.mealDescription) + "</textarea>" +
              '<button class="btn-ghost-light" onclick="acaoAnalisar()">' + icon("sparkles") + " Calcular refeição</button>"
          ) +
        "</div>" +
        (state.mealTipo === "Exposição Solar" ? exposicaoSolarPreviewTemplate() : mealPreviewTemplate()) +
        "</aside>" +
        '<div class="history-card"><div class="history-card-head">' +
          '<div><div class="history-eyebrow">' + icon("utensils") + " Refeições de hoje</div><h2>O que você comeu</h2></div>" +
          '<button class="history-toggle" onclick="acaoAlternarHistorico()">' + icon("history") + " Histórico (" + historyDays().length + ")</button>" +
        "</div>" +
        '<div class="meal-list">' + mealListTemplate() + "</div>" +
        historyPanelTemplate() +
        "</div>" +
      "</section>" +
      '<div class="footnote">' + icon("help") + "<p>Os valores são estimativas. O reconhecimento automático funciona com alimentos conhecidos e pode ser refinado com uma base nutricional maior.</p></div>"
    ) +
    "</main>";
}

function homeTemplate() {
  return '' +
    '<div class="app-shell">' +
    '<button class="hamburger-btn" onclick="acaoAbrirSidebar()" aria-label="Abrir menu"><span></span></button>' +
    sidebarTemplate() + editarPerfilTemplate() + mealDetalheModalTemplate() + nutrientInfoModalTemplate() + exameInfoModalTemplate() + cadastrarProdutoModalTemplate() +
    '<div class="home-content"><div class="home-inner">' +
    (state.account ? fullHomeTemplate() : lockedTemplate()) +
    "</div></div></div>";
}

/* ===================== render ===================== */
function captureFormState() {
  const customEl = document.getElementById("meal-nome-custom");
  const descEl = document.getElementById("meal-description");
  const mealDataEl = document.getElementById("meal-data");
  if (customEl) state.mealNomeCustom = customEl.value;
  if (descEl) state.mealDescription = descEl.value;
  if (mealDataEl) state.mealData = mealDataEl.value;

  const exposicaoInicioEl = document.getElementById("exposicao-inicio");
  if (exposicaoInicioEl) state.exposicaoInicio = exposicaoInicioEl.value;
  const exposicaoFimEl = document.getElementById("exposicao-fim");
  if (exposicaoFimEl) state.exposicaoFim = exposicaoFimEl.value;
  const exposicaoCeuEl = document.getElementById("exposicao-ceu");
  if (exposicaoCeuEl) state.exposicaoCeu = exposicaoCeuEl.value;

  const produtoNomeEl = document.getElementById("produto-nome");
  if (produtoNomeEl) state.produtoNome = produtoNomeEl.value;
  const produtoIngredientesEl = document.getElementById("produto-ingredientes");
  if (produtoIngredientesEl) state.produtoIngredientes = produtoIngredientesEl.value;
  // Mesmo motivo do comentário abaixo (bioimpedância/calorimetria): o cadastro manual de produto
  // também dispara render() no meio do preenchimento (ex.: ao trocar de aba, ou ao terminar a leitura
  // automática do rótulo) -- sem capturar aqui, o que a pessoa já tinha digitado nos campos se perderia.
  const produtoManualPorcaoEl = document.getElementById("produto-manual-porcao");
  if (produtoManualPorcaoEl) {
    state.produtoManualPorcao = produtoManualPorcaoEl.value;
    const valores = {};
    PRODUTO_MANUAL_CAMPOS.forEach((c) => {
      const el = document.getElementById("produto-manual-" + c.id);
      if (el) valores[c.id] = el.value;
    });
    state.produtoManualValores = valores;
  }

  // O formulário de bioimpedância/calorimetria também precisa sobreviver a um render() no meio do
  // preenchimento (ex.: ao escolher um anexo, que atualiza a prévia do arquivo chamando render()) —
  // sem isso, o render() reconstrói o HTML do zero e os campos já digitados voltavam em branco.
  const bioDataEl = document.getElementById("bio-data");
  if (bioDataEl) {
    const valores = { data: bioDataEl.value };
    BIOIMPEDANCIA_CAMPOS.forEach((c) => {
      const el = document.getElementById("bio-" + c);
      if (el) valores[c] = el.value;
    });
    state.bioFormValores = valores;
  }
  const caloDataEl = document.getElementById("calo-data");
  if (caloDataEl) {
    const valores = { data: caloDataEl.value };
    CALORIMETRIA_CAMPOS.forEach((c) => {
      const el = document.getElementById("calo-" + c);
      if (el) valores[c] = el.value;
    });
    // Fonte da TMB (ver tmbCampoTemplate()) -- não é um campo de CALORIMETRIA_CAMPOS porque é um grupo
    // de rádio (sem um único id), não um input avulso.
    const fonteEl = document.querySelector('input[name="calo-tmb-fonte"]:checked');
    if (fonteEl) valores.tmbFonte = fonteEl.value;
    state.caloFormValores = valores;
  }

  const treinoEsporteCustomEl = document.getElementById("treino-esporte-custom");
  if (treinoEsporteCustomEl) state.treinoEsporteCustom = treinoEsporteCustomEl.value;
  const treinoDataEl = document.getElementById("treino-data");
  if (treinoDataEl) state.treinoData = treinoDataEl.value;
  const treinoInicioEl = document.getElementById("treino-hora-inicio");
  if (treinoInicioEl) state.treinoHoraInicio = treinoInicioEl.value;
  const treinoFimEl = document.getElementById("treino-hora-fim");
  if (treinoFimEl) state.treinoHoraFim = treinoFimEl.value;
  const treinoNotaEl = document.getElementById("treino-nota");
  if (treinoNotaEl) state.treinoNota = treinoNotaEl.value;
  const treinoDistanciaEl = document.getElementById("treino-distancia");
  if (treinoDistanciaEl) state.treinoDistanciaKm = treinoDistanciaEl.value;

  // Campos de séries/repetições/peso de cada exercício marcado (ver treinoExercicioLinhaTemplate()) --
  // mesma lógica dos campos acima: precisa reler do DOM antes de cada render(), senão um valor já
  // digitado se perderia ao marcar outro exercício ou adicionar outro grupo no meio do preenchimento.
  Object.keys(state.treinoExerciciosMarcados).forEach((chave) => {
    const partes = chave.split("::");
    const domPrefixo = treinoExercicioDomPrefixo(partes[0], partes[1]);
    const seriesEl = document.getElementById(domPrefixo + "-series");
    const repeticoesEl = document.getElementById(domPrefixo + "-repeticoes");
    const pesoEl = document.getElementById(domPrefixo + "-peso");
    if (!seriesEl && !repeticoesEl && !pesoEl) return; // bloco desse grupo não está montado agora
    const atual = state.treinoExerciciosMarcados[chave] || {};
    state.treinoExerciciosMarcados[chave] = {
      series: seriesEl ? seriesEl.value : atual.series || "",
      repeticoes: repeticoesEl ? repeticoesEl.value : atual.repeticoes || "",
      peso: pesoEl ? pesoEl.value : atual.peso || "",
    };
  });

  const novoExercicioEl = document.getElementById("treino-novo-exercicio-nome");
  if (novoExercicioEl) state.treinoNovoExercicioNome = novoExercicioEl.value;
}
function render() {
  captureFormState();
  document.getElementById("app").innerHTML = state.usuario ? homeTemplate() : authTemplate();
}

/* ===================== instalar como app (PWA) ===================== */
let installPromptEvent = null;
function initInstallPrompt() {
  window.addEventListener("beforeinstallprompt", (event) => {
    event.preventDefault();
    installPromptEvent = event;
    const banner = document.createElement("div");
    banner.className = "install-banner";
    banner.id = "install-banner";
    banner.innerHTML = '<div class="install-icon">' + icon("download") + '</div>' +
      '<div class="install-text"><div class="title">Instalar o NutriTrack</div><div class="sub">Use como app, direto pelo Chrome.</div></div>' +
      '<button class="install-btn" onclick="doInstall()">Instalar</button>' +
      '<button class="install-close" aria-label="Fechar aviso de instalação" onclick="document.getElementById(\'install-banner\').remove()">' + icon("x") + "</button>";
    document.body.appendChild(banner);
  });
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(() => {});
}
async function doInstall() {
  if (!installPromptEvent) return;
  await installPromptEvent.prompt();
  installPromptEvent = null;
  const banner = document.getElementById("install-banner");
  if (banner) banner.remove();
}

/* ===================== inicialização ===================== */
// Processa a virada de dia ANTES do primeiro render -- pega qualquer dia (ou vários, se o app ficou
// fechado) que já tenha virado desde a última vez que o app foi aberto, pra abrir a tela já com os
// cards/listas "de hoje" corretos (ver processarViradaDeDia()), sem precisar de um segundo render logo
// em seguida.
processarViradaDeDia();
render();
initInstallPrompt();
if (state.usuario) sincronizarDoServidor();
// Se havia um treino em andamento quando o app foi fechado/recarregado, retoma o cronômetro na tela
// (o tempo decorrido é sempre recalculado a partir do timestamp salvo, então não se perde nada).
iniciarTickTreinoSeNecessario();
// Enquanto o app ficar aberto e em primeiro plano (ex.: esquecido aberto numa aba do PC durante a
// noite), verifica a cada minuto se a meia-noite já passou -- sem isso, a virada só seria detectada na
// próxima vez que o app fosse reaberto/recarregado (ver verificarViradaDeDia()). Um minuto é preciso o
// suficiente (ninguém precisa que os cards zerem no segundo exato da meia-noite) e não pesa nada rodar
// em segundo plano.
setInterval(verificarViradaDeDia, 60000);

// Em celular, abrir um seletor nativo (ex.: o calendário do campo de data) costuma disparar um
// "visibilitychange" no navegador (a página é considerada momentaneamente escondida enquanto o
// seletor do sistema fica por cima) — sem essa checagem, isso re-sincronizava e reconstruía o
// formulário bem no meio da escolha da data, fazendo o valor escolhido às vezes não "pegar" de
// primeira. Por isso, enquanto um formulário de edição estiver aberto, a sincronização espera —
// mexer nos dados de outro aparelho pode esperar até a pessoa terminar de editar.
function formularioDeEdicaoAberto() {
  return state.showFormBioimpedancia || state.showEditarPerfil || state.showGoals;
}

// Ao trocar de app/aba e voltar (ex.: usar o celular depois do PC), busca de novo os dados no nosso
// próprio backend — nunca no Google diretamente — para refletir o que foi salvo em outro aparelho
// enquanto este ficava parado em segundo plano. Sem isso, o app só atualizava na abertura (boot), e
// ficava com dados desatualizados até ser fechado e reaberto de verdade.
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && !formularioDeEdicaoAberto()) { verificarViradaDeDia(); sincronizarDoServidor(); }
});
window.addEventListener("focus", () => { if (!formularioDeEdicaoAberto()) { verificarViradaDeDia(); sincronizarDoServidor(); } });
</script>
